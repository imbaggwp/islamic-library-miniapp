<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Уроки и Книги</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
body { 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f3f4f6; 
    overscroll-behavior: none;
}
.app { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; position: relative; padding-bottom: 70px; }
.header { background: white; border-bottom: 1px solid #e5e7eb; padding: 16px; position: sticky; top: 0; z-index: 10; }
.header h1 { font-size: 20px; font-weight: 700; }
.header p { font-size: 13px; color: #6b7280; margin-top: 2px; }
.content { padding: 16px; }
.tab { display: none; }
.tab.active { display: block; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e7eb; max-width: 500px; margin: 0 auto; display: flex; justify-content: space-around; padding: 8px 0; z-index: 10; }
.nav-btn { background: none; border: none; padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: #6b7280; font-size: 11px; }
.nav-btn.active { color: #3b82f6; }
.nav-btn span:first-child { font-size: 22px; margin-bottom: 2px; }
.card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
.card:hover { background: #f9fafb; }
.card-title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card-sub { font-size: 13px; color: #6b7280; margin-top: 4px; }
.progress-bar { background: #e5e7eb; height: 4px; border-radius: 2px; margin-top: 8px; overflow: hidden; }
.progress-fill { background: #3b82f6; height: 100%; transition: width 0.3s; }
.btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; width: 100%; margin-bottom: 8px; }
.btn-primary { background: #3b82f6; color: white; }
.btn-success { background: #10b981; color: white; }
.btn-purple { background: #8b5cf6; color: white; }
.btn-danger { background: #ef4444; color: white; }
.btn-secondary { background: #e5e7eb; color: #374151; }
input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; margin-bottom: 12px; }
input:focus, textarea:focus, select:focus { outline: none; border-color: #3b82f6; }
label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: #374151; }
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
.modal.active { display: flex; }
.modal-content { background: white; border-radius: 12px; padding: 20px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #6b7280; }
.audio-player { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 16px; padding: 20px; color: white; }
.audio-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
.audio-controls button { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
.play-btn { font-size: 48px !important; }
.achievement { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: #f9fafb; border-radius: 8px; margin-bottom: 8px; }
.achievement.earned { background: linear-gradient(135deg, #fef3c7, #fde68a); }
.heat-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.heat-cell { aspect-ratio: 1; border-radius: 2px; background: #ebedf0; }
.heat-1 { background: #9be9a8; }
.heat-2 { background: #40c463; }
.heat-3 { background: #30a14e; }
.heat-4 { background: #216e39; }
.ring-container { display: flex; justify-content: center; margin: 20px 0; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; }
.stat-value { font-size: 24px; font-weight: 700; color: #3b82f6; }
.stat-label { font-size: 12px; color: #6b7280; }
.editor-tree-item { background: #f9fafb; border-radius: 8px; padding: 10px; margin-bottom: 6px; }
.editor-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.editor-actions button { padding: 6px 10px; font-size: 12px; border: none; border-radius: 6px; cursor: pointer; background: #e5e7eb; }
.editor-actions button:hover { background: #d1d5db; }
.pdf-viewer { background: #525659; min-height: 400px; display: flex; align-items: center; justify-content: center; padding: 16px; }
.pdf-controls { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #1f2937; color: white; }
.pdf-controls button { background: #374151; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
.empty { text-align: center; padding: 40px 20px; color: #9ca3af; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.badge { display: inline-block; background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.completed-badge { background: #d1fae5; color: #065f46; }
</style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1 id="header-title">Уроки и Книги</h1>
        <p id="header-sub">Добро пожаловать!</p>
    </div>

    <div class="content">
        <!-- УРОКИ -->
        <div id="tab-lessons" class="tab active">
            <div id="lessons-content"></div>
        </div>

        <!-- КНИГИ -->
        <div id="tab-books" class="tab">
            <div id="books-content"></div>
        </div>

        <!-- ПРОГРЕСС -->
        <div id="tab-progress" class="tab">
            <div id="progress-content"></div>
        </div>

        <!-- ПРОФИЛЬ -->
        <div id="tab-profile" class="tab">
            <div id="profile-content"></div>
        </div>

        <!-- РЕДАКТОР -->
        <div id="tab-editor" class="tab">
            <div id="editor-content"></div>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('lessons')"><span>🎧</span><span>Уроки</span></button>
        <button class="nav-btn" onclick="switchTab('books')"><span>📚</span><span>Книги</span></button>
        <button class="nav-btn" onclick="switchTab('progress')"><span>📊</span><span>Прогресс</span></button>
        <button class="nav-btn" onclick="switchTab('profile')"><span>👤</span><span>Профиль</span></button>
        <button class="nav-btn" onclick="switchTab('editor')"><span>⚙️</span><span>Редактор</span></button>
    </div>
</div>

<!-- Модалка общая -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div id="modal-body"></div>
    </div>
</div>

<!-- Аудиоплеер -->
<div id="audio-modal" class="modal">
    <div class="modal-content" style="padding: 0; overflow: hidden;">
        <div id="audio-body"></div>
    </div>
</div>

<!-- PDF ридер -->
<div id="pdf-modal" class="modal">
    <div class="modal-content" style="padding: 0; overflow: hidden; max-width: 100%; max-height: 100vh;">
        <div id="pdf-body"></div>
    </div>
</div>

<audio id="audio-player"></audio>

<script>
// ============ LOCALSTORAGE ХРАНИЛИЩЕ ============
const DB = {
    get(key, def = []) {
        try { return JSON.parse(localStorage.getItem('la_' + key)) || def; }
        catch { return def; }
    },
    set(key, val) {
        localStorage.setItem('la_' + key, JSON.stringify(val));
    },
    nextId(key) {
        const items = this.get(key);
        return items.length ? Math.max(...items.map(i => i.id)) + 1 : 1;
    }
};

// ============ СОСТОЯНИЕ ============
const state = {
    user: null,
    currentTab: 'lessons',
    currentCategory: null,
    currentLesson: null,
    currentBook: null,
    audio: document.getElementById('audio-player'),
    pdfDoc: null,
    pdfPage: 1
};

// ============ ИНИЦИАЛИЗАЦИЯ ============
function init() {
    let user = DB.get('user', null);
    if (!user) {
        const name = prompt('Как тебя зовут?') || 'Пользователь';
        user = { id: 1, name: name, created: new Date().toISOString() };
        DB.set('user', user);
    }
    state.user = user;
    document.getElementById('header-sub').textContent = `Привет, ${user.name}!`;
    renderTab();
}

// ============ НАВИГАЦИЯ ============
function switchTab(tab) {
    state.currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach((b, i) => {
        b.classList.toggle('active', ['lessons','books','progress','profile','editor'][i] === tab);
    });
    renderTab();
}

function renderTab() {
    if (state.currentTab === 'lessons') renderLessons();
    if (state.currentTab === 'books') renderBooks();
    if (state.currentTab === 'progress') renderProgress();
    if (state.currentTab === 'profile') renderProfile();
    if (state.currentTab === 'editor') renderEditor();
}

// ============ УТИЛИТЫ ============
function formatDuration(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

function getProgress(type, id) {
    const all = DB.get('progress');
    return all.find(p => p.type === type && p.contentId === id);
}

function saveProgress(type, id, percent, position, completed) {
    const all = DB.get('progress');
    const idx = all.findIndex(p => p.type === type && p.contentId === id);
    const data = {
        type, contentId: id, percent, position,
        completed: completed || false,
        lastAccess: new Date().toISOString(),
        date: new Date().toISOString().split('T')[0]
    };
    if (idx >= 0) all[idx] = { ...all[idx], ...data };
    else all.push(data);
    DB.set('progress', all);
    checkAchievements();
}

function isFavorite(type, id) {
    return DB.get('favorites').some(f => f.type === type && f.contentId === id);
}

function toggleFavorite(type, id) {
    let favs = DB.get('favorites');
    const idx = favs.findIndex(f => f.type === type && f.contentId === id);
    if (idx >= 0) favs.splice(idx, 1);
    else favs.push({ type, contentId: id, added: new Date().toISOString() });
    DB.set('favorites', favs);
}

// ============ КАТЕГОРИИ / ДЕРЕВО ============
function getCategories() { return DB.get('categories'); }
function getLessons() { return DB.get('lessons'); }
function getBooks() { return DB.get('books'); }

function buildTree(parentId = null) {
    const cats = getCategories();
    return cats
        .filter(c => (c.parentId || null) === parentId)
        .sort((a, b) => (a.order || 0) - (b.order || 0))
        .map(c => ({
            ...c,
            children: buildTree(c.id),
            lessons: getLessons().filter(l => l.categoryId === c.id),
            books: getBooks().filter(b => b.categoryId === c.id)
        }));
}

function findCategory(id) {
    return getCategories().find(c => c.id === id);
}

function getAllDescendantIds(catId) {
    const cats = getCategories();
    const result = [catId];
    const children = cats.filter(c => c.parentId === catId);
    children.forEach(ch => result.push(...getAllDescendantIds(ch.id)));
    return result;
}

function getCategoryPath(catId) {
    const path = [];
    let cur = findCategory(catId);
    while (cur) {
        path.unshift(cur);
        cur = cur.parentId ? findCategory(cur.parentId) : null;
    }
    return path;
}

// ============ РЕНДЕР УРОКОВ ============
function renderLessons() {
    const container = document.getElementById('lessons-content');
    if (state.currentCategory) {
        renderCategoryView(container, 'lesson');
    } else {
        renderRootList(container, 'lesson');
    }
}

function renderBooks() {
    const container = document.getElementById('books-content');
    if (state.currentCategory) {
        renderCategoryView(container, 'book');
    } else {
        renderRootList(container, 'book');
    }
}

function renderRootList(container, type) {
    const tree = buildTree(null);
    const title = type === 'lesson' ? '🎧 Уроки' : '📚 Книги';
    
    // Избранное
    const favs = DB.get('favorites').filter(f => f.type === type);
    
    let html = `<h2 style="font-size: 18px; font-weight: 700; margin-bottom: 12px;">${title}</h2>`;
    
    if (favs.length > 0) {
        html += `<div class="card" onclick="showFavorites('${type}')" style="background: linear-gradient(135deg, #fef3c7, #fde68a);">
            <div class="card-title">❤️ Избранное <span class="badge">${favs.length}</span></div>
        </div>`;
    }
    
    if (tree.length === 0) {
        html += `<div class="empty"><div class="empty-icon">📭</div>Пока нет разделов.<br>Перейди в Редактор, чтобы создать.</div>`;
    } else {
        html += renderTreeList(tree, type);
    }
    
    container.innerHTML = html;
}

function renderTreeList(tree, type, depth = 0) {
    return tree.map(cat => {
        const items = type === 'lesson' ? cat.lessons : cat.books;
        const totalItems = countItemsInTree(cat, type);
        const indent = depth * 16;
        return `
            <div class="card" style="margin-left: ${indent}px;" onclick="openCategory(${cat.id}, '${type}')">
                <div class="card-title">${cat.emoji || '📂'} ${escapeHtml(cat.title)}</div>
                <div class="card-sub">${totalItems} ${type === 'lesson' ? 'уроков' : 'книг'}${cat.children.length ? ` • ${cat.children.length} подразделов` : ''}</div>
            </div>
        `;
    }).join('');
}

function countItemsInTree(cat, type) {
    let count = (type === 'lesson' ? cat.lessons : cat.books).length;
    cat.children.forEach(ch => count += countItemsInTree(ch, type));
    return count;
}

function openCategory(id, type) {
    state.currentCategory = id;
    renderTab();
}

function renderCategoryView(container, type) {
    const cat = findCategory(state.currentCategory);
    if (!cat) { state.currentCategory = null; renderTab(); return; }
    
    const path = getCategoryPath(cat.id);
    const lessons = getLessons().filter(l => l.categoryId === cat.id);
    const books = getBooks().filter(b => b.categoryId === cat.id);
    const subcats = getCategories().filter(c => c.parentId === cat.id);
    
    let html = `
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
            <button onclick="goBack()" style="background: none; border: none; font-size: 20px; cursor: pointer;">←</button>
            <div style="font-size: 13px; color: #6b7280;">
                ${path.map(p => escapeHtml(p.title)).join(' / ')}
            </div>
        </div>
        <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 4px;">${cat.emoji || '📂'} ${escapeHtml(cat.title)}</h2>
        ${cat.description ? `<p style="color: #6b7280; font-size: 14px; margin-bottom: 16px;">${escapeHtml(cat.description)}</p>` : '<div style="height: 16px;"></div>'}
    `;
    
    if (type === 'lesson' || type === 'all') {
        if (lessons.length > 0) {
            html += `<h3 style="font-size: 14px; font-weight: 600; color: #6b7280; margin: 12px 0 8px;">🎧 УРОКИ</h3>`;
            html += lessons.map(l => {
                const p = getProgress('lesson', l.id);
                const pct = p ? p.percent : 0;
                const fav = isFavorite('lesson', l.id);
                return `
                    <div class="card" onclick="openLesson(${l.id})">
                        <div class="card-title">
                            ${escapeHtml(l.title)}
                            ${p?.completed ? '<span class="badge completed-badge">✓</span>' : ''}
                            ${fav ? '❤️' : ''}
                        </div>
                        <div class="card-sub">⏱ ${formatDuration(l.duration)}${p && !p.completed ? ` • ${Math.round(pct)}%` : ''}</div>
                        ${pct > 0 && !p?.completed ? `<div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>` : ''}
                    </div>
                `;
            }).join('');
        }
    }
    
    if (type === 'book' || type === 'all') {
        if (books.length > 0) {
            html += `<h3 style="font-size: 14px; font-weight: 600; color: #6b7280; margin: 12px 0 8px;">📚 КНИГИ</h3>`;
            html += books.map(b => {
                const p = getProgress('book', b.id);
                const pct = p ? p.percent : 0;
                const fav = isFavorite('book', b.id);
                return `
                    <div class="card" onclick="openBook(${b.id})">
                        <div class="card-title">
                            ${escapeHtml(b.title)}
                            ${p?.completed ? '<span class="badge completed-badge">✓</span>' : ''}
                            ${fav ? '❤️' : ''}
                        </div>
                        <div class="card-sub">${b.author ? escapeHtml(b.author) + ' • ' : ''}📄 ${b.pages} стр.${p && !p.completed ? ` • ${Math.round(pct)}%` : ''}</div>
                        ${pct > 0 && !p?.completed ? `<div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>` : ''}
                    </div>
                `;
            }).join('');
        }
    }
    
    if (subcats.length > 0) {
        html += `<h3 style="font-size: 14px; font-weight: 600; color: #6b7280; margin: 12px 0 8px;">📂 ПОДРАЗДЕЛЫ</h3>`;
        const subTree = subcats.map(c => ({
            ...c,
            children: buildTree(c.id).map(ch => ({...ch, lessons: getLessons().filter(l => l.categoryId === ch.id), books: getBooks().filter(b => b.categoryId === ch.id)})),
            lessons: getLessons().filter(l => l.categoryId === c.id),
            books: getBooks().filter(b => b.categoryId === c.id)
        }));
        html += renderTreeList(subTree, type, 0);
    }
    
    if (lessons.length === 0 && books.length === 0 && subcats.length === 0) {
        html += `<div class="empty"><div class="empty-icon">📭</div>Раздел пуст</div>`;
    }
    
    container.innerHTML = html;
}

function goBack() {
    const cat = findCategory(state.currentCategory);
    state.currentCategory = cat?.parentId || null;
    renderTab();
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ============ ИЗБРАННОЕ ============
function showFavorites(type) {
    const favs = DB.get('favorites').filter(f => f.type === type);
    const items = type === 'lesson' ? getLessons() : getBooks();
    const favItems = favs.map(f => items.find(i => i.id === f.contentId)).filter(Boolean);
    
    const title = type === 'lesson' ? '❤️ Избранные уроки' : '❤️ Избранные книги';
    let html = `
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
            <button onclick="renderTab()" style="background: none; border: none; font-size: 20px; cursor: pointer;">←</button>
            <h2 style="font-size: 18px; font-weight: 700;">${title}</h2>
        </div>
    `;
    
    if (favItems.length === 0) {
        html += `<div class="empty"><div class="empty-icon">💔</div>Нет избранных</div>`;
    } else {
        favItems.forEach(item => {
            const p = getProgress(type, item.id);
            const pct = p ? p.percent : 0;
            html += `
                <div class="card" onclick="${type === 'lesson' ? `openLesson(${item.id})` : `openBook(${item.id})`}">
                    <div class="card-title">${escapeHtml(item.title)} ${p?.completed ? '<span class="badge completed-badge">✓</span>' : ''}</div>
                    <div class="card-sub">${type === 'lesson' ? '⏱ ' + formatDuration(item.duration) : '📄 ' + item.pages + ' стр.'}</div>
                    ${pct > 0 && !p?.completed ? `<div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>` : ''}
                </div>
            `;
        });
    }
    
    document.getElementById(state.currentTab === 'lessons' ? 'lessons-content' : 'books-content').innerHTML = html;
}

// ============ АУДИОПЛЕЕР ============
function openLesson(id) {
    const lesson = getLessons().find(l => l.id === id);
    if (!lesson) return;
    state.currentLesson = lesson;
    
    const p = getProgress('lesson', id);
    state.audio.src = lesson.audioUrl;
    if (p) state.audio.currentTime = p.position || 0;
    
    const fav = isFavorite('lesson', id);
    
    document.getElementById('audio-body').innerHTML = `
        <div class="audio-player">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="font-size: 18px; font-weight: 700;">${escapeHtml(lesson.title)}</h2>
                <button onclick="closeAudio()" style="background: none; border: none; color: white; font-size: 28px; cursor: pointer;">×</button>
            </div>
            ${lesson.description ? `<p style="opacity: 0.9; margin-bottom: 16px; font-size: 14px;">${escapeHtml(lesson.description)}</p>` : ''}
            <div style="margin-bottom: 16px;">
                <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px;">
                    <span id="cur-time">0:00</span>
                    <span>${formatDuration(lesson.duration)}</span>
                </div>
                <input type="range" id="seek" min="0" max="${lesson.duration}" value="0" 
                       style="width: 100%; margin: 0;" oninput="seekAudio(this.value)">
            </div>
            <div class="audio-controls">
                <button onclick="skipAudio(-15)">⏪</button>
                <button class="play-btn" id="play-btn" onclick="togglePlay()">▶️</button>
                <button onclick="skipAudio(15)">⏩</button>
            </div>
            <div style="display: flex; gap: 8px;">
                <button onclick="handleFav('lesson', ${id})" class="btn" style="background: rgba(255,255,255,0.2); color: white; margin: 0;">
                    ${fav ? '💔 Убрать' : '❤️ В избранное'}
                </button>
                <button onclick="completeLesson()" class="btn" style="background: rgba(255,255,255,0.2); color: white; margin: 0;">
                    ✓ Завершить
                </button>
            </div>
        </div>
    `;
    
    document.getElementById('audio-modal').classList.add('active');
    updateAudioTime();
}

function togglePlay() {
    if (state.audio.paused) {
        state.audio.play().catch(e => alert('Не удалось воспроизвести. Возможно, ссылка недоступна или нужен HTTP-сервер (не file://).'));
        document.getElementById('play-btn').textContent = '⏸️';
    } else {
        state.audio.pause();
        document.getElementById('play-btn').textContent = '▶️';
    }
}

function seekAudio(v) {
    state.audio.currentTime = parseFloat(v);
}

function skipAudio(sec) {
    state.audio.currentTime = Math.max(0, state.audio.currentTime + sec);
}

function updateAudioTime() {
    const ct = document.getElementById('cur-time');
    const seek = document.getElementById('seek');
    if (ct) ct.textContent = formatDuration(state.audio.currentTime);
    if (seek && !seek.matches(':active')) seek.value = state.audio.currentTime;
    
    if (state.currentLesson && state.audio.duration) {
        const pct = (state.audio.currentTime / state.audio.duration) * 100;
        saveProgress('lesson', state.currentLesson.id, pct, state.audio.currentTime, false);
    }
}

state.audio.addEventListener('timeupdate', updateAudioTime);
state.audio.addEventListener('ended', () => {
    if (state.currentLesson) {
        saveProgress('lesson', state.currentLesson.id, 100, state.currentLesson.duration, true);
        document.getElementById('play-btn').textContent = '▶️';
    }
});

function completeLesson() {
    if (!state.currentLesson) return;
    saveProgress('lesson', state.currentLesson.id, 100, state.currentLesson.duration, true);
    closeAudio();
    alert('🎉 Урок завершён!');
}

function closeAudio() {
    state.audio.pause();
    document.getElementById('audio-modal').classList.remove('active');
    renderTab();
}

// ============ PDF РИДЕР ============
async function openBook(id) {
    const book = getBooks().find(b => b.id === id);
    if (!book) return;
    state.currentBook = book;
    
    const p = getProgress('book', id);
    state.pdfPage = p ? (p.position || 1) : 1;
    
    const fav = isFavorite('book', id);
    
    document.getElementById('pdf-body').innerHTML = `
        <div style="display: flex; flex-direction: column; height: 100vh;">
            <div style="padding: 12px; background: #1f2937; color: white; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-weight: 700;">${escapeHtml(book.title)}</div>
                    <div style="font-size: 12px; opacity: 0.7;">${book.author ? escapeHtml(book.author) : ''}</div>
                </div>
                <button onclick="closePdf()" style="background: none; border: none; color: white; font-size: 28px; cursor: pointer;">×</button>
            </div>
            <div class="pdf-viewer" id="pdf-viewer" style="flex: 1; overflow: auto;">
                <canvas id="pdf-canvas"></canvas>
            </div>
            <div class="pdf-controls">
                <button onclick="pdfPrev()">← Назад</button>
                <div><span id="p-cur">${state.pdfPage}</span> / <span id="p-total">${book.pages}</span></div>
                <button onclick="pdfNext()">Вперёд →</button>
            </div>
            <div style="padding: 12px; background: #1f2937; display: flex; gap: 8px;">
                <button onclick="handleFav('book', ${id})" style="flex: 1; padding: 10px; background: #374151; color: white; border: none; border-radius: 6px; cursor: pointer;">
                    ${fav ? '💔 Убрать' : '❤️ Избранное'}
                </button>
                <button onclick="completeBook()" style="flex: 1; padding: 10px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer;">
                    ✓ Прочитано
                </button>
            </div>
        </div>
    `;
    
    document.getElementById('pdf-modal').classList.add('active');
    
    try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        state.pdfDoc = await pdfjsLib.getDocument(book.pdfUrl).promise;
        document.getElementById('p-total').textContent = state.pdfDoc.numPages;
        renderPdfPage();
    } catch (e) {
        document.getElementById('pdf-viewer').innerHTML = `<div style="color: white; text-align: center; padding: 20px;">Не удалось загрузить PDF.<br>Возможно, нужен HTTP-сервер (не file://).<br><br><small>${e.message}</small></div>`;
    }
}

async function renderPdfPage() {
    if (!state.pdfDoc) return;
    const page = await state.pdfDoc.getPage(state.pdfPage);
    const scale = 1.5;
    const viewport = page.getViewport({ scale });
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width = viewport.width;
    await page.render({ canvasContext: ctx, viewport }).promise;
    document.getElementById('p-cur').textContent = state.pdfPage;
    
    if (state.currentBook) {
        const pct = (state.pdfPage / state.currentBook.pages) * 100;
        saveProgress('book', state.currentBook.id, pct, state.pdfPage, false);
    }
}

function pdfNext() {
    if (state.pdfDoc && state.pdfPage < state.pdfDoc.numPages) {
        state.pdfPage++;
        renderPdfPage();
    }
}

function pdfPrev() {
    if (state.pdfPage > 1) {
        state.pdfPage--;
        renderPdfPage();
    }
}

function completeBook() {
    if (!state.currentBook) return;
    saveProgress('book', state.currentBook.id, 100, state.currentBook.pages, true);
    closePdf();
    alert('🎉 Книга прочитана!');
}

function closePdf() {
    document.getElementById('pdf-modal').classList.remove('active');
    state.pdfDoc = null;
    renderTab();
}

// ============ ИЗБРАННОЕ (toggle) ============
function handleFav(type, id) {
    toggleFavorite(type, id);
    if (type === 'lesson' && state.currentLesson) openLesson(id);
    if (type === 'book' && state.currentBook) openBook(id);
}

// ============ ПРОГРЕСС ============
function renderProgress() {
    const progress = DB.get('progress');
    const lessons = getLessons();
    const books = getBooks();
    
    const totalL = lessons.length;
    const totalB = books.length;
    const doneL = progress.filter(p => p.type === 'lesson' && p.completed).length;
    const doneB = progress.filter(p => p.type === 'book' && p.completed).length;
    
    const avgPct = progress.length ? progress.reduce((s, p) => s + (p.percent || 0), 0) / progress.length : 0;
    
    const totalTime = progress.reduce((s, p) => s + (p.position || 0), 0);
    const hours = Math.floor(totalTime / 3600);
    
    // Тепловая карта (последние 28 дней)
    const heatData = {};
    progress.forEach(p => {
        if (p.date) heatData[p.date] = (heatData[p.date] || 0) + 1;
    });
    
    let heatCells = '';
    for (let i = 27; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().split('T')[0];
        const count = heatData[key] || 0;
        const level = count === 0 ? 0 : count === 1 ? 1 : count === 2 ? 2 : count <= 4 ? 3 : 4;
        heatCells += `<div class="heat-cell heat-${level}" title="${key}: ${count}"></div>`;
    }
    
    // Достижения
    const achievements = getAchievementsList();
    const earned = DB.get('achievements').map(a => a.type);
    
    document.getElementById('progress-content').innerHTML = `
        <div style="background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 16px; padding: 20px; color: white; margin-bottom: 16px;">
            <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">🏆 Общий прогресс</h2>
            <div class="ring-container">
                <svg width="140" height="140" style="transform: rotate(-90deg);">
                    <circle cx="70" cy="70" r="55" stroke="rgba(255,255,255,0.2)" stroke-width="12" fill="none"/>
                    <circle cx="70" cy="70" r="55" stroke="white" stroke-width="12" fill="none"
                            stroke-dasharray="${2 * Math.PI * 55}"
                            stroke-dashoffset="${2 * Math.PI * 55 * (1 - avgPct / 100)}"
                            stroke-linecap="round"/>
                    <text x="70" y="70" text-anchor="middle" dy=".3em" font-size="24" font-weight="bold" fill="white" transform="rotate(90 70 70)">${Math.round(avgPct)}%</text>
                </svg>
            </div>
            <div class="stats-grid">
                <div><div class="stat-value" style="color: white;">${doneL}/${totalL}</div><div class="stat-label" style="color: rgba(255,255,255,0.8);">Уроков</div></div>
                <div><div class="stat-value" style="color: white;">${doneB}/${totalB}</div><div class="stat-label" style="color: rgba(255,255,255,0.8);">Книг</div></div>
                <div><div class="stat-value" style="color: white;">${hours}ч</div><div class="stat-label" style="color: rgba(255,255,255,0.8);">Время</div></div>
            </div>
        </div>
        
        <div style="background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 16px;">
            <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">📈 Активность (28 дней)</h3>
            <div class="heat-grid">${heatCells}</div>
            <div style="display: flex; justify-content: space-between; font-size: 10px; color: #9ca3af; margin-top: 6px;">
                <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
            </div>
        </div>
        
        <div style="background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px;">
            <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">🎖 Достижения (${earned.length}/${achievements.length})</h3>
            ${achievements.map(a => `
                <div class="achievement ${earned.includes(a.type) ? 'earned' : ''}">
                    <div>
                        <div style="font-weight: 600;">${a.icon} ${a.title}</div>
                        <div style="font-size: 12px; color: #6b7280;">${a.desc}</div>
                    </div>
                    <div style="font-size: 22px;">${earned.includes(a.type) ? '✅' : '🔒'}</div>
                </div>
            `).join('')}
        </div>
    `;
}

function getAchievementsList() {
    const progress = DB.get('progress');
    const doneL = progress.filter(p => p.type === 'lesson' && p.completed).length;
    const doneB = progress.filter(p => p.type === 'book' && p.completed).length;
    const totalSec = progress.reduce((s, p) => s + (p.position || 0), 0);
    
    return [
        { type: 'first_lesson', icon: '🌱', title: 'Первые шаги', desc: 'Пройти 1 урок', cond: doneL >= 1 },
        { type: 'first_book', icon: '📖', title: 'Первая книга', desc: 'Завершить 1 книгу', cond: doneB >= 1 },

        { type: 'hour', icon: '⏱', title: 'Час знаний', desc: '1 час прослушано', cond: totalSec >= 3600 },
        { type: 'ten_hours', icon: '🎧', title: 'Аудиофил', desc: '10 часов', cond: totalSec >= 36000 }
    ];

function checkAchievements() {
    const list = getAchievementsList();
    const earned = DB.get('achievements').map(a => a.type);
    let newOnes = [];
    list.forEach(a => {
        if (a.cond && !earned.includes(a.type)) {
            DB.set('achievements', [...DB.get('achievements'), { type: a.type, date: new Date().toISOString() }]);
            newOnes.push(a);
        }
    });
    if (newOnes.length > 0) {
        setTimeout(() => {
            alert('🎉 Новое достижение!\n\n' + newOnes.map(a => `${a.icon} ${a.title}`).join('\n'));
        }, 100);
    }
}

function renderEditor() {
    const tree = buildTree(null);
    
    let html = `
        <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 12px;">⚙️ Редактор</h2>
        
        <button onclick="showCatForm()" class="btn btn-primary">📂 Создать корневой раздел</button>
        <button onclick="showLessonForm()" class="btn btn-success">🎧 Создать урок</button>
        <button onclick="showBookForm()" class="btn btn-purple">📚 Создать книгу</button>
        
        <h3 style="font-size: 15px; font-weight: 700; margin: 20px 0 12px;">📂 Структура контента</h3>
    `;
    
    if (tree.length === 0) {
        html += `<div class="empty"><div class="empty-icon">🌱</div>Создай первый раздел!</div>`;
    } else {
        html += renderEditorTree(tree);
    }
    
    document.getElementById('editor-content').innerHTML = html;
}

function renderEditorTree(tree) {
    return tree.map(cat => {
        const lessons = getLessons().filter(l => l.categoryId === cat.id);
        const books = getBooks().filter(b => b.categoryId === cat.id);
        
        let html = `
            <div class="editor-tree-item">
                <div style="display: flex; justify-content: space-between; align-items: start;">
                    <div>
                        <div style="font-weight: 600;">${cat.emoji || '📂'} ${escapeHtml(cat.title)}</div>
                        <div style="font-size: 12px; color: #6b7280; margin-top: 2px;">
                            🎧 ${lessons.length} уроков • 📚 ${books.length} книг
                        </div>
                    </div>
                </div>
                <div class="editor-actions">
                    <button onclick="showCatForm(${cat.id})">✏️ Ред.</button>
                    <button onclick="showCatForm(null, ${cat.id})">➕ Подраздел</button>
                    <button onclick="showLessonForm(${cat.id})">🎧 Урок</button>
                    <button onclick="showBookForm(${cat.id})">📚 Книга</button>
                    <button onclick="deleteCat(${cat.id})" style="background: #fee2e2; color: #991b1b;">🗑</button>
                </div>
                ${lessons.length ? '<div style="margin-top: 8px; font-size: 12px; color: #6b7280;"><b>Уроки:</b> ' + lessons.map(l => `<span style="cursor: pointer; color: #3b82f6;" onclick="showLessonForm(null, ${l.id})">${escapeHtml(l.title)}</span>`).join(', ') + '</div>' : ''}
                ${books.length ? '<div style="margin-top: 4px; font-size: 12px; color: #6b7280;"><b>Книги:</b> ' + books.map(b => `<span style="cursor: pointer; color: #8b5cf6;" onclick="showBookForm(null, ${b.id})">${escapeHtml(b.title)}</span>`).join(', ') + '</div>' : ''}
            </div>
        `;
        
        if (cat.children.length > 0) {
            html += `<div style="margin-left: 16px;">${renderEditorTree(cat.children)}</div>`;
        }
        
        return html;
    }).join('');
}

function showCatForm(editId = null, parentId = null) {
    const cat = editId ? findCategory(editId) : null;
    const title = cat ? 'Редактировать раздел' : 'Новый раздел';
    
    const allCats = getCategories();
    const parentOptions = '<option value="">— Корневой —</option>' + 
        allCats.filter(c => c.id !== editId).map(c => 
            `<option value="${c.id}" ${(cat?.parentId || parentId) === c.id ? 'selected' : ''}>${c.emoji || '📂'} ${escapeHtml(c.title)}</option>`
        ).join('');
    
    document.getElementById('modal-body').innerHTML = `
        <div class="modal-title">${title} <button class="close-btn" onclick="closeModal()">×</button></div>
        <form onsubmit="saveCat(event, ${editId || 'null'})">
            <label>Название *</label>
            <input type="text" id="f-title" value="${cat ? escapeHtml(cat.title) : ''}" required>
            
            <label>Эмодзи</label>
            <input type="text" id="f-emoji" value="${cat?.emoji || ''}" maxlength="4" placeholder="📂">
            
            <label>Родитель</label>
            <select id="f-parent">${parentOptions}</select>
            
            <label>Описание</label>
            <textarea id="f-desc" rows="3">${cat?.description || ''}</textarea>
            
            <button type="submit" class="btn btn-primary">💾 Сохранить</button>
            <button type="button" onclick="closeModal()" class="btn btn-secondary">Отмена</button>
        </form>
    `;
    document.getElementById('modal').classList.add('active');
}

function saveCat(e, editId) {
    e.preventDefault();
    const cats = getCategories();
    const data = {
        title: document.getElementById('f-title').value.trim(),
        emoji: document.getElementById('f-emoji').value.trim(),
        parentId: document.getElementById('f-parent').value ? parseInt(document.getElementById('f-parent').value) : null,
        description: document.getElementById('f-desc').value.trim()
    };
    
    if (editId) {
        const idx = cats.findIndex(c => c.id === editId);
        cats[idx] = { ...cats[idx], ...data };
    } else {
        cats.push({ id: DB.nextId('categories'), ...data, order: cats.length });
    }
    
    DB.set('categories', cats);
    closeModal();
    renderEditor();
}

function deleteCat(id) {
    if (!confirm('Удалить раздел и ВСЁ его содержимое (подразделы, уроки, книги)?')) return;
    
    const ids = getAllDescendantIds(id);
    DB.set('categories', getCategories().filter(c => !ids.includes(c.id)));
    DB.set('lessons', getLessons().filter(l => !ids.includes(l.categoryId)));
    DB.set('books', getBooks().filter(b => !ids.includes(b.categoryId)));
    renderEditor();
}

function saveLesson(e, editId) {
    e.preventDefault();
    const lessons = getLessons();
    const data = {
        categoryId: parseInt(document.getElementById('f-cat').value),
        title: document.getElementById('f-title').value.trim(),
        description: document.getElementById('f-desc').value.trim(),
        audioUrl: document.getElementById('f-url').value.trim(),
        duration: parseInt(document.getElementById('f-dur').value)
    };
    
    if (editId) {
        const idx = lessons.findIndex(l => l.id === editId);
        lessons[idx] = { ...lessons[idx], ...data };
    } else {
        lessons.push({ id: DB.nextId('lessons'), ...data, created: new Date().toISOString() });
    }
    
    DB.set('lessons', lessons);
    closeModal();
    renderEditor();
}

function deleteLesson(id) {
    if (!confirm('Удалить урок?')) return;
    DB.set('lessons', getLessons().filter(l => l.id !== id));
    closeModal();
    renderEditor();
}

function showBookForm(catId = null, editId = null) {
    const book = editId ? getBooks().find(b => b.id === editId) : null;
    const title = book ? 'Редактировать книгу' : 'Новая книга';
    
    const allCats = getCategories();
    if (allCats.length === 0) {
        alert('Сначала создай хотя бы один раздел!');
        return;
    }
    
    const catOptions = allCats.map(c => 
        `<option value="${c.id}" ${(book?.categoryId || catId) === c.id ? 'selected' : ''}>${c.emoji || '📂'} ${escapeHtml(c.title)}</option>`
    ).join('');
    
    document.getElementById('modal-body').innerHTML = `
        <div class="modal-title">${title} <button class="close-btn" onclick="closeModal()">×</button></div>
        <form onsubmit="saveBook(event, ${editId || 'null'})">
            <label>Раздел *</label>
            <select id="f-cat" required>${catOptions}</select>
            
            <label>Название *</label>
            <input type="text" id="f-title" value="${book ? escapeHtml(book.title) : ''}" required>
            
            <label>Автор</label>
            <input type="text" id="f-author" value="${book?.author || ''}">
            
            <label>Описание</label>
            <textarea id="f-desc" rows="3">${book?.description || ''}</textarea>
            
            <label>Ссылка на PDF *</label>
            <input type="url" id="f-url" value="${book?.pdfUrl || ''}" required placeholder="https://...">
            <div style="font-size: 11px; color: #6b7280; margin: -8px 0 12px;">
                Пример: https://www.africau.edu/images/default/sample.pdf
            </div>
            
            <label>Количество страниц *</label>
            <input type="number" id="f-pages" value="${book?.pages || ''}" required min="1">
            
            ${editId ? '<button type="button" onclick="deleteBook(' + editId + ')" class="btn btn-danger">🗑 Удалить</button>' : ''}
            <button type="submit" class="btn btn-purple">💾 Сохранить</button>
            <button type="button" onclick="closeModal()" class="btn btn-secondary">Отмена</button>
        </form>
    `;
    document.getElementById('modal').classList.add('active');
}

function saveBook(e, editId) {
    e.preventDefault();
    const books = getBooks();
    const data = {
        categoryId: parseInt(document.getElementById('f-cat').value),
        title: document.getElementById('f-title').value.trim(),
        author: document.getElementById('f-author').value.trim(),
        description: document.getElementById('f-desc').value.trim(),
        pdfUrl: document.getElementById('f-url').value.trim(),
        pages: parseInt(document.getElementById('f-pages').value)
    };
    
    if (editId) {
        const idx = books.findIndex(b => b.id === editId);
        books[idx] = { ...books[idx], ...data };
    } else {
        books.push({ id: DB.nextId('books'), ...data, created: new Date().toISOString() });
    }
    
    DB.set('books', books);
    closeModal();
    renderEditor();
}

function deleteBook(id) {
    if (!confirm('Удалить книгу?')) return;
    DB.set('books', getBooks().filter(b => b.id !== id));
    closeModal();
    renderEditor();
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
}

// ============ СТАРТ ============
init();
</script>
</body>
</html>
