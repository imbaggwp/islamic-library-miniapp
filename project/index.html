<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Уроки и Книги</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
    --bg-primary: #f3f4f6;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f9fafb;
    --text-primary: #111827;
    --text-secondary: #6b7280;
    --text-tertiary: #9ca3af;
    --border: #e5e7eb;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --purple: #8b5cf6;
    --pink: #ec4899;
    --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    --gradient-4: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    --gradient-5: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
    --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(255, 255, 255, 0.3);
}

[data-theme="dark"] {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-tertiary: #334155;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-tertiary: #64748b;
    --border: #334155;
    --glass-bg: rgba(30, 41, 59, 0.7);
    --glass-border: rgba(71, 85, 105, 0.3);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5);
    --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overscroll-behavior: none;
    transition: background 0.3s ease, color 0.3s ease;
    min-height: 100vh;
}

.app {
    max-width: 500px;
    margin: 0 auto;
    background: var(--bg-primary);
    min-height: 100vh;
    position: relative;
    padding-bottom: 80px;
}

/* HEADER */
.header {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header-info h1 { font-size: 18px; font-weight: 700; }
.header-info p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--bg-tertiary);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-primary);
    transition: all 0.2s;
}
.icon-btn:hover { background: var(--border); transform: scale(1.05); }
.icon-btn svg { width: 18px; height: 18px; }

/* CONTENT */
.content { padding: 16px; }

/* TABS */
.tab { display: none; animation: slideIn 0.3s ease; }
.tab.active { display: block; }

@keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

@keyframes wave {
    0% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
    100% { transform: scaleY(0.3); }
}

/* NAV */
.nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    max-width: 500px;
    margin: 0 auto;
    display: flex;
    justify-content: space-around;
    padding: 8px 4px;
    z-index: 10;
}
.nav-btn {
    background: none;
    border: none;
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text-tertiary);
    font-size: 10px;
    font-weight: 500;
    transition: all 0.2s;
    border-radius: 10px;
    min-width: 50px;
}
.nav-btn svg { width: 22px; height: 22px; margin-bottom: 2px; transition: all 0.2s; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active svg { transform: translateY(-2px); }

/* CARDS */
.card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
    animation: scaleIn 0.3s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.card-title {
    font-weight: 600;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.card-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; display: flex; align-items: center; gap: 6px; }

/* GLASSMORPHISM CARDS */
.glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    box-shadow: var(--shadow-lg);
}

.gradient-card {
    border-radius: 20px;
    padding: 20px;
    color: white;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
}
.gradient-card::before {
    content: '';
    position: absolute;
    top: -50%; right: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
    pointer-events: none;
}

/* BUTTONS */
.btn {
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    width: 100%;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn:active { transform: translateY(0); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); color: white; }
.btn-success { background: var(--success); color: white; }
.btn-purple { background: var(--purple); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
.btn-ghost { background: transparent; color: var(--text-primary); border: 1px solid var(--border); }

.btn-sm { padding: 8px 12px; font-size: 12px; width: auto; margin: 0; }

/* INPUTS */
input, textarea, select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 12px;
    background: var(--bg-secondary);
    color: var(--text-primary);
    transition: all 0.2s;
}
input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}
label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--text-secondary);
}

/* SEARCH */
.search-box {
    position: relative;
    margin-bottom: 16px;
}
.search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    color: var(--text-tertiary);
    pointer-events: none;
}
.search-box input {
    padding-left: 42px;
    margin: 0;
}

/* PROGRESS BARS */
.progress-bar {
    background: var(--bg-tertiary);
    height: 6px;
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
}
.progress-fill {
    background: var(--gradient-3);
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
}

/* BADGES */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(59, 130, 246, 0.15);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
}
.badge-success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
.badge-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
.badge-purple { background: rgba(139, 92, 246, 0.15); color: var(--purple); }
.badge svg { width: 12px; height: 12px; }

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s;
}
.modal.active { display: flex; }
.modal-content {
    background: var(--bg-secondary);
    border-radius: 24px 24px 0 0;
    padding: 20px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
}
@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}
.modal-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.close-btn {
    background: var(--bg-tertiary);
    border: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-primary);
}
.close-btn svg { width: 16px; height: 16px; }

/* AUDIO PLAYER */
.audio-player {
    background: var(--gradient-1);
    border-radius: 20px;
    padding: 24px;
    color: white;
    position: relative;
    overflow: hidden;
}
.audio-player::before {
    content: '';
    position: absolute;
    top: -50%; right: -30%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
}
.audio-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    margin: 20px 0;
    position: relative;
}
.audio-controls button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 48px; height: 48px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
}
.audio-controls button:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
.audio-controls button svg { width: 22px; height: 22px; }
.play-btn {
    width: 64px !important; height: 64px !important;
    background: white !important;
    color: var(--accent) !important;
}
.play-btn svg { width: 28px !important; height: 28px !important; }

/* WAVE ANIMATION */
.wave-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 30px;
    margin: 10px 0;
}
.wave-bar {
    width: 3px;
    background: white;
    border-radius: 2px;
    height: 100%;
    transform-origin: center;
}
.wave-bar.playing { animation: wave 1s ease-in-out infinite; }
.wave-bar:nth-child(1) { animation-delay: 0s; }
.wave-bar:nth-child(2) { animation-delay: 0.1s; }
.wave-bar:nth-child(3) { animation-delay: 0.2s; }
.wave-bar:nth-child(4) { animation-delay: 0.3s; }
.wave-bar:nth-child(5) { animation-delay: 0.4s; }
.wave-bar:nth-child(6) { animation-delay: 0.3s; }
.wave-bar:nth-child(7) { animation-delay: 0.2s; }

/* PDF VIEWER */
.pdf-viewer {
    background: var(--bg-tertiary);
    min-height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: auto;
}
.pdf-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
}
.pdf-controls button {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    font-size: 13px;
}
.pdf-controls button svg { width: 14px; height: 14px; }

/* ACHIEVEMENTS */
.achievement {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: var(--bg-tertiary);
    border-radius: 12px;
    margin-bottom: 8px;
    transition: all 0.2s;
}
.achievement.earned {
    background: var(--gradient-5);
    color: white;
}
.achievement.earned .ach-desc { color: rgba(255,255,255,0.8); }

/* HEATMAP */
.heat-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
}
.heat-cell {
    aspect-ratio: 1;
    border-radius: 3px;
    background: var(--bg-tertiary);
    transition: all 0.2s;
}
.heat-1 { background: #9be9a8; }
.heat-2 { background: #40c463; }
.heat-3 { background: #30a14e; }
.heat-4 { background: #216e39; }

/* STREAK */
.streak-row {
    display: flex;
    gap: 6px;
    justify-content: space-between;
    margin: 12px 0;
}
.streak-day {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--bg-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
}
.streak-day.active {
    background: var(--gradient-5);
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
}
.streak-day.today {
    border: 2px solid var(--warning);
}

/* STATS */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    text-align: center;
}
.stat-value { font-size: 24px; font-weight: 700; }
.stat-label { font-size: 11px; opacity: 0.8; margin-top: 2px; }

/* RING PROGRESS */
.ring-container { display: flex; justify-content: center; margin: 10px 0; }

/* WEEK CHART */
.week-chart {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: 120px;
    gap: 8px;
    padding: 10px 0;
}
.week-bar {
    flex: 1;
    background: var(--bg-tertiary);
    border-radius: 8px 8px 0 0;
    position: relative;
    min-height: 4px;
    transition: all 0.3s;
    overflow: hidden;
}
.week-bar-fill {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--gradient-3);
    border-radius: 8px 8px 0 0;
    transition: height 0.5s ease;
}
.week-label {
    text-align: center;
    font-size: 10px;
    color: var(--text-tertiary);
    margin-top: 6px;
}

/* EMPTY STATE */
.empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-tertiary);
}
.empty-icon {
    width: 64px; height: 64px;
    margin: 0 auto 12px;
    color: var(--text-tertiary);
    opacity: 0.5;
}

/* EDITOR */
.editor-tree-item {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
}
.editor-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
}
.editor-actions button {
    padding: 6px 10px;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    display: flex; align-items: center; gap: 4px;
}
.editor-actions button svg { width: 12px; height: 12px; }
.editor-actions button:hover { background: var(--border); }

/* BOOKMARKS */
.bookmark-item {
    background: var(--bg-tertiary);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}
.bookmark-item:hover { background: var(--border); }

/* SECTION */
.section {
    margin-bottom: 20px;
}
.section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.section-title svg { width: 14px; height: 14px; }

/* QUICK ACTION */
.quick-action {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 8px;
}
.quick-action:hover { transform: translateX(4px); box-shadow: var(--shadow-md); }
.quick-action-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: white;
    flex-shrink: 0;
}
.quick-action-icon svg { width: 22px; height: 22px; }
.quick-action-content { flex: 1; min-width: 0; }
.quick-action-title { font-weight: 600; font-size: 14px; }
.quick-action-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* TABS INSIDE */
.subtabs {
    display: flex;
    gap: 4px;
    background: var(--bg-tertiary);
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 16px;
}
.subtab {
    flex: 1;
    padding: 8px;
    background: none;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
}
.subtab svg { width: 14px; height: 14px; }
.subtab.active {
    background: var(--bg-secondary);
    color: var(--text-primary);
    box-shadow: var(--shadow-sm);
}

/* TOGGLE */
.toggle {
    position: relative;
    width: 44px;
    height: 24px;
    background: var(--bg-tertiary);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid var(--border);
}
.toggle.active { background: var(--accent); border-color: var(--accent); }
.toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: white;
    border-radius: 50%;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
}
.toggle.active::after { left: 22px; }

.setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: none; }
.setting-label { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.setting-label svg { width: 18px; height: 18px; color: var(--text-secondary); }

/* LOADING */
.loading {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* UTILS */
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.mb-2 { margin-bottom: 8px; }
.mb-3 { margin-bottom: 12px; }
.text-sm { font-size: 13px; }
.text-xs { font-size: 11px; }
.text-center { text-align: center; }
.w-full { width: 100%; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="header-info">
            <h1 id="header-title">Уроки и Книги</h1>
            <p id="header-sub">Загрузка...</p>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleTheme()" id="theme-btn" title="Сменить тему">
                <!-- иконка подставится JS -->
            </button>
        </div>

    },
    set(key, val) { localStorage.setItem('la_' + key, JSON.stringify(val)); },

        return items.length ? Math.max(...items.map(i => i.id)) + 1 : 1;

// ============ UTILS ============
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatDuration(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

function getProgress(type, id) {
    return DB.get('progress').find(p => p.type === type && p.contentId === id);
}

function saveProgress(type, id, percent, position, completed) {
    const all = DB.get('progress');
    const idx = all.findIndex(p => p.type === type && p.contentId === id);
    const data = {
        type, contentId: id, percent, position,
        completed: completed || false,
        lastAccess: new Date().toISOString(),
        date: new Date().toISOString().split('T')[0]
    };
    if (idx >= 0) all[idx] = { ...all[idx], ...data };
    else all.push(data);
    DB.set('progress', all);
    checkAchievements();
}

function isFavorite(type, id) {
    return DB.get('favorites').some(f => f.type === type && f.contentId === id);
}

function toggleFavorite(type, id) {
    let favs = DB.get('favorites');
    const idx = favs.findIndex(f => f.type === type && f.contentId === id);
    if (idx >= 0) favs.splice(idx, 1);
    else favs.push({ type, contentId: id, added: new Date().toISOString() });
    DB.set('favorites', favs);
}

function getCategories() { return DB.get('categories'); }
function getLessons() { return DB.get('lessons'); }
function getBooks() { return DB.get('books'); }

function buildTree(parentId = null) {
    const cats = getCategories();
    return cats
        .filter(c => (c.parentId || null) === parentId)
        .sort((a, b) => (a.order || 0) - (b.order || 0))
        .map(c => ({
            ...c,
            children: buildTree(c.id),
            lessons: getLessons().filter(l => l.categoryId === c.id),
            books: getBooks().filter(b => b.categoryId === c.id)
        }));
}

function findCategory(id) { return getCategories().find(c => c.id === id); }

function getAllDescendantIds(catId) {
    const cats = getCategories();
    const result = [catId];
    cats.filter(c => c.parentId === catId).forEach(ch => result.push(...getAllDescendantIds(ch.id)));
    return result;
}

function getCategoryPath(catId) {
    const path = [];
    let cur = findCategory(catId);
    while (cur) { path.unshift(cur); cur = cur.parentId ? findCategory(cur.parentId) : null; }
    return path;
}

function countItemsInTree(cat, type) {
    let count = (type === 'lesson' ? cat.lessons : cat.books).length;
    cat.children.forEach(ch => count += countItemsInTree(ch, type));
    return count;
}

function getAllLessons() {
    const tree = buildTree(null);
    const flat = [];
    const walk = (nodes) => nodes.forEach(n => {
        n.lessons.forEach(l => flat.push({ ...l, categoryName: n.title, categoryEmoji: n.emoji }));
        walk(n.children);
    });
    walk(tree);
    return flat;
}

function getAllBooks() {
    const tree = buildTree(null);
    const flat = [];
    const walk = (nodes) => nodes.forEach(n => {
        n.books.forEach(b => flat.push({ ...b, categoryName: n.title, categoryEmoji: n.emoji }));
        walk(n.children);
    });
    walk(tree);
    return flat;
}

function renderStreakDays(streak) {
    const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const today = new Date();
    const todayIdx = (today.getDay() + 6) % 7; // Пн=0
    
    return days.map((d, i) => {
        const isActive = i <= todayIdx && i >= todayIdx - streak.count + 1;
        const isToday = i === todayIdx;
        return `
            <div class="streak-day ${isActive ? 'active' : ''} ${isToday ? 'today' : ''}" title="${d}">
                ${isActive ? '🔥' : ''}
            </div>
        `;
    }).join('');
}

function calculateStreak() {
    const progress = DB.get('progress');
    const dates = [...new Set(progress.map(p => p.date))].sort().reverse();
    if (dates.length === 0) return { count: 0 };
    
    let count = 0;
    const today = new Date();
    today.setHours(0,0,0,0);
    
    for (let i = 0; i < 365; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const key = d.toISOString().split('T')[0];
        if (dates.includes(key)) count++;
        else if (i === 0) continue; // сегодня может ещё не быть активности
        else break;
    }
    return { count };
}

function togglePlay() {
    if (state.audio.paused) {
        state.audio.play().catch(e => {
            alert('Не удалось воспроизвести. Проверь ссылку и убедись, что файл доступен.');
        });
        document.getElementById('play-btn').innerHTML = icon('pause', 28);
        document.querySelectorAll('.wave-bar').forEach(b => b.classList.add('playing'));
    } else {
        state.audio.pause();
        document.getElementById('play-btn').innerHTML = icon('play', 28);
        document.querySelectorAll('.wave-bar').forEach(b => b.classList.remove('playing'));
    }
}

function seekAudio(v) {
    if (state.audio.duration) {
        state.audio.currentTime = (parseFloat(v) / 100) * state.audio.duration;
    }
}

function skipAudio(sec) {
    state.audio.currentTime = Math.max(0, Math.min(state.audio.duration || 0, state.audio.currentTime + sec));
}

function updateAudioTime() {
    const ct = document.getElementById('cur-time');
    const seek = document.getElementById('seek');
    if (ct) ct.textContent = formatDuration(state.audio.currentTime);
    if (seek && state.audio.duration && !seek.matches(':active')) {
        seek.value = (state.audio.currentTime / state.audio.duration) * 100;
    }
    
    if (state.currentLesson && state.audio.duration) {
        const pct = (state.audio.currentTime / state.audio.duration) * 100;
        saveProgress('lesson', state.currentLesson.id, pct, state.audio.currentTime, false);
    }
}

state.audio.addEventListener('timeupdate', updateAudioTime);
state.audio.addEventListener('loadedmetadata', () => {
    const tt = document.getElementById('total-time');
    if (tt && state.audio.duration && isFinite(state.audio.duration)) {
        tt.textContent = formatDuration(state.audio.duration);
        // Автоматически обновляем длительность в базе
        if (state.currentLesson && state.currentLesson.duration !== Math.floor(state.audio.duration)) {
            const lessons = getLessons();
            const idx = lessons.findIndex(l => l.id === state.currentLesson.id);
            if (idx >= 0) {
                lessons[idx].duration = Math.floor(state.audio.duration);
                DB.set('lessons', lessons);
                state.currentLesson.duration = Math.floor(state.audio.duration);
            }
        }
    }
});
state.audio.addEventListener('ended', () => {
    if (state.currentLesson) {
        saveProgress('lesson', state.currentLesson.id, 100, state.currentLesson.duration, true);
        document.getElementById('play-btn').innerHTML = icon('play', 28);
        document.querySelectorAll('.wave-bar').forEach(b => b.classList.remove('playing'));
    }
});

function completeLesson() {
    if (!state.currentLesson) return;
    saveProgress('lesson', state.currentLesson.id, 100, state.currentLesson.duration, true);
    closeAudio();
    showToast('🎉 Урок завершён!');
}

function closeAudio() {
    state.audio.pause();
    document.getElementById('audio-modal').classList.remove('active');
    renderTab();
}

async function renderPdfPage() {
    if (!state.pdfDoc) return;
    const page = await state.pdfDoc.getPage(state.pdfPage);
    const scale = 1.5;
    const viewport = page.getViewport({ scale });
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width = viewport.width;
    await page.render({ canvasContext: ctx, viewport }).promise;
    document.getElementById('p-cur').textContent = state.pdfPage;
    
    if (state.currentBook) {
        const pct = (state.pdfPage / state.currentBook.pages) * 100;
        saveProgress('book', state.currentBook.id, pct, state.pdfPage, false);
    }
}

function pdfNext() {
    if (state.pdfDoc && state.pdfPage < state.pdfDoc.numPages) {
        state.pdfPage++;
        renderPdfPage();
    }
}

function pdfPrev() {
    if (state.pdfPage > 1) {
        state.pdfPage--;
        renderPdfPage();
    }
}

function addBookmark() {
    if (!state.currentBook) return;
    const bookmarks = DB.get('bookmarks_' + state.currentBook.id);
    const existing = bookmarks.findIndex(b => b.page === state.pdfPage);
    if (existing >= 0) {
        if (confirm('Удалить закладку с этой страницы?')) {
            bookmarks.splice(existing, 1);
            DB.set('bookmarks_' + state.currentBook.id, bookmarks);
            showToast('Закладка удалена');
            openBook(state.currentBook.id);
        }
    } else {
        bookmarks.push({ page: state.pdfPage, date: new Date().toISOString() });
        bookmarks.sort((a, b) => a.page - b.page);
        DB.set('bookmarks_' + state.currentBook.id, bookmarks);
        showToast('🔖 Закладка добавлена');
        openBook(state.currentBook.id);
    }
}

function showBookmarks(bookId) {
    const bookmarks = DB.get('bookmarks_' + bookId);
    const modal = document.getElementById('modal');
    const body = document.getElementById('modal-body');
    
    body.innerHTML = `
        <div class="modal-title">
            🔖 Закладки
            <button class="close-btn" onclick="closeModal()">${icon('x', 16)}</button>
        </div>
        ${bookmarks.length === 0 ? `<div class="empty"><div class="empty-icon">${icon('bookmark', 48)}</div>Нет закладок</div>` : 
        bookmarks.map(b => `

function goToBookmark(page) {
    state.pdfPage = page;

function deleteBookmark(bookId, page) {
    let bookmarks = DB.get('bookmarks_' + bookId);

    showBookmarks(bookId);
}

function completeBook() {
    if (!state.currentBook) return;
    saveProgress('book', state.currentBook.id, 100, state.currentBook.pages, true);

    showToast('🎉 Книга прочитана!');

function closePdf() {

function getWeekData() {
    const progress = DB.get('progress');
    const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const result = [];
    const today = new Date();
    
    for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const key = d.toISOString().split('T')[0];
        const count = progress.filter(p => p.date === key).length;
        result.push({
            label: days[(d.getDay() + 6) % 7],
            value: count,
            date: key
        });
    }
    return result;
}

                    <div style="flex: 1; min-width: 0;">
                        <div style="font-weight: 600; display: flex; align-items: center; gap: 6px;">
                            <span style="font-size: 18px;">${cat.emoji || '📂'}</span>
                            <span class="truncate">${escapeHtml(cat.title)}</span>
                        </div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px; display: flex; gap: 10px;">
                            ${lessons.length ? `<span style="display: flex; align-items: center; gap: 3px;">${icon('headphones', 12)} ${lessons.length}</span>` : ''}
                            ${books.length ? `<span style="display: flex; align-items: center; gap: 3px;">${icon('book', 12)} ${books.length}</span>` : ''}
                            ${!lessons.length && !books.length ? '<span style="color: var(--text-tertiary);">пусто</span>' : ''}
                        </div>
                    </div>
                </div>
                <div class="editor-actions">
                    <button onclick="showCatForm(${cat.id})">${icon('edit', 12)} Ред.</button>
                    <button onclick="showCatForm(null, ${cat.id})">${icon('plus', 12)} Подраздел</button>
                    <button onclick="showLessonForm(${cat.id})">${icon('headphones', 12)} Урок</button>
                    <button onclick="showBookForm(${cat.id})">${icon('book', 12)} Книга</button>
                    <button onclick="deleteCat(${cat.id})" style="color: var(--danger);">${icon('trash', 12)}</button>
                </div>
            </div>
        `;
        
        if (cat.children.length > 0) {
            html += `<div style="margin-left: 16px; border-left: 2px solid var(--border); padding-left: 8px;">${renderEditorTree(cat.children)}</div>`;
        }
        
        return html;
    }).join('');
}

// ============ ФОРМЫ РЕДАКТОРА ============
function showCatForm(editId = null, parentId = null) {
    const cat = editId ? findCategory(editId) : null;
    const title = cat ? 'Редактировать раздел' : 'Новый раздел';
    
    const allCats = getCategories();
    const parentOptions = '<option value="">— Корневой —</option>' + 
        allCats.filter(c => c.id !== editId).map(c => 
            `<option value="${c.id}" ${(cat?.parentId || parentId) === c.id ? 'selected' : ''}>${c.emoji || '📂'} ${escapeHtml(c.title)}</option>`
        ).join('');
    
    document.getElementById('modal-body').innerHTML = `
        <div class="modal-title">
            ${title}
            <button class="close-btn" onclick="closeModal()">${icon('x', 16)}</button>
        </div>
        <form onsubmit="saveCat(event, ${editId || 'null'})">
            <label>Название *</label>
            <input type="text" id="f-title" value="${cat ? escapeHtml(cat.title) : ''}" required>
            
            <label>Эмодзи</label>
            <input type="text" id="f-emoji" value="${cat?.emoji || ''}" maxlength="4" placeholder="📂">
            
            <label>Родитель</label>
            <select id="f-parent">${parentOptions}</select>
            
            <label>Описание</label>
            <textarea id="f-desc" rows="3" placeholder="О чём этот раздел...">${cat?.description || ''}</textarea>
            
            <button type="submit" class="btn btn-primary">${icon('check', 16)} Сохранить</button>
            <button type="button" onclick="closeModal()" class="btn btn-secondary">Отмена</button>
        </form>
    `;
    document.getElementById('modal').classList.add('active');
}

function saveCat(e, editId) {
    e.preventDefault();
    const cats = getCategories();
    const data = {
        title: document.getElementById('f-title').value.trim(),
        emoji: document.getElementById('f-emoji').value.trim(),
        parentId: document.getElementById('f-parent').value ? parseInt(document.getElementById('f-parent').value) : null,
        description: document.getElementById('f-desc').value.trim()
    };
    
    if (editId) {
        const idx = cats.findIndex(c => c.id === editId);
        cats[idx] = { ...cats[idx], ...data };
    } else {
        cats.push({ id: DB.nextId('categories'), ...data, order: cats.length });
    }
    
    DB.set('categories', cats);
    closeModal();
    renderEditor();
    showToast(editId ? '✅ Раздел обновлён' : '✅ Раздел создан');
}

function deleteCat(id) {
    if (!confirm('Удалить раздел и ВСЁ его содержимое?')) return;
    const ids = getAllDescendantIds(id);
    DB.set('categories', getCategories().filter(c => !ids.includes(c.id)));
    DB.set('lessons', getLessons().filter(l => !ids.includes(l.categoryId)));
    DB.set('books', getBooks().filter(b => !ids.includes(b.categoryId)));
    renderEditor();
    showToast('🗑 Раздел удалён');
}

function showLessonForm(catId = null, editId = null) {
    const lesson = editId ? getLessons().find(l => l.id === editId) : null;
    const title = lesson ? 'Редактировать урок' : 'Новый урок';
    
    const allCats = getCategories();
    if (allCats.length === 0) {
        alert('Сначала создай хотя бы один раздел!');
        return;
    }
    
    const catOptions = allCats.map(c => 
        `<option value="${c.id}" ${(lesson?.categoryId || catId) === c.id ? 'selected' : ''}>${c.emoji || '📂'} ${escapeHtml(c.title)}</option>`
    ).join('');
    
    document.getElementById('modal-body').innerHTML = `
        <div class="modal-title">
            ${title}
            <button class="close-btn" onclick="closeModal()">${icon('x', 16)}</button>
        </div>
        <form onsubmit="saveLesson(event, ${editId || 'null'})">
            <label>Раздел *</label>
            <select id="f-cat" required>${catOptions}</select>
            
            <label>Название *</label>
            <input type="text" id="f-title" value="${lesson ? escapeHtml(lesson.title) : ''}" required>
            
            <label>Описание</label>
            <textarea id="f-desc" rows="3" placeholder="О чём этот урок...">${lesson?.description || ''}</textarea>
            
            <label>Ссылка на аудио (mp3) *</label>
            <input type="url" id="f-url" value="${lesson?.audioUrl || ''}" required placeholder="https://...">
            <div style="font-size: 11px; color: var(--text-secondary); margin: -8px 0 12px;">
                Длительность определится автоматически при первом прослушивании
            </div>
            
            ${editId ? `<button type="button" onclick="deleteLesson(${editId})" class="btn btn-danger">${icon('trash', 16)} Удалить</button>` : ''}
            <button type="submit" class="btn btn-success">${icon('check', 16)} Сохранить</button>
            <button type="button" onclick="closeModal()" class="btn btn-secondary">Отмена</button>
        </form>
    `;
    document.getElementById('modal').classList.add('active');
}

function saveLesson(e, editId) {
    e.preventDefault();
    const lessons = getLessons();
    const data = {
        categoryId: parseInt(document.getElementById('f-cat').value),
        title: document.getElementById('f-title').value.trim(),
        description: document.getElementById('f-desc').value.trim(),
        audioUrl: document.getElementById('f-url').value.trim(),
        duration: 60 // заглушка, обновится автоматически
    };
    
    if (editId) {
        const idx = lessons.findIndex(l => l.id === editId);
        const oldDur = lessons[idx].duration;
        lessons[idx] = { ...lessons[idx], ...data, duration: oldDur || 60 };
    } else {
        lessons.push({ id: DB.nextId('lessons'), ...data, created: new Date().toISOString() });
    }
    
    DB.set('lessons', lessons);
    closeModal();
    renderEditor();
    showToast(editId ? '✅ Урок обновлён' : '✅ Урок создан');
}

function deleteLesson(id) {
    if (!confirm('Удалить урок?')) return;
    DB.set('lessons', getLessons().filter(l => l.id !== id));
    closeModal();
    renderEditor();
    showToast('🗑 Урок удалён');
}

function showBookForm(catId = null, editId = null) {
    const book = editId ? getBooks().find(b => b.id === editId) : null;
    const title = book ? 'Редактировать книгу' : 'Новая книга';
    
    const allCats = getCategories();
    if (allCats.length === 0) {
        alert('Сначала создай хотя бы один раздел!');
        return;
    }
    
    const catOptions = allCats.map(c => 
        `<option value="${c.id}" ${(book?.categoryId || catId) === c.id ? 'selected' : ''}>${c.emoji || '📂'} ${escapeHtml(c.title)}</option>`
    ).join('');
    
    document.getElementById('modal-body').innerHTML = `
        <div class="modal-title">
            ${title}
            <button class="close-btn" onclick="closeModal()">${icon('x', 16)}</button>
        </div>
        <form onsubmit="saveBook(event, ${editId || 'null'})">
            <label>Раздел *</label>
            <select id="f-cat" required>${catOptions}</select>
            
            <label>Название *</label>
            <input type="text" id="f-title" value="${book ? escapeHtml(book.title) : ''}" required>
            
            <label>Автор</label>
            <input type="text" id="f-author" value="${book?.author || ''}">
            
            <label>Описание</label>
            <textarea id="f-desc" rows="3" placeholder="О чём эта книга...">${book?.description || ''}</textarea>
            
            <label>Ссылка на PDF *</label>
            <input type="url" id="f-url" value="${book?.pdfUrl || ''}" required placeholder="https://...">
            
            <label>Количество страниц *</label>
            <input type="number" id="f-pages" value="${book?.pages || ''}" required min="1">
            
            ${editId ? `<button type="button" onclick="deleteBook(${editId})" class="btn btn-danger">${icon('trash', 16)} Удалить</button>` : ''}
            <button type="submit" class="btn btn-purple">${icon('check', 16)} Сохранить</button>
            <button type="button" onclick="closeModal()" class="btn btn-secondary">Отмена</button>
        </form>
    `;
    document.getElementById('modal').classList.add('active');
}

function saveBook(e, editId) {
    e.preventDefault();
    const books = getBooks();
    const data = {
        categoryId: parseInt(document.getElementById('f-cat').value),
        title: document.getElementById('f-title').value.trim(),
        author: document.getElementById('f-author').value.trim(),
        description: document.getElementById('f-desc').value.trim(),
        pdfUrl: document.getElementById('f-url').value.trim(),
        pages: parseInt(document.getElementById('f-pages').value)
    };
    
    if (editId) {
        const idx = books.findIndex(b => b.id === editId);
        books[idx] = { ...books[idx], ...data };
    } else {
        books.push({ id: DB.nextId('books'), ...data, created: new Date().toISOString() });
    }
    
    DB.set('books', books);
    closeModal();
    renderEditor();
    showToast(editId ? '✅ Книга обновлена' : '✅ Книга создана');
}

function deleteBook(id) {
    if (!confirm('Удалить книгу?')) return;
    DB.set('books', getBooks().filter(b => b.id !== id));
    closeModal();
    renderEditor();
    showToast('🗑 Книга удалена');
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
}

// ============ TOAST УВЕДОМЛЕНИЯ ============
function showToast(message) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.cssText = `
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--text-primary);
        color: var(--bg-primary);
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        box-shadow: var(--shadow-xl);
        z-index: 1000;
        animation: slideUp 0.3s ease;
        max-width: 90%;
        text-align: center;
    `;
    toast.textContent = message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
    }, 2500);
}

// ============ СТАРТ ============
init();
</script>
</body>
</html>
