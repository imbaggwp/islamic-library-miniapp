<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Уроки и Книги</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
    --bg-primary: var(--tg-theme-bg-color, #f3f4f6);
    --bg-secondary: var(--tg-theme-secondary-bg-color, #ffffff);
    --bg-tertiary: var(--tg-theme-secondary-bg-color, #f9fafb);
    --text-primary: var(--tg-theme-text-color, #111827);
    --text-secondary: var(--tg-theme-hint-color, #6b7280);
    --text-tertiary: var(--tg-theme-hint-color, #9ca3af);
    --border: var(--tg-theme-secondary-bg-color, #e5e7eb);
    --accent: var(--tg-theme-link-color, #3b82f6);
    --accent-hover: #2563eb;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --purple: #8b5cf6;
    --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    --gradient-4: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    --gradient-5: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
    --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.15);
    --glass-bg: var(--tg-theme-bg-color, rgba(255, 255, 255, 0.85));
    --glass-border: var(--tg-theme-secondary-bg-color, rgba(0, 0, 0, 0.06));
}
[data-theme="dark"] {
    --bg-primary: var(--tg-theme-bg-color, #0f172a);
    --bg-secondary: var(--tg-theme-secondary-bg-color, #1e293b);
    --bg-tertiary: var(--tg-theme-secondary-bg-color, #334155);
    --text-primary: var(--tg-theme-text-color, #f1f5f9);
    --text-secondary: var(--tg-theme-hint-color, #94a3b8);
    --text-tertiary: var(--tg-theme-hint-color, #64748b);
    --border: var(--tg-theme-secondary-bg-color, #334155);
    --glass-bg: var(--tg-theme-bg-color, rgba(30, 41, 59, 0.85));
    --glass-border: var(--tg-theme-secondary-bg-color, rgba(255, 255, 255, 0.06));
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5);
    --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.6);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
html, body { overscroll-behavior-y: none; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}
.app { max-width: 500px; margin: 0 auto; background: var(--bg-primary); min-height: 100vh; position: relative; padding-bottom: 140px; }

/* HEADER - максимально компактный, только иконка профиля */
.header {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--glass-border);
    padding: 8px 16px;
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: flex-end; align-items: center;
    min-height: 44px;
}
.icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--bg-tertiary); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-primary); transition: all 0.2s;
}
.icon-btn:hover { transform: scale(1.05); }
.icon-btn svg { width: 18px; height: 18px; }

.content { padding: 16px; position: relative; }

/* TABS с анимациями */
.tab { display: none; }
.tab.active { display: block; animation: tabSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
@keyframes tabSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes wave { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--glass-border);
    max-width: 500px; margin: 0 auto;
    display: flex; justify-content: space-around;
    padding: 6px 4px 10px; z-index: 10;
}
.nav-btn {
    background: none; border: none; padding: 6px 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    color: var(--text-tertiary); font-size: 10px; font-weight: 500;
    transition: all 0.2s; border-radius: 10px; min-width: 50px;
}
.nav-btn svg { width: 22px; height: 22px; margin-bottom: 2px; transition: all 0.2s; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active svg { transform: translateY(-2px); }

.card {
    background: var(--bg-secondary);
    border: 1px solid var(--glass-border);
    border-radius: 16px; padding: 14px;
    margin-bottom: 10px; cursor: pointer;
    transition: all 0.2s; box-shadow: var(--shadow-sm);
    animation: scaleIn 0.3s ease; position: relative;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.card-title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
.card-desc {
    font-size: 12px; color: var(--text-tertiary);
    margin-top: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.4;
}

.card-menu-btn {
    position: absolute; top: 10px; right: 10px;
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--bg-tertiary); border: none; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    color: var(--text-secondary); transition: all 0.2s; z-index: 2;
}
.card-menu-btn svg { width: 16px; height: 16px; }
.editor-mode .card-menu-btn { display: flex; }

.gradient-card {
    border-radius: 20px; padding: 20px; color: white;
    position: relative; overflow: hidden; box-shadow: var(--shadow-lg);
}
.gradient-card::before {
    content: ''; position: absolute; top: -50%; right: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
    pointer-events: none;
}

.btn {
    padding: 12px 20px; border: none; border-radius: 12px;
    font-weight: 600; cursor: pointer; font-size: 14px;
    width: 100%; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); color: var(--tg-theme-button-text-color, white); }
.btn-success { background: var(--success); color: white; }
.btn-purple { background: var(--purple); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
.btn-ghost { background: transparent; color: var(--text-primary); border: 1px solid var(--border); }

input, textarea, select {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 12px;
    font-size: 14px; font-family: inherit; margin-bottom: 12px;
    background: var(--bg-secondary); color: var(--text-primary);
    transition: all 0.2s;
}
input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}
label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }

.search-box { position: relative; margin-bottom: 16px; }
.search-box svg {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--text-tertiary);
    pointer-events: none;
}
.search-box input { padding-left: 42px; margin: 0; }

.progress-bar { background: var(--bg-tertiary); height: 6px; border-radius: 3px; margin-top: 8px; overflow: hidden; }
.progress-fill { background: var(--gradient-3); height: 100%; border-radius: 3px; transition: width 0.5s ease; }

.badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(59, 130, 246, 0.15); color: var(--accent);
    padding: 3px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 600;
}
.badge-success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
.badge svg { width: 12px; height: 12px; }

.modal {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 100; align-items: flex-end; justify-content: center;
    animation: fadeIn 0.2s;
}
.modal.active { display: flex; }
.modal-content {
    background: var(--bg-secondary);
    border-radius: 24px 24px 0 0;
    padding: 20px; width: 100%; max-width: 500px;
    max-height: 90vh; overflow-y: auto;
    animation: slideUp 0.3s ease;
}
.modal-title {
    font-size: 18px; font-weight: 700; margin-bottom: 16px;
    display: flex; justify-content: space-between; align-items: center;
}
.close-btn {
    background: var(--bg-tertiary); border: none;
    width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text-primary);
}
.close-btn svg { width: 16px; height: 16px; }

.context-menu {
    position: fixed; background: var(--bg-secondary);
    border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow-xl); z-index: 200;
    min-width: 200px; animation: scaleIn 0.2s ease;
    overflow: hidden;
}
.context-menu-item {
    padding: 12px 16px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; transition: background 0.2s;
    border-bottom: 1px solid var(--border);
}
.context-menu-item:last-child { border-bottom: none; }
.context-menu-item:hover { background: var(--bg-tertiary); }
.context-menu-item svg { width: 18px; height: 18px; color: var(--text-secondary); }
.context-menu-item.danger { color: var(--danger); }
.context-menu-item.danger svg { color: var(--danger); }

.audio-player {
    background: var(--gradient-1);
    border-radius: 20px; padding: 24px; color: white;
    position: relative; overflow: hidden;
}
.audio-player::before {
    content: ''; position: absolute; top: -50%; right: -30%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
}
.audio-controls {
    display: flex; justify-content: center; align-items: center;
    gap: 24px; margin: 20px 0; position: relative;
}
.audio-controls button {
    background: rgba(255,255,255,0.2); border: none; color: white;
    width: 48px; height: 48px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
}
.audio-controls button:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
.audio-controls button svg { width: 22px; height: 22px; }
.play-btn { width: 64px !important; height: 64px !important; background: white !important; color: var(--accent) !important; }
.play-btn svg { width: 28px !important; height: 28px !important; }

.wave-container { display: flex; align-items: center; justify-content: center; gap: 3px; height: 30px; margin: 10px 0; }
.wave-bar { width: 3px; background: white; border-radius: 2px; height: 100%; transform-origin: center; }
.wave-bar.playing { animation: wave 1s ease-in-out infinite; }
.wave-bar:nth-child(1) { animation-delay: 0s; }
.wave-bar:nth-child(2) { animation-delay: 0.1s; }
.wave-bar:nth-child(3) { animation-delay: 0.2s; }
.wave-bar:nth-child(4) { animation-delay: 0.3s; }
.wave-bar:nth-child(5) { animation-delay: 0.4s; }
.wave-bar:nth-child(6) { animation-delay: 0.3s; }
.wave-bar:nth-child(7) { animation-delay: 0.2s; }

.speed-selector { display: flex; gap: 6px; justify-content: center; margin: 12px 0; flex-wrap: wrap; }
.speed-btn {
    padding: 6px 12px; background: rgba(255,255,255,0.2);
    border: none; border-radius: 8px; color: white;
    cursor: pointer; font-size: 12px; font-weight: 600;
    transition: all 0.2s;
}
.speed-btn.active { background: white; color: var(--accent); }

.playlist-section {
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.2);
    position: relative; z-index: 1;
}
.playlist-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px; border-radius: 8px;
    cursor: pointer; transition: background 0.2s;
    margin-bottom: 4px;
}
.playlist-item:hover { background: rgba(255,255,255,0.1); }
.playlist-item.current { background: rgba(255,255,255,0.2); }
.playlist-item-num { font-size: 12px; opacity: 0.7; width: 20px; }
.playlist-item-title { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.playlist-item-dur { font-size: 11px; opacity: 0.7; }

.pdf-viewer { background: var(--bg-tertiary); min-height: 400px; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.pdf-controls {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: var(--bg-secondary);
    border-top: 1px solid var(--border);
}
.pdf-controls button {
    background: var(--bg-tertiary); color: var(--text-primary);
    border: 1px solid var(--border); padding: 8px 16px;
    border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; font-size: 13px;
}
.pdf-controls button svg { width: 14px; height: 14px; }

.heat-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.heat-cell { aspect-ratio: 1; border-radius: 3px; background: var(--bg-tertiary); }
.heat-1 { background: #9be9a8; }
.heat-2 { background: #40c463; }
.heat-3 { background: #30a14e; }
.heat-4 { background: #216e39; }

.streak-row { display: flex; gap: 6px; justify-content: space-between; margin: 12px 0; }
.streak-day {
    flex: 1; aspect-ratio: 1; border-radius: 10px;
    background: var(--bg-tertiary);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
}
.streak-day.active { background: var(--gradient-5); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
.streak-day.today { border: 2px solid var(--warning); }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; }
.stat-value { font-size: 24px; font-weight: 700; }
.stat-label { font-size: 11px; opacity: 0.8; margin-top: 2px; }

.ring-container { display: flex; justify-content: center; margin: 10px 0; }

.week-chart { display: flex; align-items: flex-end; justify-content: space-between; height: 120px; gap: 8px; padding: 10px 0; }
.week-bar { flex: 1; background: var(--bg-tertiary); border-radius: 8px 8px 0 0; position: relative; min-height: 4px; overflow: hidden; }
.week-bar-fill { position: absolute; bottom: 0; left: 0; right: 0; background: var(--gradient-3); border-radius: 8px 8px 0 0; transition: height 0.5s ease; }
.week-label { text-align: center; font-size: 10px; color: var(--text-tertiary); margin-top: 6px; }

.empty { text-align: center; padding: 40px 20px; color: var(--text-tertiary); }
.empty-icon { width: 64px; height: 64px; margin: 0 auto 12px; opacity: 0.5; }

.bookmark-item {
    background: var(--bg-tertiary); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
}
.bookmark-item:hover { background: var(--border); }

.section { margin-bottom: 20px; }
.section-title {
    font-size: 13px; font-weight: 600;
    color: var(--text-secondary); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
}
.section-title svg { width: 14px; height: 14px; }

.quick-action {
    background: var(--bg-secondary);
    border: 1px solid var(--glass-border);
    border-radius: 16px; padding: 14px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: all 0.2s; margin-bottom: 8px;
}
.quick-action:hover { transform: translateX(4px); box-shadow: var(--shadow-md); }
.quick-action-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: white; flex-shrink: 0;
}
.quick-action-icon svg { width: 22px; height: 22px; }
.quick-action-content { flex: 1; min-width: 0; }
.quick-action-title { font-weight: 600; font-size: 14px; }
.quick-action-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.subtabs {
    display: flex; gap: 4px; background: var(--bg-tertiary);
    padding: 4px; border-radius: 12px; margin-bottom: 16px;
    overflow-x: auto;
}
.subtab {
    flex: 1; padding: 8px; background: none; border: none;
    border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    white-space: nowrap;
}
.subtab svg { width: 14px; height: 14px; }
.subtab.active { background: var(--bg-secondary); color: var(--text-primary); box-shadow: var(--shadow-sm); }

.toggle {
    position: relative; width: 44px; height: 24px;
    background: var(--bg-tertiary); border-radius: 12px;
    cursor: pointer; transition: all 0.2s;
    border: 1px solid var(--border); flex-shrink: 0;
}
.toggle.active { background: var(--accent); border-color: var(--accent); }
.toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px; background: white;
    border-radius: 50%; transition: all 0.2s;
    box-shadow: var(--shadow-sm);
}
.toggle.active::after { left: 22px; }

.setting-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: none; }
.setting-label { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.setting-label svg { width: 18px; height: 18px; color: var(--text-secondary); }

.add-buttons {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; margin-top: 16px;
}
.add-buttons .btn { margin: 0; font-size: 11px; padding: 10px 6px; }

.confirm-modal {
    background: var(--bg-secondary); border-radius: 20px;
    padding: 24px; text-align: center; max-width: 320px;
}
.confirm-icon {
    width: 64px; height: 64px; margin: 0 auto 16px;
    background: rgba(239, 68, 68, 0.1); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--danger);
}
.confirm-icon svg { width: 32px; height: 32px; }
.confirm-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.confirm-text { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
.confirm-buttons { display: flex; gap: 8px; }
.confirm-buttons .btn { flex: 1; margin: 0; }

.cat-stat {
    background: var(--bg-secondary);
    border: 1px solid var(--glass-border);
    border-radius: 12px; padding: 12px; margin-bottom: 8px;
}
.cat-stat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.cat-stat-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.cat-stat-percent { font-size: 13px; color: var(--accent); font-weight: 600; }

.editor-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--gradient-5); color: white;
    padding: 2px 8px; border-radius: 10px;
    font-size: 10px; font-weight: 600;
    margin-left: 8px;
}

/* SCROLL TO TOP */
.scroll-top-btn {
    position: fixed;
    bottom: 90px;
    right: 16px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-lg);
    z-index: 50;
    transition: all 0.3s;
    animation: scaleIn 0.3s;
}
.scroll-top-btn.visible { display: flex; }
.scroll-top-btn:hover { transform: scale(1.1); }
.scroll-top-btn svg { width: 20px; height: 20px; }

/* MINI PLAYER */
.mini-player {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 468px;
    background: var(--gradient-1);
    border-radius: 14px;
    padding: 10px 12px;
    color: white;
    display: none;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow-xl);
    z-index: 20;
    cursor: pointer;
    animation: slideUp 0.3s ease;
}
.mini-player.visible { display: flex; }
.mini-player-icon {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.25);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.mini-player-icon svg { width: 18px; height: 18px; }
.mini-player-info { flex: 1; min-width: 0; }
.mini-player-title { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-player-sub { font-size: 11px; opacity: 0.8; }
.mini-player-play {
    width: 36px; height: 36px;
    background: white;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    flex-shrink: 0;
}
.mini-player-play svg { width: 16px; height: 16px; }

/* SKELETON LOADING */
.skeleton {
    background: linear-gradient(90deg, var(--bg-tertiary) 0%, var(--border) 50%, var(--bg-tertiary) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
}
.skeleton-card {
    background: var(--bg-secondary);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
}
.skeleton-line { height: 14px; margin-bottom: 8px; border-radius: 4px; }
.skeleton-line.short { width: 60%; }
.skeleton-line.medium { width: 80%; }
.skeleton-circle { width: 32px; height: 32px; border-radius: 8px; }

/* PULL TO REFRESH */
.pull-indicator {
    text-align: center;
    padding: 12px;
    color: var(--text-tertiary);
    font-size: 13px;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.pull-indicator.visible { display: flex; }
.pull-indicator svg { width: 16px; height: 16px; animation: pulse 1s infinite; }

/* QUOTE */
.quote-card {
    background: var(--bg-secondary);
    border: 1px solid var(--glass-border);
    border-left: 4px solid var(--accent);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-style: italic;
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.5;
    position: relative;
}
.quote-card::before {
    content: '"';
    position: absolute;
    top: -8px;
    left: 12px;
    font-size: 32px;
    color: var(--accent);
    opacity: 0.3;
    font-style: normal;
}
.quote-author {
    font-style: normal;
    font-weight: 600;
    color: var(--text-primary);
    margin-top: 6px;
    font-size: 12px;
}

.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>

// ============ THEME ============
function getSystemTheme() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme() {
    const theme = state.theme || getSystemTheme();
    document.documentElement.setAttribute('data-theme', theme);
}

function toggleTheme() {
    const current = state.theme || getSystemTheme();
    state.theme = current === 'dark' ? 'light' : 'dark';
    DB.set('theme', state.theme);
    applyTheme();
    if (state.currentTab === 'profile') renderProfile();
}

function initTheme() {
    state.theme = DB.get('theme', null);
    applyTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (!state.theme) applyTheme();
    });
}

function init() {
    initTheme();
    checkAdminAccess();
    
    let user = DB.get('user', null);
    if (!user) {
        const tg = window.Telegram?.WebApp;
        const name = tg?.initDataUnsafe?.user?.first_name || prompt('Как тебя зовут?') || 'Пользователь';
        user = { id: 1, name, created: new Date().toISOString() };
        DB.set('user', user);
    }
    state.user = user;
    
    renderNav();
    showSkeleton();
    setTimeout(() => {
        renderTab();
    }, 400);
    
    setupPullToRefresh();
    setupScrollListener();
    setupMiniPlayer();
}

function checkAdminAccess() {
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
        const tgUser = tg.initDataUnsafe?.user;
        if (tgUser && ADMIN_TELEGRAM_IDS.includes(tgUser.id)) {
            state.editorMode = true;
        } else {
            state.editorMode = false;
        }
    } else {
        state.editorMode = DB.get('editorMode', false);
    }
    updateEditorMode();
}

function updateEditorMode() {
    const app = document.getElementById('app');
    if (state.editorMode) app.classList.add('editor-mode');
    else app.classList.remove('editor-mode');
}

    document.getElementById('tab-' + tab).classList.add('active');

// ============ UTILS ============
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatDuration(sec) {
    if (!sec || isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

function getProgress(type, id) {
    return DB.get('progress').find(p => p.type === type && p.contentId === id);
}

function saveProgress(type, id, percent, position, completed) {
    const all = DB.get('progress');
    const idx = all.findIndex(p => p.type === type && p.contentId === id);
    const data = {
        type, contentId: id, percent, position,
        completed: completed || false,
        lastAccess: new Date().toISOString(),
        date: new Date().toISOString().split('T')[0]
    };
    if (idx >= 0) all[idx] = { ...all[idx], ...data };
    else all.push(data);
    DB.set('progress', all);
}

function isFavorite(type, id) {
    return DB.get('favorites').some(f => f.type === type && f.contentId === id);
}

function toggleFavorite(type, id) {
    let favs = DB.get('favorites');
    const idx = favs.findIndex(f => f.type === type && f.contentId === id);
    if (idx >= 0) favs.splice(idx, 1);
    else favs.push({ type, contentId: id, added: new Date().toISOString() });
    DB.set('favorites', favs);
}

function getCategories() { return DB.get('categories'); }
function getLessons() { return DB.get('lessons'); }
function getBooks() { return DB.get('books'); }

function buildTree(parentId = null) {
    const cats = getCategories();
    return cats
        .filter(c => (c.parentId || null) === parentId)
        .sort((a, b) => (a.order || 0) - (b.order || 0))
        .map(c => ({
            ...c,
            children: buildTree(c.id),
            lessons: getLessons().filter(l => l.categoryId === c.id),
            books: getBooks().filter(b => b.categoryId === c.id)
        }));
}

function findCategory(id) { return getCategories().find(c => c.id === id); }

function getAllDescendantIds(catId) {
    const cats = getCategories();
    const result = [catId];
    cats.filter(c => c.parentId === catId).forEach(ch => result.push(...getAllDescendantIds(ch.id)));
    return result;
}

function getCategoryPath(catId) {
    const path = [];
    let cur = findCategory(catId);
    while (cur) { path.unshift(cur); cur = cur.parentId ? findCategory(cur.parentId) : null; }
    return path;
}

function countItemsInTree(cat, type) {
    let count = (type === 'lesson' ? cat.lessons : cat.books).length;
    cat.children.forEach(ch => count += countItemsInTree(ch, type));
    return count;
}

function getAllLessons() {
    const tree = buildTree(null);
    const flat = [];
    const walk = (nodes) => nodes.forEach(n => {
        n.lessons.forEach(l => flat.push({ ...l, categoryName: n.title, categoryEmoji: n.emoji }));
        walk(n.children);
    });
    walk(tree);
    return flat;
}

function getAllBooks() {
    const tree = buildTree(null);
    const flat = [];
    const walk = (nodes) => nodes.forEach(n => {
        n.books.forEach(b => flat.push({ ...b, categoryName: n.title, categoryEmoji: n.emoji }));
        walk(n.children);
    });
    walk(tree);
    return flat;
}

// ============ CONTEXT MENU ============
function showContextMenu(event, items) {
    event.stopPropagation();
    event.preventDefault();
    const menu = document.getElementById('context-menu');
    menu.innerHTML = items.map(item => `
        <div class="context-menu-item ${item.danger ? 'danger' : ''}" onclick="hideContextMenu(); ${item.action}">
            ${icon(item.icon, 18)}
            <span>${item.label}</span>
        </div>
    `).join('');
    
    const rect = event.currentTarget.getBoundingClientRect();
    menu.style.display = 'block';
    
    let left = rect.right - 200;
    let top = rect.bottom + 4;
    
    if (left < 10) left = 10;
    if (left + 200 > window.innerWidth) left = window.innerWidth - 210;
    if (top + menu.offsetHeight > window.innerHeight) top = rect.top - menu.offsetHeight - 4;
    
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    
    setTimeout(() => {
        document.addEventListener('click', hideContextMenu, { once: true });
    }, 0);
}

function hideContextMenu() {
    document.getElementById('context-menu').style.display = 'none';
}

function showConfirm(title, text, onConfirm) {
    const modal = document.getElementById('modal');
    const body = document.getElementById('modal-body');
    
    body.innerHTML = `
        <div class="confirm-modal">
            <div class="confirm-icon">${icon('trash', 32)}</div>
            <div class="confirm-title">${title}</div>
            <div class="confirm-text">${text}</div>
            <div class="confirm-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn btn-danger" id="confirm-btn">Удалить</button>
            </div>
        </div>
    `;
    
    modal.classList.add('active');
    document.getElementById('confirm-btn').onclick = () => {
        closeModal();
        onConfirm();
    };
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
}

// ============ PULL TO REFRESH ============
function setupPullToRefresh() {
    const content = document.getElementById('main-content');
    
    content.addEventListener('touchstart', (e) => {
        if (window.scrollY === 0) {
            state.pullStartY = e.touches[0].clientY;
            state.isPulling = true;
        }
    }, { passive: true });
    
    content.addEventListener('touchmove', (e) => {
        if (!state.isPulling) return;
        state.pullCurrentY = e.touches[0].clientY;
        const diff = state.pullCurrentY - state.pullStartY;
        
        if (diff > 0 && window.scrollY === 0) {
            const indicator = document.getElementById('pull-indicator');
            indicator.classList.add('visible');
            if (diff > 80) {
                document.getElementById('pull-text').textContent = 'Отпустите для обновления';
            } else {
                document.getElementById('pull-text').textContent = 'Потяните для обновления';
            }
            content.style.transform = `translateY(${Math.min(diff / 2, 60)}px)`;
        }
    }, { passive: true });
    
    content.addEventListener('touchend', () => {
        if (!state.isPulling) return;
        state.isPulling = false;
        const diff = state.pullCurrentY - state.pullStartY;
        const indicator = document.getElementById('pull-indicator');
        
        if (diff > 80 && window.scrollY === 0) {
            document.getElementById('pull-text').textContent = 'Обновление...';
            setTimeout(() => {
                renderTab();
                indicator.classList.remove('visible');
                content.style.transform = '';
                showToast('✨ Обновлено');
            }, 500);
        } else {
            indicator.classList.remove('visible');
            content.style.transform = '';
        }
    });
}

function renderStreakDays(streak) {
    const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const today = new Date();
    const todayIdx = (today.getDay() + 6) % 7;
    return days.map((d, i) => {
        const isActive = i <= todayIdx && i >= todayIdx - streak.count + 1;
        const isToday = i === todayIdx;
        return `<div class="streak-day ${isActive ? 'active' : ''} ${isToday ? 'today' : ''}" title="${d}">${isActive ? '🔥' : ''}</div>`;
    }).join('');
}

function calculateStreak() {
    const progress = DB.get('progress');
    const dates = [...new Set(progress.map(p => p.date))].sort().reverse();
    if (dates.length === 0) return { count: 0 };
    let count = 0;
    const today = new Date(); today.setHours(0,0,0,0);
    for (let i = 0; i < 365; i++) {
        const d = new Date(today); d.setDate(d.getDate() - i);
        const key = d.toISOString().split('T')[0];
        if (dates.includes(key)) count++;
        else if (i === 0) continue;
        else break;
    }
    return { count };
}

}

function openRandomBook() {

    openBook(books[Math.floor(Math.random() * books.length)].id);
}

function confirmDeleteLesson(id) {
    const lesson = getLessons().find(l => l.id === id);
    showConfirm('Удалить урок?', `Урок "${lesson?.title}" будет удалён.`, () => {
        DB.set('lessons', getLessons().filter(l => l.id !== id));

        showToast('🗑 Урок удалён');
    });

function confirmDeleteBook(id) {
    const book = getBooks().find(b => b.id === id);
    showConfirm('Удалить книгу?', `Книга "${book?.title}" будет удалена.`, () => {
        DB.set('books', getBooks().filter(b => b.id !== id));
        renderTab();
        showToast('🗑 Книга удалена');
    });
}

function confirmDeleteCat(id) {
    const cat = findCategory(id);
    const ids = getAllDescendantIds(id);
    showConfirm('Удалить раздел?', `Раздел "${cat?.title}" и всё его содержимое будет удалено.`, () => {
        DB.set('categories', getCategories().filter(c => !ids.includes(c.id)));
        DB.set('lessons', getLessons().filter(l => !ids.includes(l.categoryId)));
        DB.set('books', getBooks().filter(b => !ids.includes(b.categoryId)));
        state.currentCategory = null;
        renderTab();
        showToast('🗑 Раздел удалён');
    });
}

// ============ АУДИОПЛЕЕР ============
function openLesson(id) {
    const lesson = getAllLessons().find(l => l.id === id);

    state.currentLesson = lesson;
    state.currentCategory = lesson.categoryId;
    
    const categoryLessons = getLessons().filter(l => l.categoryId === lesson.categoryId);
    state.playlist = categoryLessons;
    state.playlistIndex = categoryLessons.findIndex(l => l.id === id);
    
    const p = getProgress('lesson', id);
    state.audio.src = lesson.audioUrl;
    state.audio.playbackRate = state.audioSpeed;
    if (p) state.audio.currentTime = p.position || 0;
    
    const fav = isFavorite('lesson', id);
    
    document.getElementById('audio-body').innerHTML = `
        <div class="audio-player">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; position: relative; z-index: 1;">
                <div style="flex: 1; min-width: 0;">
                    <div style="font-size: 18px; font-weight: 700;" class="truncate">${escapeHtml(lesson.title)}</div>
                    ${lesson.description ? `<div style="font-size: 12px; opacity: 0.8; margin-top: 4px;">${escapeHtml(lesson.description).substring(0, 80)}${lesson.description.length > 80 ? '...' : ''}</div>` : ''}
                </div>
                <button onclick="closeAudio()" style="background: rgba(255,255,255,0.2); border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">${icon('x', 16)}</button>
            </div>
            
            <div class="wave-container" id="wave">
                ${Array(7).fill(0).map(() => '<div class="wave-bar"></div>').join('')}
            </div>
            
            <div style="margin-bottom: 16px; position: relative; z-index: 1;">
                <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; opacity: 0.9;">
                    <span id="cur-time">0:00</span>
                    <span id="total-time">${formatDuration(lesson.duration)}</span>
                </div>
                <input type="range" id="seek" min="0" max="100" value="0" step="0.1"
                       style="width: 100%; margin: 0; accent-color: white;" oninput="seekAudio(this.value)">
            </div>
            
            <div class="speed-selector">
                ${[0.5, 0.75, 1, 1.25, 1.5, 2].map(s => `
                    <button class="speed-btn ${state.audioSpeed === s ? 'active' : ''}" onclick="setSpeed(${s})">${s}x</button>
                `).join('')}
            </div>
            
            <div class="audio-controls">
                <button onclick="skipAudio(-15)" title="Назад 15с">${icon('back15', 22)}</button>
                ${state.playlist.length > 1 ? `<button onclick="prevInPlaylist()" title="Предыдущий">${icon('skipForward', 22)}</button>` : ''}
                <button class="play-btn" id="play-btn" onclick="togglePlay()">${icon('play', 28)}</button>
                ${state.playlist.length > 1 ? `<button onclick="nextInPlaylist()" title="Следующий">${icon('skipForward', 22)}</button>` : ''}
                <button onclick="skipAudio(15)" title="Вперёд 15с">${icon('fwd15', 22)}</button>
            </div>
            
            <div style="display: flex; gap: 8px; position: relative; z-index: 1;">
                <button onclick="handleFav('lesson', ${id})" class="btn" style="background: rgba(255,255,255,0.2); color: white; margin: 0; flex: 1;">
                    ${fav ? icon('heartFill', 16) : icon('heart', 16)}
                    ${fav ? 'В избранном' : 'В избранное'}
                </button>
                <button onclick="completeLesson()" class="btn" style="background: rgba(255,255,255,0.2); color: white; margin: 0; flex: 1;">
                    ${icon('check', 16)} Завершить
                </button>
            </div>
            
            ${state.playlist.length > 1 ? `
                <div class="playlist-section">
                    <div style="font-size: 12px; opacity: 0.8; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;">
                        ${icon('headphones', 12)} Плейлист (${state.playlistIndex + 1}/${state.playlist.length})
                    </div>
                    ${state.playlist.map((pl, i) => `
                        <div class="playlist-item ${i === state.playlistIndex ? 'current' : ''}" onclick="playFromPlaylist(${i})">
                            <div class="playlist-item-num">${i + 1}</div>
                            <div class="playlist-item-title">${escapeHtml(pl.title)}</div>
                            <div class="playlist-item-dur">${formatDuration(pl.duration)}</div>
                        </div>
                    `).join('')}
                </div>

    `;
    
    document.getElementById('audio-modal').classList.add('active');
    document.getElementById('mini-player').classList.remove('visible');

function setSpeed(speed) {
    state.audioSpeed = speed;
    state.audio.playbackRate = speed;
    document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.classList.toggle('active', parseFloat(btn.textContent) === speed);
    });
}

function playFromPlaylist(index) {
    if (index < 0 || index >= state.playlist.length) return;
    state.playlistIndex = index;
    const lesson = state.playlist[index];
    state.currentLesson = lesson;
    
    const p = getProgress('lesson', lesson.id);
    state.audio.src = lesson.audioUrl;
    state.audio.playbackRate = state.audioSpeed;
    state.audio.currentTime = p ? (p.position || 0) : 0;
    state.audio.play().catch(() => {});
    
    openLesson(lesson.id);
    state.audio.play().catch(() => {});
}

function nextInPlaylist() {
    if (state.playlistIndex < state.playlist.length - 1) {
        playFromPlaylist(state.playlistIndex + 1);
    }
}

function prevInPlaylist() {
    if (state.playlistIndex > 0) {
        playFromPlaylist(state.playlistIndex - 1);
    }
}

function updateMediaSession() {
    if ('mediaSession' in navigator && state.currentLesson) {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: state.currentLesson.title,
            artist: state.currentLesson.categoryName || 'Уроки и Книги',
            album: 'Уроки и Книги'
        });
        navigator.mediaSession.setActionHandler('play', () => togglePlay());
        navigator.mediaSession.setActionHandler('pause', () => togglePlay());
        navigator.mediaSession.setActionHandler('seekbackward', () => skipAudio(-15));
        navigator.mediaSession.setActionHandler('seekforward', () => skipAudio(15));
        navigator.mediaSession.setActionHandler('previoustrack', () => prevInPlaylist());
        navigator.mediaSession.setActionHandler('nexttrack', () => nextInPlaylist());
    }
}

function togglePlay() {
    if (state.audio.paused) {
        state.audio.play().catch(e => {
            alert('Не удалось воспроизвести. Проверь ссылку.');
        });
        document.getElementById('play-btn').innerHTML = icon('pause', 28);
        document.querySelectorAll('.wave-bar').forEach(b => b.classList.add('playing'));
    } else {
        state.audio.pause();
        document.getElementById('play-btn').innerHTML = icon('play', 28);
        document.querySelectorAll('.wave-bar').forEach(b => b.classList.remove('playing'));
    }
}

function seekAudio(v) {
    if (state.audio.duration) {
        state.audio.currentTime = (parseFloat(v) / 100) * state.audio.duration;
    }
}

function skipAudio(sec) {
    state.audio.currentTime = Math.max(0, Math.min(state.audio.duration || 0, state.audio.currentTime + sec));
}

function updateAudioTime() {
    const ct = document.getElementById('cur-time');
    const seek = document.getElementById('seek');
    if (ct) ct.textContent = formatDuration(state.audio.currentTime);
    if (seek && state.audio.duration && !seek.matches(':active')) {
        seek.value = (state.audio.currentTime / state.audio.duration) * 100;
    }
    if (state.currentLesson && state.audio.duration) {
        const pct = (state.audio.currentTime / state.audio.duration) * 100;
        saveProgress('lesson', state.currentLesson.id, pct, state.audio.currentTime, false);
    }
}

state.audio.addEventListener('timeupdate', updateAudioTime);
state.audio.addEventListener('loadedmetadata', () => {
    const tt = document.getElementById('total-time');
    if (tt && state.audio.duration && isFinite(state.audio.duration)) {
        tt.textContent = formatDuration(state.audio.duration);
        if (state.currentLesson && state.currentLesson.duration !== Math.floor(state.audio.duration)) {
            const lessons = getLessons();
            const idx = lessons.findIndex(l => l.id === state.currentLesson.id);
            if (idx >= 0) {
                lessons[idx].duration = Math.floor(state.audio.duration);
                DB.set('lessons', lessons);
                state.currentLesson.duration = Math.floor(state.audio.duration);
            }
        }
    }
});
state.audio.addEventListener('ended', () => {
    document.getElementById('play-btn').innerHTML = icon('play', 28);
    document.querySelectorAll('.wave-bar').forEach(b => b.classList.remove('playing'));
    if (state.currentLesson) {
        saveProgress('lesson', state.currentLesson.id, 100, state.currentLesson.duration, true);
    }
    if (state.playlistIndex < state.playlist.length - 1) {
        setTimeout(() => nextInPlaylist(), 1000);
    }
});

function completeLesson() {
    if (!state.currentLesson) return;
    saveProgress('lesson', state.currentLesson.id, 100, state.currentLesson.duration, true);
    closeAudio();
    showToast('🎉 Урок завершён!');
}

function closeAudio() {
    state.audio.pause();
    document.getElementById('audio-modal').classList.remove('active');
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
    renderTab();
}

async function renderPdfPage() {
    if (!state.pdfDoc) return;
    const page = await state.pdfDoc.getPage(state.pdfPage);
    const scale = 1.5;
    const viewport = page.getViewport({ scale });
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    canvas.height = viewport.height;
    canvas.width = viewport.width;
    await page.render({ canvasContext: ctx, viewport }).promise;
    document.getElementById('p-cur').textContent = state.pdfPage;
    if (state.currentBook) {
        const pct = (state.pdfPage / state.currentBook.pages) * 100;
        saveProgress('book', state.currentBook.id, pct, state.pdfPage, false);
    }
}

function pdfNext() {
    if (state.pdfDoc && state.pdfPage < state.pdfDoc.numPages) {
        state.pdfPage++;
        renderPdfPage();
    }
}

function pdfPrev() {
    if (state.pdfPage > 1) {
        state.pdfPage--;
        renderPdfPage();
    }
}

function addBookmark() {
    if (!state.currentBook) return;
    const key = 'bookmarks_' + state.currentBook.id;
    const bookmarks = DB.get(key);
    const existing = bookmarks.findIndex(b => b.page === state.pdfPage);
    if (existing >= 0) {
        bookmarks.splice(existing, 1);
        DB.set(key, bookmarks);
        showToast('🔖 Закладка удалена');
    } else {
        bookmarks.push({ page: state.pdfPage, date: new Date().toISOString() });
        bookmarks.sort((a, b) => a.page - b.page);
        DB.set(key, bookmarks);
        showToast('🔖 Закладка добавлена');
    }
    openBook(state.currentBook.id);
}

function renderProgress() {
    const container = document.getElementById('tab-progress');
    const progress = DB.get('progress');
    const lessons = getAllLessons();
    const books = getAllBooks();
    
    const totalL = lessons.length;
    const totalB = books.length;
    const doneL = progress.filter(p => p.type === 'lesson' && p.completed).length;
    const doneB = progress.filter(p => p.type === 'book' && p.completed).length;
    
    const avgPct = progress.length ? progress.reduce((s, p) => s + (p.percent || 0), 0) / progress.length : 0;
    const totalTime = progress.reduce((s, p) => s + (p.position || 0), 0);
    const hours = Math.floor(totalTime / 3600);
    const mins = Math.floor((totalTime % 3600) / 60);
    
    const weekData = getWeekData();
    const maxVal = Math.max(...weekData.map(d => d.value), 1);
    
    const heatData = {};
    progress.forEach(p => { if (p.date) heatData[p.date] = (heatData[p.date] || 0) + 1; });
    let heatCells = '';
    for (let i = 27; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const key = d.toISOString().split('T')[0];
        const count = heatData[key] || 0;
        const level = count === 0 ? 0 : count === 1 ? 1 : count === 2 ? 2 : count <= 4 ? 3 : 4;
        heatCells += `<div class="heat-cell heat-${level}" title="${key}: ${count}"></div>`;
    }
    
    container.innerHTML = `
        <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
            ${icon('chart', 24)} Прогресс
        </h2>
        
        <div class="gradient-card" style="background: var(--gradient-1); margin-bottom: 16px;">
            <div style="position: relative; z-index: 1;">
                <div class="ring-container">
                    <svg width="140" height="140" style="transform: rotate(-90deg);">
                        <circle cx="70" cy="70" r="58" stroke="rgba(255,255,255,0.2)" stroke-width="10" fill="none"/>
                        <circle cx="70" cy="70" r="58" stroke="white" stroke-width="10" fill="none"
                                stroke-dasharray="${2 * Math.PI * 58}"
                                stroke-dashoffset="${2 * Math.PI * 58 * (1 - avgPct / 100)}"
                                stroke-linecap="round" style="transition: stroke-dashoffset 1s ease;"/>
                        <text x="70" y="70" text-anchor="middle" dy=".3em" font-size="28" font-weight="bold" fill="white" transform="rotate(90 70 70)">${Math.round(avgPct)}%</text>
                    </svg>
                </div>
                <div class="stats-grid" style="margin-top: 12px;">
                    <div><div class="stat-value">${doneL}/${totalL}</div><div class="stat-label">Уроков</div></div>
                    <div><div class="stat-value">${doneB}/${totalB}</div><div class="stat-label">Книг</div></div>
                    <div><div class="stat-value">${hours}ч ${mins}м</div><div class="stat-label">Время</div></div>
                </div>
            </div>
        </div>
        
        <div class="card" style="cursor: default;">
            <div class="section-title" style="margin-bottom: 12px;">${icon('chart', 14)} Активность за неделю</div>
            <div class="week-chart">
                ${weekData.map(d => `
                    <div style="flex: 1; display: flex; flex-direction: column; align-items: center;">
                        <div class="week-bar" style="height: 100%;">
                            <div class="week-bar-fill" style="height: ${(d.value / maxVal) * 100}%;"></div>
                        </div>
                        <div class="week-label">${d.label}</div>
                    </div>
                `).join('')}
            </div>
        </div>
        
        <div class="card" style="cursor: default; margin-top: 12px;">
            <div class="section-title" style="margin-bottom: 12px;">${icon('fire', 14)} Активность (28 дней)</div>
            <div class="heat-grid">${heatCells}</div>
            <div style="display: flex; justify-content: space-between; font-size: 10px; color: var(--text-tertiary); margin-top: 6px;">
                <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
            </div>
        </div>
    `;
}

function getCategoryStats() {
    const rootCats = buildTree(null);
    const progress = DB.get('progress');
    
    return rootCats.map(cat => {
        const allLessons = [];
        const allBooks = [];
        
        const collect = (c) => {
            c.lessons.forEach(l => allLessons.push(l));
            c.books.forEach(b => allBooks.push(b));
            c.children.forEach(collect);
        };
        collect(cat);
        
        const doneL = allLessons.filter(l => progress.find(p => p.type === 'lesson' && p.contentId === l.id && p.completed)).length;
        const doneB = allBooks.filter(b => progress.find(p => p.type === 'book' && p.contentId === b.id && p.completed)).length;
        const total = allLessons.length + allBooks.length;
        const done = doneL + doneB;
        const percent = total > 0 ? Math.round((done / total) * 100) : 0;
        
        return {
            title: cat.title,
            emoji: cat.emoji,
            totalL: allLessons.length,
            totalB: allBooks.length,
            doneL, doneB, percent
        };
    }).filter(cs => cs.totalL + cs.totalB > 0);
}

function getWeekData() {
    const progress = DB.get('progress');
    const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const result = [];
    const today = new Date();
    for (let i = 6; i >= 0; i--) {
        const d = new Date(today); d.setDate(d.getDate() - i);
        const key = d.toISOString().split('T')[0];
        const count = progress.filter(p => p.date === key).length;
        result.push({ label: days[(d.getDay() + 6) % 7], value: count, date: key });
    }
    return result;
}

    }
    
    const catOptions = allCats.map(c => 
        `<option value="${c.id}" ${(book?.categoryId || catId) === c.id ? 'selected' : ''}>${c.emoji || '📂'} ${escapeHtml(c.title)}</option>`
    ).join('');
    
    document.getElementById('modal-body').innerHTML = `
        <div class="modal-title">
            ${title}
            <button class="close-btn" onclick="closeModal()">${icon('x', 16)}</button>
        </div>
        <form onsubmit="saveBook(event, ${editId || 'null'})">
            <label>Раздел *</label>
            <select id="f-cat" required>${catOptions}</select>
            
            <label>Название *</label>
            <input type="text" id="f-title" value="${book ? escapeHtml(book.title) : ''}" required>
            
            <label>Автор</label>
            <input type="text" id="f-author" value="${book?.author || ''}">
            
            <label>Описание</label>
            <textarea id="f-desc" rows="3" placeholder="О чём эта книга...">${book?.description || ''}</textarea>
            
            <label>Ссылка на PDF *</label>
            <input type="url" id="f-url" value="${book?.pdfUrl || ''}" required placeholder="https://...">
            
            <label>Количество страниц *</label>
            <input type="number" id="f-pages" value="${book?.pages || ''}" required min="1">
            
            <button type="submit" class="btn btn-purple">${icon('check', 16)} Сохранить</button>
            <button type="button" onclick="closeModal()" class="btn btn-secondary">Отмена</button>
        </form>
    `;
    document.getElementById('modal').classList.add('active');
}

function saveBook(e, editId) {
    e.preventDefault();
    const books = getBooks();
    const data = {
        categoryId: parseInt(document.getElementById('f-cat').value),
        title: document.getElementById('f-title').value.trim(),
        author: document.getElementById('f-author').value.trim(),
        description: document.getElementById('f-desc').value.trim(),
        pdfUrl: document.getElementById('f-url').value.trim(),
        pages: parseInt(document.getElementById('f-pages').value)
    };
    
    if (editId) {
        const idx = books.findIndex(b => b.id === editId);
        books[idx] = { ...books[idx], ...data };
    } else {
        books.push({ id: DB.nextId('books'), ...data, created: new Date().toISOString() });
    }
    
    DB.set('books', books);
    closeModal();
    renderTab();
    showToast(editId ? '✅ Книга обновлена' : '✅ Книга создана');
}

// ============ TOAST ============
function showToast(message) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.cssText = `
        position: fixed; bottom: 160px; left: 50%;
        transform: translateX(-50%);
        background: var(--text-primary); color: var(--bg-primary);
        padding: 12px 20px; border-radius: 12px;
        font-size: 14px; font-weight: 500;
        box-shadow: var(--shadow-xl); z-index: 1000;
        animation: slideUp 0.3s ease;
        max-width: 90%; text-align: center;
    `;
    toast.textContent = message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
    }, 2500);
}

// ============ СТАРТ ============
init();
</script>
</body>
</html>
