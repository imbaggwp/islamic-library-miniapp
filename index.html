<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Исламские уроки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.css">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 0;
    background: var(--tg-theme-bg-color, #0f1419);
    color: var(--tg-theme-text-color, #fff);
    overscroll-behavior: none;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  .tg-btn { background: var(--tg-theme-button-color, #2ea6ff); color: var(--tg-theme-button-text-color, #fff); }
  .tg-btn:hover { opacity: 0.9; }
  .tg-secondary { background: var(--tg-theme-secondary-bg-color, #1c2733); }
  .tg-hint { color: var(--tg-theme-hint-color, #708499); }
  .tg-link { color: var(--tg-theme-link-color, #2ea6ff); }
  .card {
    background: var(--tg-theme-secondary-bg-color, #1c2733);
    border-radius: 16px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card:active { transform: scale(0.98); }
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .islamic-pattern {
    background-image: radial-gradient(circle at 20% 50%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
                      radial-gradient(circle at 80% 80%, rgba(234, 179, 8, 0.06) 0%, transparent 50%);
  }
  .progress-ring { transform: rotate(-90deg); }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-content {
    background: var(--tg-theme-bg-color, #0f1419);
    width: 100%; max-height: 90vh; overflow-y: auto;
    border-radius: 24px 24px 0 0; padding: 20px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  input, textarea, select {
    background: var(--tg-theme-secondary-bg-color, #1c2733);
    color: var(--tg-theme-text-color, #fff);
    border: 1px solid var(--tg-theme-hint-color, #708499);
    border-radius: 12px;
    padding: 12px;
    width: 100%;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--tg-theme-button-color, #2ea6ff); }
  .audio-player {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--tg-theme-secondary-bg-color, #1c2733);
    border-top: 1px solid var(--tg-theme-hint-color, #333);
    padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .progress-bar {
    height: 4px; background: var(--tg-theme-hint-color, #333);
    border-radius: 2px; overflow: hidden; cursor: pointer;
  }
  .progress-bar-fill { height: 100%; background: var(--tg-theme-button-color, #2ea6ff); transition: width 0.1s; }
  .pdf-container { position: fixed; inset: 0; background: #2a2a2a; z-index: 200; overflow-y: auto; }
  .pdf-canvas { display: block; margin: 0 auto 8px; max-width: 100%; }
  .tab-active { color: var(--tg-theme-button-color, #2ea6ff); }
  .tab-active svg { stroke: var(--tg-theme-button-color, #2ea6ff); }
  .badge {
    position: absolute; top: -4px; right: -4px;
    background: #ef4444; color: white; font-size: 10px;
    border-radius: 10px; padding: 2px 6px; font-weight: 600;
  }
  .gradient-header {
    background: linear-gradient(135deg, #065f46 0%, #14532d 50%, #1e3a8a 100%);
  }
</style>
</head>
<body class="islamic-pattern">

<div id="app"></div>

<!-- Audio Player -->
<div id="audioPlayer" class="audio-player hidden">
  <div class="flex items-center gap-3">
    <button id="playPauseBtn" class="w-12 h-12 rounded-full tg-btn flex items-center justify-center flex-shrink-0">
      <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
    </button>
    <div class="flex-1 min-w-0">
      <div id="audioTitle" class="text-sm font-medium truncate"></div>
      <div class="progress-bar mt-2" id="audioProgress">
        <div class="progress-bar-fill" id="audioProgressFill" style="width:0%"></div>
      </div>
      <div class="flex justify-between text-xs tg-hint mt-1">
        <span id="audioCurrent">0:00</span>
        <span id="audioDuration">0:00</span>
      </div>
    </div>
    <button id="closeAudioBtn" class="tg-hint p-2">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<!-- PDF Viewer -->
<div id="pdfViewer" class="pdf-container hidden">
  <div class="sticky top-0 bg-black/80 backdrop-blur p-3 flex items-center justify-between z-10">
    <button id="closePdfBtn" class="tg-btn px-4 py-2 rounded-lg text-sm font-medium">Закрыть</button>
    <div class="text-sm"><span id="pdfPageNum">1</span> / <span id="pdfPageCount">0</span></div>
    <div class="flex gap-2">
      <button id="prevPageBtn" class="tg-btn px-3 py-2 rounded-lg text-sm">←</button>
      <button id="nextPageBtn" class="tg-btn px-3 py-2 rounded-lg text-sm">→</button>
    </div>
  </div>
  <div id="pdfContent" class="p-2"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ============ STATE ============
const ADMIN_PASSWORD = 'admin123';
const STORAGE_KEY = 'islamic_app_data_v1';

let state = {
  view: 'home',
  sections: [],
  progress: { completedLessons: [], readBooks: [], lessonTimes: {}, bookPages: {} },
  currentSection: null,
  currentSubsection: null,
  currentLesson: null,
  currentBook: null,
  isAdmin: false,
  editingSection: null,
  editingSubsection: null,
};

let audio = new Audio();
let pdfDoc = null, pdfPage = 1;

// ============ STORAGE ============
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state.sections = d.sections || [];
      state.progress = d.progress || { completedLessons: [], readBooks: [], lessonTimes: {}, bookPages: {} };
    } else {
      // Demo data
      state.sections = [
        {
          id: 's1', title: 'Основы ислама', icon: '🕌',
          subsections: [
            {
              id: 'ss1', title: 'Акыда (вероубеждение)',
              lessons: [
                { id: 'l1', title: 'Шесть столпов веры', audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', duration: '15 мин' },
                { id: 'l2', title: 'Единобожие (Таухид)', audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', duration: '20 мин' }
              ],
              books: [
                { id: 'b1', title: 'Три основы', pdfUrl: 'https://mozilla.github.io/pdf.js/web/compressed.tracemonkey-pldi-09.pdf', pages: 10 }
              ]
            },
            {
              id: 'ss2', title: 'Фикх (правоведение)',
              lessons: [
                { id: 'l3', title: 'Очищение (Тахара)', audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', duration: '18 мин' }
              ],
              books: []
            }
          ]
        },
        {
          id: 's2', title: 'Сира Пророка ﷺ', icon: '📖',
          subsections: [
            {
              id: 'ss3', title: 'Жизнь Пророка ﷺ',
              lessons: [
                { id: 'l4', title: 'Рождение Пророка ﷺ', audioUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3', duration: '25 мин' }
              ],
              books: []
            }
          ]
        }
      ];
      saveData();
    }
  } catch(e) { console.error(e); }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ sections: state.sections, progress: state.progress }));
}

// ============ HELPERS ============
function uid() { return Math.random().toString(36).slice(2, 10); }
function fmtTime(s) { if (!s || isNaN(s)) return '0:00'; const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m}:${sec.toString().padStart(2,'0')}`; }

function getSectionProgress(section) {
  let total = 0, done = 0;
  section.subsections.forEach(ss => {
    total += ss.lessons.length + ss.books.length;
    ss.lessons.forEach(l => { if (state.progress.completedLessons.includes(l.id)) done++; });
    ss.books.forEach(b => { if (state.progress.readBooks.includes(b.id)) done++; });
  });
  return total === 0 ? 0 : Math.round((done/total)*100);
}

function getTotalStats() {
  let lessons = 0, books = 0, completedL = 0, completedB = 0, totalTime = 0;
  state.sections.forEach(s => s.subsections.forEach(ss => {
    lessons += ss.lessons.length;
    books += ss.books.length;
    ss.lessons.forEach(l => {
      if (state.progress.completedLessons.includes(l.id)) completedL++;
      totalTime += (state.progress.lessonTimes[l.id] || 0);
    });
    ss.books.forEach(b => { if (state.progress.readBooks.includes(b.id)) completedB++; });
  }));
  return { lessons, books, completedL, completedB, totalTime };
}

// ============ RENDER ============
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  switch(state.view) {
    case 'home': renderHome(app); break;
    case 'section': renderSection(app); break;
    case 'subsection': renderSubsection(app); break;
    case 'progress': renderProgress(app); break;
    case 'admin': renderAdmin(app); break;
  }
  renderNav();
}

function renderNav() {
  let nav = document.getElementById('bottomNav');
  if (!nav) {
    nav = document.createElement('div');
    nav.id = 'bottomNav';
    nav.className = 'fixed bottom-0 left-0 right-0 tg-secondary border-t border-black/30 flex justify-around items-center py-2 z-40';
    nav.style.paddingBottom = 'calc(8px + env(safe-area-inset-bottom))';
    document.body.appendChild(nav);
  }
  const tabs = [
    { id: 'home', label: 'Главная', icon: '<path d="M3 12l9-9 9 9v9a2 2 0 01-2 2h-4v-7h-6v7H5a2 2 0 01-2-2v-9z"/>' },
    { id: 'progress', label: 'Прогресс', icon: '<path d="M3 3v18h18M7 14l4-4 4 4 6-6"/>' },
    { id: 'admin', label: 'Админ', icon: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>' }
  ];
  nav.innerHTML = tabs.map(t => `
    <button data-nav="${t.id}" class="flex flex-col items-center gap-1 px-4 py-1 ${state.view === t.id ? 'tab-active' : 'tg-hint'}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg>
      <span class="text-xs">${t.label}</span>
    </button>
  `).join('');
  nav.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { state.view = b.dataset.nav; render(); });
}

// ============ HOME ============
function renderHome(app) {
  const stats = getTotalStats();
  const completedCount = stats.completedL + stats.completedB;
  const totalCount = stats.lessons + stats.books;
  const overallPct = totalCount === 0 ? 0 : Math.round((completedCount/totalCount)*100);

  let html = `
    <div class="gradient-header p-6 pb-8 rounded-b-3xl fade-in">
      <div class="flex items-center justify-between mb-4">
        <div>
          <div class="text-xs opacity-70">Ассаляму алейкум</div>
          <h1 class="text-2xl font-bold mt-1">Исламские знания</h1>
        </div>
        <div class="text-4xl">☪</div>
      </div>
      <div class="bg-white/10 backdrop-blur rounded-2xl p-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm">Общий прогресс</span>
          <span class="text-lg font-bold">${overallPct}%</span>
        </div>
        <div class="h-2 bg-white/20 rounded-full overflow-hidden">
          <div class="h-full bg-gradient-to-r from-green-400 to-yellow-400 transition-all" style="width:${overallPct}%"></div>
        </div>
        <div class="flex justify-between text-xs mt-2 opacity-80">
          <span>Пройдено: ${completedCount} из ${totalCount}</span>
          <span>⏱ ${fmtTime(stats.totalTime)}</span>
        </div>
      </div>
    </div>
    <div class="px-4 mt-6 fade-in">
      <h2 class="text-lg font-bold mb-3">Разделы</h2>
  `;
  if (state.sections.length === 0) {
    html += `<div class="card p-8 text-center tg-hint">Разделов пока нет. Добавьте их в админ-панели.</div>`;
  } else {
    state.sections.forEach(s => {
      const pct = getSectionProgress(s);
      const lessonCount = s.subsections.reduce((a, ss) => a + ss.lessons.length, 0);
      const bookCount = s.subsections.reduce((a, ss) => a + ss.books.length, 0);
      html += `
        <div class="card p-4 mb-3 cursor-pointer" data-section="${s.id}">
          <div class="flex items-center gap-3">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-green-600 to-emerald-800 flex items-center justify-center text-2xl flex-shrink-0">${s.icon || '📚'}</div>
            <div class="flex-1 min-w-0">
              <div class="font-semibold truncate">${s.title}</div>
              <div class="text-xs tg-hint mt-1">${lessonCount} уроков · ${bookCount} книг</div>
              <div class="h-1.5 bg-black/30 rounded-full mt-2 overflow-hidden">
                <div class="h-full tg-btn" style="width:${pct}%"></div>
              </div>
            </div>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tg-hint flex-shrink-0"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      `;
    });
  }
  html += `</div>`;
  app.innerHTML = html;
  app.querySelectorAll('[data-section]').forEach(el => {
    el.onclick = () => {
      state.currentSection = state.sections.find(s => s.id === el.dataset.section);
      state.view = 'section';
      render();
    };
  });
}

// ============ SECTION ============
function renderSection(app) {
  const s = state.currentSection;
  if (!s) { state.view = 'home'; render(); return; }
  const pct = getSectionProgress(s);
  let html = `
    <div class="p-4 fade-in">
      <button id="backBtn" class="flex items-center gap-2 tg-hint mb-3 text-sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Назад
      </button>
      <div class="gradient-header rounded-2xl p-5 mb-4">
        <div class="flex items-center gap-3">
          <div class="text-4xl">${s.icon || '📚'}</div>
          <div class="flex-1">
            <h1 class="text-xl font-bold">${s.title}</h1>
            <div class="text-sm opacity-80 mt-1">Прогресс: ${pct}%</div>
          </div>
        </div>
        <div class="h-2 bg-white/20 rounded-full mt-4 overflow-hidden">
          <div class="h-full bg-gradient-to-r from-green-400 to-yellow-400" style="width:${pct}%"></div>
        </div>
      </div>
      <h2 class="text-lg font-bold mb-3">Подразделы</h2>
  `;
  if (s.subsections.length === 0) {
    html += `<div class="card p-6 text-center tg-hint">Подразделов пока нет</div>`;
  } else {
    s.subsections.forEach(ss => {
      const total = ss.lessons.length + ss.books.length;
      const done = ss.lessons.filter(l => state.progress.completedLessons.includes(l.id)).length +
                   ss.books.filter(b => state.progress.readBooks.includes(b.id)).length;
      html += `
        <div class="card p-4 mb-3 cursor-pointer" data-subsection="${ss.id}">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-800 flex items-center justify-center text-xl flex-shrink-0">📂</div>
            <div class="flex-1 min-w-0">
              <div class="font-semibold truncate">${ss.title}</div>
              <div class="text-xs tg-hint mt-1">${ss.lessons.length} уроков · ${ss.books.length} книг</div>
              <div class="text-xs tg-hint mt-0.5">Пройдено: ${done}/${total}</div>
            </div>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="tg-hint"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      `;
    });
  }
  html += `</div>`;
  app.innerHTML = html;
  document.getElementById('backBtn').onclick = () => { state.view = 'home'; render(); };
  app.querySelectorAll('[data-subsection]').forEach(el => {
    el.onclick = () => {
      state.currentSubsection = s.subsections.find(ss => ss.id === el.dataset.subsection);
      state.view = 'subsection';
      render();
    };
  });
}

// ============ SUBSECTION ============
function renderSubsection(app) {
  const ss = state.currentSubsection;
  if (!ss) { state.view = 'section'; render(); return; }
  let html = `
    <div class="p-4 fade-in">
      <button id="backBtn" class="flex items-center gap-2 tg-hint mb-3 text-sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Назад
      </button>
      <h1 class="text-xl font-bold mb-4">${ss.title}</h1>
  `;
  if (ss.lessons.length > 0) {
    html += `<h2 class="text-sm font-semibold tg-hint uppercase mb-2">🎧 Аудио уроки</h2>`;
    ss.lessons.forEach(l => {
      const done = state.progress.completedLessons.includes(l.id);
      const time = state.progress.lessonTimes[l.id] || 0;
      html += `
        <div class="card p-4 mb-2 cursor-pointer flex items-center gap-3" data-lesson="${l.id}">
          <div class="w-11 h-11 rounded-full bg-gradient-to-br from-green-500 to-emerald-700 flex items-center justify-center flex-shrink-0">
            ${done ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>'}
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-medium truncate">${l.title}</div>
            <div class="text-xs tg-hint mt-0.5">${l.duration || ''} ${time > 0 ? '· Прослушано: '+fmtTime(time) : ''}</div>
          </div>
        </div>
      `;
    });
  }
  if (ss.books.length > 0) {
    html += `<h2 class="text-sm font-semibold tg-hint uppercase mb-2 mt-5">📖 Книги (PDF)</h2>`;
    ss.books.forEach(b => {
      const done = state.progress.readBooks.includes(b.id);
      const pages = state.progress.bookPages[b.id] || 0;
      html += `
        <div class="card p-4 mb-2 cursor-pointer flex items-center gap-3" data-book="${b.id}">
          <div class="w-11 h-11 rounded-full bg-gradient-to-br from-yellow-500 to-orange-700 flex items-center justify-center flex-shrink-0 text-white font-bold text-lg">
            ${done ? '✓' : '📕'}
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-medium truncate">${b.title}</div>
            <div class="text-xs tg-hint mt-0.5">${pages > 0 ? 'Прочитано страниц: '+pages : 'Не начата'}</div>
          </div>
        </div>
      `;
    });
  }
  if (ss.lessons.length === 0 && ss.books.length === 0) {
    html += `<div class="card p-6 text-center tg-hint">Материалов пока нет</div>`;
  }
  html += `</div>`;
  app.innerHTML = html;
  document.getElementById('backBtn').onclick = () => { state.view = 'section'; render(); };
  app.querySelectorAll('[data-lesson]').forEach(el => {
    el.onclick = () => {
      const lesson = ss.lessons.find(l => l.id === el.dataset.lesson);
      playLesson(lesson);
    };
  });
  app.querySelectorAll('[data-book]').forEach(el => {
    el.onclick = () => {
      const book = ss.books.find(b => b.id === el.dataset.book);
      openBook(book);
    };
  });
}

// ============ AUDIO PLAYER ============
function playLesson(lesson) {
  state.currentLesson = lesson;
  audio.src = lesson.audioUrl;
  const player = document.getElementById('audioPlayer');
  player.classList.remove('hidden');
  document.getElementById('audioTitle').textContent = lesson.title;
  audio.play().catch(()=>{});
  updatePlayIcon(true);
}

function updatePlayIcon(playing) {
  document.getElementById('playIcon').classList.toggle('hidden', playing);
  document.getElementById('pauseIcon').classList.toggle('hidden', !playing);
}

audio.addEventListener('play', () => updatePlayIcon(true));
audio.addEventListener('pause', () => updatePlayIcon(false));
audio.addEventListener('timeupdate', () => {
  const pct = (audio.currentTime / audio.duration) * 100 || 0;
  document.getElementById('audioProgressFill').style.width = pct + '%';
  document.getElementById('audioCurrent').textContent = fmtTime(audio.currentTime);
  document.getElementById('audioDuration').textContent = fmtTime(audio.duration);
  if (state.currentLesson) {
    state.progress.lessonTimes[state.currentLesson.id] = Math.max(
      state.progress.lessonTimes[state.currentLesson.id] || 0,
      audio.currentTime
    );
    if (audio.duration && audio.currentTime / audio.duration > 0.9) {
      if (!state.progress.completedLessons.includes(state.currentLesson.id)) {
        state.progress.completedLessons.push(state.currentLesson.id);
      }
    }
    saveData();
  }
});
audio.addEventListener('ended', () => {
  if (state.currentLesson && !state.progress.completedLessons.includes(state.currentLesson.id)) {
    state.progress.completedLessons.push(state.currentLesson.id);
    saveData();
    if (tg) tg.HapticFeedback?.notificationOccurred('success');
  }
});

document.getElementById('playPauseBtn').onclick = () => {
  if (audio.paused) audio.play(); else audio.pause();
};
document.getElementById('closeAudioBtn').onclick = () => {
  audio.pause();
  document.getElementById('audioPlayer').classList.add('hidden');
  state.currentLesson = null;
  if (state.view === 'subsection') render();
};
document.getElementById('audioProgress').onclick = (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if (audio.duration) audio.currentTime = pct * audio.duration;
};

// ============ PDF VIEWER ============
async function openBook(book) {
  state.currentBook = book;
  const viewer = document.getElementById('pdfViewer');
  const content = document.getElementById('pdfContent');
  viewer.classList.remove('hidden');
  content.innerHTML = '<div class="text-center p-8">Загрузка...</div>';
  try {
    pdfDoc = await pdfjsLib.getDocument(book.pdfUrl).promise;
    document.getElementById('pdfPageCount').textContent = pdfDoc.numPages;
    pdfPage = (state.progress.bookPages[book.id] || 0) + 1;
    if (pdfPage > pdfDoc.numPages) pdfPage = 1;
    await renderPdfPage();
  } catch(e) {
    content.innerHTML = `<div class="text-center p-8 text-red-400">Ошибка загрузки PDF: ${e.message}</div>`;
  }
}

async function renderPdfPage() {
  if (!pdfDoc) return;
  const content = document.getElementById('pdfContent');
  content.innerHTML = '';
  const page = await pdfDoc.getPage(pdfPage);
  const viewport = page.getViewport({ scale: window.innerWidth / page.getViewport({scale:1}).width });
  const canvas = document.createElement('canvas');
  canvas.className = 'pdf-canvas';
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  content.appendChild(canvas);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  document.getElementById('pdfPageNum').textContent = pdfPage;
  // Save progress
  if (state.currentBook) {
    state.progress.bookPages[state.currentBook.id] = Math.max(
      state.progress.bookPages[state.currentBook.id] || 0,
      pdfPage
    );
    if (pdfPage >= pdfDoc.numPages && !state.progress.readBooks.includes(state.currentBook.id)) {
      state.progress.readBooks.push(state.currentBook.id);
      if (tg) tg.HapticFeedback?.notificationOccurred('success');
    }
    saveData();
  }
}

document.getElementById('closePdfBtn').onclick = () => {
  document.getElementById('pdfViewer').classList.add('hidden');
  pdfDoc = null;
  state.currentBook = null;
  if (state.view === 'subsection') render();
};
document.getElementById('prevPageBtn').onclick = async () => {
  if (pdfPage > 1) { pdfPage--; await renderPdfPage(); }
};
document.getElementById('nextPageBtn').onclick = async () => {
  if (pdfDoc && pdfPage < pdfDoc.numPages) { pdfPage++; await renderPdfPage(); }
};

// ============ PROGRESS ============
function renderProgress(app) {
  const stats = getTotalStats();
  const completedCount = stats.completedL + stats.completedB;
  const totalCount = stats.lessons + stats.books;
  const overallPct = totalCount === 0 ? 0 : Math.round((completedCount/totalCount)*100);

  let html = `
    <div class="p-4 fade-in">
      <h1 class="text-2xl font-bold mb-4">Мой прогресс</h1>
      <div class="card p-6 mb-4 text-center">
        <div class="relative inline-block">
          <svg width="140" height="140" class="progress-ring">
            <circle cx="70" cy="70" r="60" stroke="currentColor" stroke-width="10" fill="none" class="tg-hint opacity-30"/>
            <circle cx="70" cy="70" r="60" stroke="url(#grad)" stroke-width="10" fill="none"
              stroke-linecap="round" stroke-dasharray="${2*Math.PI*60}"
              stroke-dashoffset="${2*Math.PI*60*(1-overallPct/100)}"/>
            <defs><linearGradient id="grad"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#eab308"/></linearGradient></defs>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <div class="text-3xl font-bold">${overallPct}%</div>
            <div class="text-xs tg-hint">завершено</div>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3 mt-5">
          <div class="tg-secondary rounded-xl p-3">
            <div class="text-xl font-bold text-green-400">${stats.completedL}</div>
            <div class="text-xs tg-hint">уроков</div>
          </div>
          <div class="tg-secondary rounded-xl p-3">
            <div class="text-xl font-bold text-yellow-400">${stats.completedB}</div>
            <div class="text-xs tg-hint">книг</div>
          </div>
          <div class="tg-secondary rounded-xl p-3">
            <div class="text-xl font-bold text-blue-400">${fmtTime(stats.totalTime)}</div>
            <div class="text-xs tg-hint">время</div>
          </div>
        </div>
      </div>
      <h2 class="text-lg font-bold mb-3">По разделам</h2>
  `;
  state.sections.forEach(s => {
    const pct = getSectionProgress(s);
    html += `
      <div class="card p-4 mb-2">
        <div class="flex items-center gap-3 mb-2">
          <div class="text-2xl">${s.icon || '📚'}</div>
          <div class="flex-1">
            <div class="font-medium">${s.title}</div>
            <div class="text-xs tg-hint">${pct}% завершено</div>
          </div>
        </div>
        <div class="h-2 bg-black/30 rounded-full overflow-hidden">
          <div class="h-full bg-gradient-to-r from-green-500 to-yellow-500" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  });
  if (state.sections.length === 0) {
    html += `<div class="card p-6 text-center tg-hint">Нет данных</div>`;
  }
  html += `
    <div class="mt-6 p-4 tg-secondary rounded-2xl text-center">
      <div class="text-3xl mb-2">🤲</div>
      <div class="text-sm tg-hint italic">"И скажи: "Господи! Приумножь мои знания"</div>
      <div class="text-xs tg-hint mt-1">Та Ха, 20:114</div>
    </div>
  </div>`;
  app.innerHTML = html;
}

  `;

      <div class="card p-4 mb-3">
        <div class="flex items-center gap-3 mb-3">
          <div class="text-2xl">${s.icon || '📚'}</div>
          <div class="flex-1">
            <div class="font-semibold">${s.title}</div>
            <div class="text-xs tg-hint">${s.subsections.length} подразделов</div>
          </div>
          <button data-edit-section="${si}" class="p-2 tg-hint">✏️</button>

    s.subsections.forEach((ss, ssi) => {
      html += `
        <div class="tg-secondary rounded-xl p-3 mb-2">
          <div class="flex items-center gap-2 mb-2">
            <div class="flex-1 font-medium text-sm">${ss.title}</div>
            <button data-edit-sub="${si}-${ssi}" class="text-xs tg-hint">✏️</button>
            <button data-del-sub="${si}-${ssi}" class="text-xs text-red-400">🗑️</button>
          </div>
          <div class="text-xs tg-hint mb-2">${ss.lessons.length} уроков · ${ss.books.length} книг</div>
          <div class="flex gap-2">
            <button data-add-lesson="${si}-${ssi}" class="flex-1 py-1.5 rounded-lg bg-green-600/20 text-green-400 text-xs font-medium">+ Урок</button>
            <button data-add-book="${si}-${ssi}" class="flex-1 py-1.5 rounded-lg bg-yellow-600/20 text-yellow-400 text-xs font-medium">+ Книга</button>
          </div>
          ${ss.lessons.map((l, li) => `
            <div class="flex items-center gap-2 mt-2 p-2 bg-black/20 rounded-lg">
              <span class="text-xs">🎧</span>
              <span class="flex-1 text-xs truncate">${l.title}</span>
              <button data-edit-lesson="${si}-${ssi}-${li}" class="text-xs tg-hint">✏️</button>
              <button data-del-lesson="${si}-${ssi}-${li}" class="text-xs text-red-400">✕</button>
            </div>
          `).join('')}
          ${ss.books.map((b, bi) => `
            <div class="flex items-center gap-2 mt-2 p-2 bg-black/20 rounded-lg">
              <span class="text-xs">📕</span>
              <span class="flex-1 text-xs truncate">${b.title}</span>
              <button data-edit-book="${si}-${ssi}-${bi}" class="text-xs tg-hint">✏️</button>
              <button data-del-book="${si}-${ssi}-${bi}" class="text-xs text-red-400">✕</button>

      </div>

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'islamic_app_backup.json'; a.click();

  document.getElementById('importBtn').onclick = () => {

      r.onload = (ev) => {
        try {
          const d = JSON.parse(ev.target.result);

          if (d.progress) state.progress = d.progress;

  });

  });

    const [si, ssi, li] = b.dataset.delLesson.split('-').map(Number);

    b.onclick = () => showBookModal(si, ssi);
  });
  app.querySelectorAll('[data-edit-book]').forEach(b => {
    const [si, ssi, bi] = b.dataset.editBook.split('-').map(Number);
    b.onclick = () => showBookModal(si, ssi, bi);
  });
  app.querySelectorAll('[data-del-book]').forEach(b => {
    const [si, ssi, bi] = b.dataset.delBook.split('-').map(Number);
    b.onclick = () => { state.sections[si].subsections[ssi].books.splice(bi, 1); saveData(); render(); };
  });
}

// ============ MODALS ============
function showModal(content) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="modal-content">${content}</div>`;
  document.body.appendChild(m);
  m.onclick = (e) => { if (e.target === m) m.remove(); };
  return m;
}

function showSectionModal(idx) {
  const editing = idx !== undefined;
  const s = editing ? state.sections[idx] : { title: '', icon: '📚' };
  const m = showModal(`
    <h2 class="text-xl font-bold mb-4">${editing ? 'Редактировать' : 'Новый'} раздел</h2>
    <label class="text-sm tg-hint">Название</label>
    <input id="mTitle" value="${s.title}" class="mb-3">
    <label class="text-sm tg-hint">Иконка (эмодзи)</label>
    <input id="mIcon" value="${s.icon || '📚'}" class="mb-4" maxlength="4">
    <div class="flex gap-2">
      <button id="mCancel" class="flex-1 py-3 rounded-xl tg-secondary">Отмена</button>
      <button id="mSave" class="flex-1 py-3 rounded-xl tg-btn">Сохранить</button>
    </div>
  `);
  m.querySelector('#mCancel').onclick = () => m.remove();
  m.querySelector('#mSave').onclick = () => {
    const title = m.querySelector('#mTitle').value.trim();
    const icon = m.querySelector('#mIcon').value.trim() || '📚';
    if (!title) return alert('Введите название');
    if (editing) { state.sections[idx].title = title; state.sections[idx].icon = icon; }
    else state.sections.push({ id: uid(), title, icon, subsections: [] });
    saveData(); m.remove(); render();
  };
}

function showSubsectionModal(si, ssi) {
  const editing = ssi !== undefined;
  const ss = editing ? state.sections[si].subsections[ssi] : { title: '' };
  const m = showModal(`
    <h2 class="text-xl font-bold mb-4">${editing ? 'Редактировать' : 'Новый'} подраздел</h2>
    <label class="text-sm tg-hint">Название</label>
    <input id="mTitle" value="${ss.title}" class="mb-4">
    <div class="flex gap-2">
      <button id="mCancel" class="flex-1 py-3 rounded-xl tg-secondary">Отмена</button>
      <button id="mSave" class="flex-1 py-3 rounded-xl tg-btn">Сохранить</button>
    </div>
  `);
  m.querySelector('#mCancel').onclick = () => m.remove();
  m.querySelector('#mSave').onclick = () => {
    const title = m.querySelector('#mTitle').value.trim();
    if (!title) return alert('Введите название');
    if (editing) state.sections[si].subsections[ssi].title = title;
    else state.sections[si].subsections.push({ id: uid(), title, lessons: [], books: [] });
    saveData(); m.remove(); render();
  };
}

function showLessonModal(si, ssi, li) {
  const editing = li !== undefined;
  const l = editing ? state.sections[si].subsections[ssi].lessons[li] : { title: '', audioUrl: '', duration: '' };
  const m = showModal(`
    <h2 class="text-xl font-bold mb-4">${editing ? 'Редактировать' : 'Новый'} урок</h2>
    <label class="text-sm tg-hint">Название</label>
    <input id="mTitle" value="${l.title}" class="mb-3">
    <label class="text-sm tg-hint">Ссылка на аудио (MP3 URL)</label>
    <input id="mUrl" value="${l.audioUrl}" placeholder="https://..." class="mb-3">
    <label class="text-sm tg-hint">Длительность (текст)</label>
    <input id="mDur" value="${l.duration || ''}" placeholder="15 мин" class="mb-4">
    <div class="flex gap-2">
      <button id="mCancel" class="flex-1 py-3 rounded-xl tg-secondary">Отмена</button>
      <button id="mSave" class="flex-1 py-3 rounded-xl tg-btn">Сохранить</button>
    </div>
  `);
  m.querySelector('#mCancel').onclick = () => m.remove();
  m.querySelector('#mSave').onclick = () => {
    const title = m.querySelector('#mTitle').value.trim();
    const audioUrl = m.querySelector('#mUrl').value.trim();
    const duration = m.querySelector('#mDur').value.trim();
    if (!title || !audioUrl) return alert('Заполните название и ссылку');
    const data = { title, audioUrl, duration };
    if (editing) Object.assign(state.sections[si].subsections[ssi].lessons[li], data);
    else state.sections[si].subsections[ssi].lessons.push({ id: uid(), ...data });
    saveData(); m.remove(); render();
  };
}

function showBookModal(si, ssi, bi) {
  const editing = bi !== undefined;
  const b = editing ? state.sections[si].subsections[ssi].books[bi] : { title: '', pdfUrl: '' };
  const m = showModal(`
    <h2 class="text-xl font-bold mb-4">${editing ? 'Редактировать' : 'Новая'} книга</h2>
    <label class="text-sm tg-hint">Название</label>
    <input id="mTitle" value="${b.title}" class="mb-3">
    <label class="text-sm tg-hint">Ссылка на PDF</label>
    <input id="mUrl" value="${b.pdfUrl}" placeholder="https://..." class="mb-4">
    <div class="p-3 tg-secondary rounded-xl text-xs tg-hint mb-4">
      💡 Для GitHub Pages загрузите PDF в репозиторий и укажите относительный путь, например: <code class="text-green-400">books/mybook.pdf</code>
    </div>
    <div class="flex gap-2">
      <button id="mCancel" class="flex-1 py-3 rounded-xl tg-secondary">Отмена</button>
      <button id="mSave" class="flex-1 py-3 rounded-xl tg-btn">Сохранить</button>
    </div>
  `);
  m.querySelector('#mCancel').onclick = () => m.remove();
  m.querySelector('#mSave').onclick = () => {
    const title = m.querySelector('#mTitle').value.trim();
    const pdfUrl = m.querySelector('#mUrl').value.trim();
    if (!title || !pdfUrl) return alert('Заполните все поля');
    if (editing) { state.sections[si].subsections[ssi].books[bi].title = title; state.sections[si].subsections[ssi].books[bi].pdfUrl = pdfUrl; }
    else state.sections[si].subsections[ssi].books.push({ id: uid(), title, pdfUrl });
    saveData(); m.remove(); render();
  };
}
