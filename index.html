<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Исламские уроки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg-color: var(--tg-theme-bg-color, #ffffff);
  --text-color: var(--tg-theme-text-color, #000000);
  --hint-color: var(--tg-theme-hint-color, #707579);
  --link-color: var(--tg-theme-link-color, #2481cc);
  --button-color: var(--tg-theme-button-color, #2481cc);
  --button-text-color: var(--tg-theme-button-text-color, #ffffff);
  --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
  --radius-card: 12px;
  --radius-btn: 8px;
  --spacing: 16px;
  --spacing-sm: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg-color);
  color: var(--text-color);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
  min-height: 100vh;
}

body { padding-bottom: 80px; }

/* Header */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-color);
  padding: var(--spacing);
  border-bottom: 1px solid var(--secondary-bg-color);
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 56px;
}
.app-header h1 {
  font-size: 18px;
  font-weight: 600;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-color);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}
.icon-btn:active { background: var(--secondary-bg-color); }
.icon-btn svg { width: 24px; height: 24px; }

/* Breadcrumbs */
.breadcrumbs {
  padding: 8px var(--spacing);
  font-size: 13px;
  color: var(--hint-color);
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
}
.breadcrumbs a {
  color: var(--link-color);
  text-decoration: none;
}
.breadcrumbs span { color: var(--hint-color); }

/* Main content */
main { padding: var(--spacing); }

/* Cards */
.card {
  background: var(--bg-color);
  border-radius: var(--radius-card);
  padding: var(--spacing-sm);
  margin-bottom: var(--spacing-sm);
  border: 1px solid var(--secondary-bg-color);
  cursor: pointer;
  transition: transform 0.1s;
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
}
.card:active { transform: scale(0.98); }
.card-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: var(--secondary-bg-color);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--link-color);
}
.card-icon svg { width: 24px; height: 24px; }
.card-content { flex: 1; min-width: 0; }
.card-title {
  font-size: 15px;
  font-weight: 500;
  margin-bottom: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-subtitle {
  font-size: 13px;
  color: var(--hint-color);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-arrow {
  color: var(--hint-color);
  flex-shrink: 0;
}

/* Favorite button */
.fav-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  color: var(--hint-color);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}
.fav-btn.active { color: #e53935; }
.fav-btn svg { width: 20px; height: 20px; }

/* Section header */
.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--hint-color);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: var(--spacing) 0 8px 4px;
}

/* Audio player */
.player-container {
  padding: var(--spacing);
  text-align: center;
}
.player-cover {
  width: 200px;
  height: 200px;
  border-radius: 20px;
  background: var(--secondary-bg-color);
  margin: 20px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--link-color);
}
.player-cover svg { width: 64px; height: 64px; }
.player-title {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 4px;
}
.player-subtitle {
  font-size: 14px;
  color: var(--hint-color);
  margin-bottom: 24px;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--secondary-bg-color);
  border-radius: 2px;
  cursor: pointer;
  margin-bottom: 8px;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: var(--button-color);
  border-radius: 2px;
  width: 0%;
  transition: width 0.1s linear;
}
.progress-times {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--hint-color);
  margin-bottom: 24px;
}
.player-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  margin-bottom: 24px;
}
.ctrl-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-color);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ctrl-btn svg { width: 28px; height: 28px; }
.play-btn {
  width: 64px;
  height: 64px;
  background: var(--button-color);
  color: var(--button-text-color);
}
.play-btn svg { width: 32px; height: 32px; }
.speed-btn {
  padding: 6px 12px;
  border-radius: 16px;
  border: 1px solid var(--secondary-bg-color);
  background: transparent;
  color: var(--text-color);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}

/* Resume dialog */
.dialog-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: var(--spacing);
}
.dialog {
  background: var(--bg-color);
  border-radius: var(--radius-card);
  padding: 20px;
  max-width: 320px;
  width: 100%;
  text-align: center;
}
.dialog h3 { margin-bottom: 8px; font-size: 17px; }
.dialog p { font-size: 14px; color: var(--hint-color); margin-bottom: 16px; }
.dialog-actions { display: flex; gap: 8px; }
.dialog-actions button {
  flex: 1;
  padding: 10px;
  border-radius: var(--radius-btn);
  border: none;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
}
.btn-primary { background: var(--button-color); color: var(--button-text-color); }
.btn-secondary { background: var(--secondary-bg-color); color: var(--text-color); }

/* PDF Reader */
.reader-container {
  background: var(--secondary-bg-color);
  min-height: calc(100vh - 56px);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px;
}
.reader-canvas-wrap {
  width: 100%;
  max-width: 800px;
  overflow: auto;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.reader-canvas-wrap canvas { display: block; width: 100%; height: auto; }
.reader-toolbar {
  position: sticky;
  bottom: 0;
  background: var(--bg-color);
  border-top: 1px solid var(--secondary-bg-color);
  padding: 8px var(--spacing);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  max-width: 800px;
}
.page-input {
  width: 60px;
  padding: 6px;
  border: 1px solid var(--secondary-bg-color);
  border-radius: var(--radius-btn);
  background: var(--bg-color);
  color: var(--text-color);
  text-align: center;
  font-size: 14px;
}

/* Search */
.search-input-wrap {
  padding: var(--spacing);
  position: sticky;
  top: 56px;
  background: var(--bg-color);
  z-index: 50;
}
.search-input {
  width: 100%;
  padding: 10px 12px 10px 40px;
  border-radius: var(--radius-btn);
  border: none;
  background: var(--secondary-bg-color);
  color: var(--text-color);
  font-size: 15px;
  outline: none;
}
.search-input-wrap svg {
  position: absolute;
  left: 28px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  color: var(--hint-color);
}

/* Profile */
.profile-header {
  text-align: center;
  padding: 24px var(--spacing);
}
.profile-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--secondary-bg-color);
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--link-color);
  overflow: hidden;
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-avatar svg { width: 40px; height: 40px; }
.profile-name { font-size: 20px; font-weight: 600; }
.profile-username { font-size: 14px; color: var(--hint-color); }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 0 var(--spacing);
  margin-bottom: var(--spacing);
}
.stat-card {
  background: var(--secondary-bg-color);
  border-radius: var(--radius-card);
  padding: 12px 8px;
  text-align: center;
}
.stat-value { font-size: 20px; font-weight: 600; color: var(--link-color); }
.stat-label { font-size: 11px; color: var(--hint-color); margin-top: 2px; }

.settings-list { padding: 0 var(--spacing); }
.setting-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--secondary-bg-color);
}
.setting-label { font-size: 15px; }
.setting-control select, .setting-control input {
  padding: 6px 10px;
  border-radius: var(--radius-btn);
  border: 1px solid var(--secondary-bg-color);
  background: var(--bg-color);
  color: var(--text-color);
  font-size: 14px;
}

/* Bottom nav */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-color);
  border-top: 1px solid var(--secondary-bg-color);
  display: flex;
  justify-content: space-around;
  padding: 8px 0 max(8px, env(safe-area-inset-bottom));
  z-index: 90;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px;
  background: none;
  border: none;
  color: var(--hint-color);
  cursor: pointer;
  font-size: 11px;
}
.nav-item.active { color: var(--link-color); }
.nav-item svg { width: 24px; height: 24px; }

/* Mini player */
.mini-player {
  position: fixed;
  bottom: 60px;
  left: 0;
  right: 0;
  background: var(--bg-color);
  border-top: 1px solid var(--secondary-bg-color);
  padding: 8px var(--spacing);
  display: none;
  align-items: center;
  gap: 12px;
  z-index: 80;
  cursor: pointer;
}
.mini-player.visible { display: flex; }
.mini-player-info { flex: 1; min-width: 0; }
.mini-player-title {
  font-size: 14px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mini-player-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--button-color);
  color: var(--button-text-color);
  display: flex;
  align-items: center;
  justify-content: center;
}
.mini-player-btn svg { width: 18px; height: 18px; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px var(--spacing);
  color: var(--hint-color);
}
.empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }
.empty-state p { font-size: 15px; }

/* Admin */
.admin-login {
  padding: 40px var(--spacing);
  text-align: center;
}
.admin-login input {
  width: 100%;
  padding: 12px;
  border-radius: var(--radius-btn);
  border: 1px solid var(--secondary-bg-color);
  background: var(--bg-color);
  color: var(--text-color);
  font-size: 15px;
  margin-bottom: 12px;
}
.admin-tabs {
  display: flex;
  border-bottom: 1px solid var(--secondary-bg-color);
  overflow-x: auto;
}
.admin-tab {
  flex: 1;
  padding: 12px;
  background: none;
  border: none;
  color: var(--hint-color);
  font-size: 14px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.admin-tab.active { color: var(--link-color); border-bottom-color: var(--link-color); }
.admin-form {
  padding: var(--spacing);
}
.form-group { margin-bottom: 12px; }
.form-group label {
  display: block;
  font-size: 13px;
  color: var(--hint-color);
  margin-bottom: 4px;
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%;
  padding: 10px;
  border-radius: var(--radius-btn);
  border: 1px solid var(--secondary-bg-color);
  background: var(--bg-color);
  color: var(--text-color);
  font-size: 14px;
  font-family: inherit;
}
.form-group textarea { min-height: 80px; resize: vertical; }
.admin-actions {
  display: flex;
  gap: 8px;
  padding: var(--spacing);
}
.admin-actions button {
  flex: 1;
  padding: 10px;
  border-radius: var(--radius-btn);
  border: none;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.json-output {
  margin: var(--spacing);
  padding: 12px;
  background: var(--secondary-bg-color);
  border-radius: var(--radius-card);
  font-family: monospace;
  font-size: 12px;
  max-height: 300px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-all;
}

/* Dark mode for reader */
.reader-dark .reader-canvas-wrap {
  filter: invert(1) hue-rotate(180deg);
  background: #1a1a1a;
}

/* Animations */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.view { animation: fadeIn 0.2s ease; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--hint-color); border-radius: 2px; }
</style>
</head>
<body>

<div id="app"></div>

<!-- Мини-плеер -->
<div class="mini-player" id="miniPlayer" onclick="App.goToCurrentLesson()">
  <div class="mini-player-info">
    <div class="mini-player-title" id="miniPlayerTitle"></div>
  </div>
  <button class="mini-player-btn" id="miniPlayerBtn" onclick="event.stopPropagation(); App.toggleMiniPlayer()"></button>
</div>

<!-- Нижняя навигация -->
<nav class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-route="home" onclick="App.navigate('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Главная</span>
  </button>
  <button class="nav-item" data-route="search" onclick="App.navigate('search')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>Поиск</span>
  </button>
  <button class="nav-item" data-route="favorites" onclick="App.navigate('favorites')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <span>Избранное</span>
  </button>
  <button class="nav-item" data-route="profile" onclick="App.navigate('profile')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>Профиль</span>
  </button>
</nav>

<script>
/* ═══════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════ */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

/* ═══════════════════════════════════════════════════════════
   ХРАНИЛИЩЕ ДАННЫХ
═══════════════════════════════════════════════════════════ */
const Storage = {
  get(key, def = null) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : def;
    } catch { return def; }
  },
  set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  },
  remove(key) {
    try { localStorage.removeItem(key); } catch {}
  }
};

/* ═══════════════════════════════════════════════════════════
   ДАННЫЕ ПРИЛОЖЕНИЯ
═══════════════════════════════════════════════════════════ */
const Data = {
  sections: [],
  lessons: [],
  books: [],

  async load() {
    // Пытаемся загрузить из localStorage (админские изменения)
    const saved = Storage.get('app_data');
    if (saved) {
      this.sections = saved.sections || [];
      this.lessons = saved.lessons || [];
      this.books = saved.books || [];
    } else {
      this.sections = [...DemoData.sections];
      this.lessons = [...DemoData.lessons];
      this.books = [...DemoData.books];
    }
  },

  save() {
    Storage.set('app_data', {
      sections: this.sections,
      lessons: this.lessons,
      books: this.books
    });
  },

  getSection(id) { return this.sections.find(s => s.id === id); },
  getLesson(id) { return this.lessons.find(l => l.id === id); },
  getBook(id) { return this.books.find(b => b.id === id); },

  getChildren(parentId) {
    return this.sections.filter(s => s.parentId === parentId).sort((a,b) => a.order - b.order);
  },

  getSectionLessons(sectionId) {
    return this.lessons.filter(l => l.sectionId === sectionId);
  },

  getSectionBooks(sectionId) {
    return this.books.filter(b => b.sectionId === sectionId);
  },

  getBreadcrumbs(sectionId) {
    const crumbs = [];
    let current = this.getSection(sectionId);
    while (current) {
      crumbs.unshift(current);
      current = current.parentId ? this.getSection(current.parentId) : null;
    }
    return crumbs;
  },

  getAllItems() {
    return [
      ...this.sections.map(s => ({...s, _type: 'section'})),
      ...this.lessons.map(l => ({...l, _type: 'lesson'})),
      ...this.books.map(b => ({...b, _type: 'book'}))
    ];
  }
};

const Favorites = {
  get() { return Storage.get('favorites', []); },
  has(id) { return this.get().includes(id); },
  toggle(id) {
    const favs = this.get();
    const idx = favs.indexOf(id);
    if (idx >= 0) favs.splice(idx, 1);
    else favs.push(id);
    Storage.set('favorites', favs);
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    return idx < 0;
  },
  getAll() {
    const ids = this.get();
    return Data.getAllItems().filter(i => ids.includes(i.id));
  }
};

/* ═══════════════════════════════════════════════════════════
   АУДИО ПЛЕЕР
═══════════════════════════════════════════════════════════ */
const AudioPlayer = {
  audio: null,
  currentLesson: null,
  speeds: [0.75, 1, 1.25, 1.5, 2],
  speedIdx: 1,
  updateInterval: null,

  init() {
    this.audio = new Audio();
    this.audio.addEventListener('timeupdate', () => this.onTimeUpdate());
    this.audio.addEventListener('ended', () => this.onEnded());
    this.audio.addEventListener('loadedmetadata', () => this.onLoaded());
  },

  load(lesson) {
    this.currentLesson = lesson;
    if (lesson.audioUrl) {
      this.audio.src = lesson.audioUrl;
    } else {
      // Демо: нет реального аудио
      this.audio.src = '';
    }
    const progress = Storage.get(`lesson_${lesson.id}_progress`);
    if (progress && progress > 5) {
      this.showResumeDialog(progress, lesson.duration);
    }
    this.updateMiniPlayer();
  },

  showResumeDialog(progress, duration) {
    const timeStr = this.formatTime(progress);
    const overlay = document.createElement('div');
    overlay.className = 'dialog-overlay';
    overlay.innerHTML = `
      <div class="dialog">
        <h3>Продолжить прослушивание?</h3>
        <p>Вы остановились на ${timeStr}</p>
        <div class="dialog-actions">
          <button class="btn-secondary" onclick="this.closest('.dialog-overlay').remove()">Сначала</button>
          <button class="btn-primary" onclick="App.resumeFromProgress(${progress}); this.closest('.dialog-overlay').remove()">Продолжить</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
  },

  play() {
    if (!this.audio.src) return;
    this.audio.play().catch(() => {});
    this.startTracking();
  },

  pause() {
    this.audio.pause();
    this.stopTracking();
  },

  toggle() {
    if (this.audio.paused) this.play();
    else this.pause();
    this.updateUI();
  },

  seek(time) {
    if (this.audio.duration) {
      this.audio.currentTime = Math.max(0, Math.min(time, this.audio.duration));
    }
  },

  skip(seconds) {
    this.seek(this.audio.currentTime + seconds);
  },

  changeSpeed() {
    this.speedIdx = (this.speedIdx + 1) % this.speeds.length;
    this.audio.playbackRate = this.speeds[this.speedIdx];
    this.updateUI();
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  },

  startTracking() {
    this.stopTracking();
    this.updateInterval = setInterval(() => this.saveProgress(), 3000);
  },

  stopTracking() {
    if (this.updateInterval) {
      clearInterval(this.updateInterval);
      this.updateInterval = null;
    }
    this.saveProgress();
  },

  saveProgress() {
    if (this.currentLesson && this.audio.currentTime > 0) {
      Storage.set(`lesson_${this.currentLesson.id}_progress`, this.audio.currentTime);
      // Статистика
      const stats = Storage.get('stats', { lessonsListened: 0, pagesRead: 0, timeSpent: 0 });
      stats.timeSpent = (stats.timeSpent || 0) + 3;
      Storage.set('stats', stats);
    }
  },

  onTimeUpdate() {
    this.updateUI();
  },

  onLoaded() {
    const progress = Storage.get(`lesson_${this.currentLesson?.id}_progress`);
    if (progress && this.audio.duration) {
      // Не устанавливаем автоматически, ждём выбора пользователя
    }
    this.updateUI();
  },

  onEnded() {
    this.stopTracking();
    if (this.currentLesson) {
      const listened = Storage.get('listened_lessons', []);
      if (!listened.includes(this.currentLesson.id)) {
        listened.push(this.currentLesson.id);
        Storage.set('listened_lessons', listened);
        const stats = Storage.get('stats', { lessonsListened: 0, pagesRead: 0, timeSpent: 0 });
        stats.lessonsListened = listened.length;
        Storage.set('stats', stats);
      }
    }
    this.updateUI();
  },

  setProgress(time, duration) {
    if (this.audio.src && duration) {
      this.audio.currentTime = time;
    }
  },

  formatTime(sec) {
    if (!sec || isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  },

  updateUI() {
    const fill = document.getElementById('progressFill');
    const cur = document.getElementById('currentTime');
    const dur = document.getElementById('totalTime');
    const playBtn = document.getElementById('playBtn');
    const speedBtn = document.getElementById('speedBtn');

    if (fill && this.audio.duration) {
      fill.style.width = (this.audio.currentTime / this.audio.duration * 100) + '%';
    }
    if (cur) cur.textContent = this.formatTime(this.audio.currentTime);
    if (dur) dur.textContent = this.formatTime(this.audio.duration || this.currentLesson?.duration || 0);
    if (playBtn) playBtn.innerHTML = this.audio.paused ? Icons.play : Icons.pause;
    if (speedBtn) speedBtn.textContent = this.speeds[this.speedIdx] + 'x';
  },

  updateMiniPlayer() {
    const mp = document.getElementById('miniPlayer');
    const title = document.getElementById('miniPlayerTitle');
    const btn = document.getElementById('miniPlayerBtn');
    if (this.currentLesson) {
      mp.classList.add('visible');
      title.textContent = this.currentLesson.title;
      btn.innerHTML = this.audio.paused ? Icons.play : Icons.pause;
    } else {
      mp.classList.remove('visible');
    }
  },

  isPlaying() { return this.audio && !this.audio.paused; }
};

/* ═══════════════════════════════════════════════════════════
   PDF ЧИТАЛКА
═══════════════════════════════════════════════════════════ */
const Reader = {
  pdf: null,
  currentPage: 1,
  totalPages: 0,
  scale: 1.2,
  currentBook: null,
  darkMode: false,

  async load(book) {
    this.currentBook = book;
    this.currentPage = Storage.get(`book_${book.id}_page`, 1);
    this.totalPages = book.pages || 1;

    if (book.pdfUrl && window.pdfjsLib) {
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        this.pdf = await pdfjsLib.getDocument(book.pdfUrl).promise;
        this.totalPages = this.pdf.numPages;
        if (this.currentPage > this.totalPages) this.currentPage = 1;
      } catch (e) {
        console.error('PDF load error:', e);
        this.pdf = null;
      }
    }
    this.renderPage();
  },

  async renderPage() {
    const canvas = document.getElementById('readerCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    if (this.pdf) {
      try {
        const page = await this.pdf.getPage(this.currentPage);
        const viewport = page.getViewport({ scale: this.scale * window.devicePixelRatio });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        canvas.style.width = (viewport.width / window.devicePixelRatio) + 'px';
        await page.render({ canvasContext: ctx, viewport }).promise;
      } catch (e) {
        console.error('Render error:', e);
      }
    } else {
      // Демо-режим: показываем заглушку
      canvas.width = 400;
      canvas.height = 600;
      canvas.style.width = '100%';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#333';
      ctx.font = '20px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(this.currentBook?.title || 'Книга', canvas.width/2, 100);
      ctx.font = '14px system-ui';
      ctx.fillStyle = '#666';
      ctx.fillText(`Страница ${this.currentPage} из ${this.totalPages}`, canvas.width/2, 140);
      ctx.fillText('(Демо-режим: PDF не загружен)', canvas.width/2, 180);
      // Имитация текста
      ctx.fillStyle = '#999';
      for (let i = 0; i < 20; i++) {
        const y = 220 + i * 18;
        const w = 200 + Math.random() * 150;
        ctx.fillRect((canvas.width - w)/2, y, w, 2);
      }
    }

    this.updateToolbar();
    Storage.set(`book_${this.currentBook.id}_page`, this.currentPage);
  },

  goToPage(page) {
    page = parseInt(page);
    if (page < 1) page = 1;
    if (page > this.totalPages) page = this.totalPages;
    this.currentPage = page;
    this.renderPage();
    // Статистика
    const stats = Storage.get('stats', { lessonsListened: 0, pagesRead: 0, timeSpent: 0 });
    stats.pagesRead = Math.max(stats.pagesRead || 0, this.currentPage);
    Storage.set('stats', stats);
  },

  nextPage() { this.goToPage(this.currentPage + 1); },
  prevPage() { this.goToPage(this.currentPage - 1); },

  zoomIn() { this.scale = Math.min(3, this.scale + 0.2); this.renderPage(); },
  zoomOut() { this.scale = Math.max(0.5, this.scale - 0.2); this.renderPage(); },

  toggleDark() {
    this.darkMode = !this.darkMode;
    const wrap = document.querySelector('.reader-container');
    if (wrap) wrap.classList.toggle('reader-dark', this.darkMode);
    const btn = document.getElementById('darkModeBtn');
    if (btn) btn.innerHTML = this.darkMode ? Icons.sun : Icons.moon;
  },

  toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  },

  updateToolbar() {
    const pageInput = document.getElementById('pageInput');
    const pageTotal = document.getElementById('pageTotal');
    if (pageInput) pageInput.value = this.currentPage;
    if (pageTotal) pageTotal.textContent = `/ ${this.totalPages}`;
  }
};

   ГЛАВНЫЙ МОДУЛЬ ПРИЛОЖЕНИЯ

const App = {
  currentRoute: 'home',
  currentSectionId: null,
  debounceTimer: null,

  async init() {
    await Data.load();
    AudioPlayer.init();
    this.handleRoute();
    window.addEventListener('hashchange', () => this.handleRoute());
    // Telegram тема
    if (tg) {
      tg.onEvent('themeChanged', () => this.applyTheme());
    }
  },

  applyTheme() {
    // Telegram автоматически обновляет CSS переменные
  },

  navigate(route, params = {}) {
    let hash = '#' + route;
    if (params.id) hash += '/' + params.id;
    if (params.sub) hash += '/' + params.sub;
    window.location.hash = hash;
  },

  handleRoute() {
    const hash = window.location.hash.slice(1) || 'home';
    const parts = hash.split('/');
    const route = parts[0];
    const id = parts[1];
    const sub = parts[2];

    this.currentRoute = route;
    this.updateNav(route);

    // Скрываем нижнюю навигацию для плеера и читалки
    const hideNav = ['player', 'reader', 'admin'].includes(route);
    document.getElementById('bottomNav').style.display = hideNav ? 'none' : 'flex';

    const app = document.getElementById('app');

    switch (route) {
      case 'home': this.renderHome(app); break;
      case 'section': this.renderSection(app, id); break;
      case 'player': this.renderPlayer(app, id); break;
      case 'reader': this.renderReader(app, id); break;
      case 'search': this.renderSearch(app); break;
      case 'favorites': this.renderFavorites(app); break;
      case 'profile': this.renderProfile(app); break;
      case 'admin': this.renderAdmin(app); break;
      default: this.renderHome(app);
    }

    window.scrollTo(0, 0);
  },

  updateNav(route) {
    document.querySelectorAll('.nav-item').forEach(item => {
      item.classList.toggle('active', item.dataset.route === route);
    });
  },

  /* ═══════════════════════════════════════════════════════
     ГЛАВНАЯ СТРАНИЦА
  ═══════════════════════════════════════════════════════ */
  renderHome(app) {
    const roots = Data.getChildren(null);
    let html = `
      <header class="app-header">
        <h1>Исламские уроки</h1>
        <button class="icon-btn" onclick="App.navigate('admin')" aria-label="Админ">
          ${Icons.settings}
        </button>
      </header>
      <main>
    `;

    if (roots.length === 0) {
      html += `<div class="empty-state">${Icons.book}<p>Нет разделов. Добавьте через админ-панель.</p></div>`;
    } else {
      html += `<div class="section-title">Разделы</div>`;
      roots.forEach(s => {
        html += this.renderSectionCard(s);
      });
    }

    html += '</main>';
    app.innerHTML = html;
  },

  renderSectionCard(section) {
    const children = Data.getChildren(section.id);
    const lessons = Data.getSectionLessons(section.id);
    const books = Data.getSectionBooks(section.id);
    const count = children.length + lessons.length + books.length;
    const subtitle = count > 0 ? `${count} элемент${count === 1 ? '' : count < 5 ? 'а' : 'ов'}` : 'Пусто';

    return `
      <article class="card" onclick="App.navigate('section', {id: '${section.id}'})" role="button" tabindex="0">
        <div class="card-icon">${Icons[section.icon] || Icons.folder}</div>
        <div class="card-content">
          <div class="card-title">${section.title}</div>
          <div class="card-subtitle">${section.description || subtitle}</div>
        </div>
        <div class="card-arrow">${Icons.arrowRight}</div>
      </article>
    `;
  },

  /* ═══════════════════════════════════════════════════════
     СТРАНИЦА РАЗДЕЛА
  ═══════════════════════════════════════════════════════ */
  renderSection(app, sectionId) {
    const section = Data.getSection(sectionId);
    if (!section) { this.renderHome(app); return; }

    const crumbs = Data.getBreadcrumbs(sectionId);
    const children = Data.getChildren(sectionId);
    const lessons = Data.getSectionLessons(sectionId);
    const books = Data.getSectionBooks(sectionId);

    let html = `
      <header class="app-header">
        <button class="icon-btn" onclick="history.back()" aria-label="Назад">${Icons.arrowLeft}</button>
        <h1>${section.title}</h1>
      </header>
      <nav class="breadcrumbs" aria-label="Навигация">
        <a href="#home">Главная</a>
    `;
    crumbs.forEach((c, i) => {
      html += `<span> › </span>`;
      if (i < crumbs.length - 1) {
        html += `<a href="#section/${c.id}">${c.title}</a>`;
      } else {
        html += `<span>${c.title}</span>`;
      }
    });
    html += '</nav><main>';

    if (children.length > 0) {
      html += `<div class="section-title">Подразделы</div>`;
      children.forEach(s => { html += this.renderSectionCard(s); });
    }

    if (lessons.length > 0) {
      html += `<div class="section-title">Уроки</div>`;
      lessons.forEach(l => { html += this.renderLessonCard(l); });
    }

    if (books.length > 0) {
      html += `<div class="section-title">Книги</div>`;
      books.forEach(b => { html += this.renderBookCard(b); });
    }

    if (children.length === 0 && lessons.length === 0 && books.length === 0) {
      html += `<div class="empty-state">${Icons.folder}<p>Этот раздел пуст</p></div>`;
    }

    html += '</main>';
    app.innerHTML = html;
  },

  renderLessonCard(lesson) {
    const isFav = Favorites.has(lesson.id);
    const progress = Storage.get(`lesson_${lesson.id}_progress`);
    const progressPct = progress && lesson.duration ? Math.min(100, (progress / lesson.duration) * 100) : 0;

    return `
      <article class="card" onclick="App.navigate('player', {id: '${lesson.id}'})" role="button" tabindex="0">
        <div class="card-icon">${Icons.headphones}</div>
        <div class="card-content">
          <div class="card-title">${lesson.title}</div>
          <div class="card-subtitle">${lesson.description || AudioPlayer.formatTime(lesson.duration)}</div>
          ${progressPct > 0 ? `<div style="height:2px;background:var(--secondary-bg-color);border-radius:1px;margin-top:4px;"><div style="height:100%;width:${progressPct}%;background:var(--link-color);border-radius:1px;"></div></div>` : ''}
        </div>
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); App.toggleFav('${lesson.id}', this)" aria-label="В избранное">
          ${isFav ? Icons.heartFill : Icons.heart}
        </button>
      </article>
    `;
  },

  renderBookCard(book) {
    const isFav = Favorites.has(book.id);
    return `
      <article class="card" onclick="App.navigate('reader', {id: '${book.id}'})" role="button" tabindex="0">
        <div class="card-icon">${Icons.book}</div>
        <div class="card-content">
          <div class="card-title">${book.title}</div>
          <div class="card-subtitle">${book.author || ''} · ${book.pages} стр.</div>
        </div>
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); App.toggleFav('${book.id}', this)" aria-label="В избранное">
          ${isFav ? Icons.heartFill : Icons.heart}
        </button>
      </article>
    `;
  },

  toggleFav(id, btn) {
    const added = Favorites.toggle(id);
    btn.classList.toggle('active', added);
    btn.innerHTML = added ? Icons.heartFill : Icons.heart;
  },

  /* ═══════════════════════════════════════════════════════
     АУДИОПЛЕЕР
  ═══════════════════════════════════════════════════════ */
  renderPlayer(app, lessonId) {
    const lesson = Data.getLesson(lessonId);
    if (!lesson) { this.renderHome(app); return; }

    const section = Data.getSection(lesson.sectionId);

    app.innerHTML = `
      <header class="app-header">
        <button class="icon-btn" onclick="history.back()" aria-label="Назад">${Icons.arrowLeft}</button>
        <h1>${lesson.title}</h1>
        <button class="icon-btn" id="playerFavBtn" onclick="App.togglePlayerFav('${lesson.id}')" aria-label="В избранное">
          ${Favorites.has(lesson.id) ? Icons.heartFill : Icons.heart}
        </button>
      </header>
      <main class="player-container">
        <div class="player-cover">${Icons.headphones}</div>
        <div class="player-title">${lesson.title}</div>
        <div class="player-subtitle">${section?.title || ''}</div>
        <div class="progress-bar" id="progressBar" onclick="App.seekAudio(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-times">
          <span id="currentTime">0:00</span>
          <span id="totalTime">${AudioPlayer.formatTime(lesson.duration)}</span>
        </div>
        <div class="player-controls">
          <button class="ctrl-btn" onclick="AudioPlayer.skip(-15)" aria-label="Назад 15 сек">${Icons.rewind}</button>
          <button class="ctrl-btn play-btn" id="playBtn" onclick="AudioPlayer.toggle()" aria-label="Воспроизведение">${Icons.play}</button>
          <button class="ctrl-btn" onclick="AudioPlayer.skip(15)" aria-label="Вперёд 15 сек">${Icons.forward}</button>
        </div>
        <button class="speed-btn" id="speedBtn" onclick="AudioPlayer.changeSpeed()">1x</button>
      </main>
    `;

    AudioPlayer.load(lesson);
    AudioPlayer.updateUI();
    // Обновляем мини-плеер
    AudioPlayer.updateMiniPlayer();
  },

  seekAudio(e) {
    const bar = document.getElementById('progressBar');
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    const duration = AudioPlayer.audio.duration || AudioPlayer.currentLesson?.duration || 0;
    AudioPlayer.seek(pct * duration);
  },

  resumeFromProgress(time) {
    AudioPlayer.setProgress(time);
    AudioPlayer.play();
    AudioPlayer.updateUI();
  },

  togglePlayerFav(id) {
    const added = Favorites.toggle(id);
    const btn = document.getElementById('playerFavBtn');
    if (btn) btn.innerHTML = added ? Icons.heartFill : Icons.heart;
  },

  goToCurrentLesson() {
    if (AudioPlayer.currentLesson) {
      this.navigate('player', { id: AudioPlayer.currentLesson.id });
    }
  },

  toggleMiniPlayer() {
    AudioPlayer.toggle();
    AudioPlayer.updateMiniPlayer();
  },

  /* ═══════════════════════════════════════════════════════
     ПОИСК
  ═══════════════════════════════════════════════════════ */
  renderSearch(app) {
    app.innerHTML = `
      <header class="app-header">
        <h1>Поиск</h1>
      </header>
      <div class="search-input-wrap">
        ${Icons.close.replace('viewBox', 'viewBox').replace('M18 6', 'M11 11').replace('M6 18', 'M11 11').replace('line x1="18"', 'circle cx="11"').replace('line x2="6"', 'r="8"/')}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position:absolute;left:28px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--hint-color);pointer-events:none;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" class="search-input" id="searchInput" placeholder="Поиск уроков, книг, разделов..." autofocus>
      </div>
      <main id="searchResults">
        <div class="empty-state">
          ${Icons.close}
          <p>Введите запрос для поиска</p>
        </div>
      </main>
    `;

    const input = document.getElementById('searchInput');
    input.addEventListener('input', (e) => {
      clearTimeout(this.debounceTimer);
      this.debounceTimer = setTimeout(() => this.performSearch(e.target.value), 300);
    });
    input.focus();
  },

  performSearch(query) {
    const results = document.getElementById('searchResults');
    if (!query.trim()) {
      results.innerHTML = `<div class="empty-state">${Icons.close}<p>Введите запрос для поиска</p></div>`;
      return;
    }

    const q = query.toLowerCase();
    const sections = Data.sections.filter(s => s.title.toLowerCase().includes(q) || (s.description || '').toLowerCase().includes(q));
    const lessons = Data.lessons.filter(l => l.title.toLowerCase().includes(q) || (l.description || '').toLowerCase().includes(q));
    const books = Data.books.filter(b => b.title.toLowerCase().includes(q) || (b.description || '').toLowerCase().includes(q) || (b.author || '').toLowerCase().includes(q));

    let html = '';

    if (sections.length > 0) {
      html += `<div class="section-title">Разделы (${sections.length})</div>`;
      sections.forEach(s => { html += this.renderSectionCard(s); });
    }
    if (lessons.length > 0) {
      html += `<div class="section-title">Уроки (${lessons.length})</div>`;
      lessons.forEach(l => { html += this.renderLessonCard(l); });
    }
    if (books.length > 0) {
      html += `<div class="section-title">Книги (${books.length})</div>`;
      books.forEach(b => { html += this.renderBookCard(b); });
    }

    if (!html) {
      html = `<div class="empty-state">${Icons.close}<p>Ничего не найдено</p></div>`;
    }

    results.innerHTML = html;
  },

  /* ═══════════════════════════════════════════════════════
     ИЗБРАННОЕ
  ═══════════════════════════════════════════════════════ */
  renderFavorites(app) {
    const items = Favorites.getAll();

    app.innerHTML = `
      <header class="app-header">
        <h1>Избранное</h1>
      </header>
      <main id="favoritesList"></main>
    `;

    const list = document.getElementById('favoritesList');
    if (items.length === 0) {
      list.innerHTML = `<div class="empty-state">${Icons.heart}<p>Нет избранных элементов</p></div>`;
      return;
    }

    let html = '';
    items.forEach(item => {
      if (item._type === 'section') html += this.renderSectionCard(item);
      else if (item._type === 'lesson') html += this.renderLessonCard(item);
      else if (item._type === 'book') html += this.renderBookCard(item);
    });
    list.innerHTML = html;
  },

     ПРОФИЛЬ

  renderProfile(app) {

          <div class="stat-card">
            <div class="stat-value">${stats.pagesRead || 0}</div>
            <div class="stat-label">Страниц</div>
          </div>

            <div class="stat-value">${Math.floor((stats.timeSpent || 0) / 60)}</div>
            <div class="stat-label">Минут</div>
          </div>
        </div>

        <div class="settings-list">
          <div class="setting-item">
            <span class="setting-label">Тема</span>
            <div class="setting-control">
              <select onchange="App.setTheme(this.value)">
                <option value="auto" ${theme==='auto'?'selected':''}>Авто</option>
                <option value="light" ${theme==='light'?'selected':''}>Светлая</option>
                <option value="dark" ${theme==='dark'?'selected':''}>Тёмная</option>
              </select>
            </div>
          </div>
          <div class="setting-item">
            <span class="setting-label">Размер шрифта</span>
            <div class="setting-control">
              <select onchange="App.setFontSize(this.value)">
                <option value="14" ${fontSize==14?'selected':''}>Мелкий</option>
                <option value="16" ${fontSize==16?'selected':''}>Обычный</option>
                <option value="18" ${fontSize==18?'selected':''}>Крупный</option>
                <option value="20" ${fontSize==20?'selected':''}>Большой</option>
              </select>
            </div>
          </div>
          <div class="setting-item">
            <span class="setting-label">Сбросить прогресс</span>
            <div class="setting-control">
              <button class="btn-secondary" style="padding:6px 12px;border-radius:var(--radius-btn);border:none;cursor:pointer;color:#e53935;" onclick="App.resetProgress()">Сбросить</button>
            </div>
          </div>
        </div>
      </main>
    `;
  },

  setTheme(theme) {
    Storage.set('theme', theme);
    if (theme === 'dark') {
      document.documentElement.style.colorScheme = 'dark';
    } else if (theme === 'light') {
      document.documentElement.style.colorScheme = 'light';
    } else {
      document.documentElement.style.colorScheme = '';
    }
  },

  setFontSize(size) {
    Storage.set('fontSize', parseInt(size));
    document.body.style.fontSize = size + 'px';
  },

  resetProgress() {
    const doReset = () => {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('lesson_') || key.startsWith('book_') || key === 'stats' || key === 'listened_lessons') {
          keys.push(key);
        }
      }
      keys.forEach(k => localStorage.removeItem(k));
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      this.renderProfile(document.getElementById('app'));
    };

    if (tg?.showConfirm) {
      tg.showConfirm('Сбросить весь прогресс прослушивания и чтения?', (ok) => {
        if (ok) doReset();
      });
    } else if (confirm('Сбросить весь прогресс?')) {
      doReset();
    }
  },

  /* ═══════════════════════════════════════════════════════
     АДМИН-ПАНЕЛЬ
  ═══════════════════════════════════════════════════════ */
  adminAuth: false,
  adminTab: 'sections',
  adminEditing: null,

  renderAdmin(app) {
    if (!this.adminAuth) {
      const savedHash = Storage.get('admin_hash');
      app.innerHTML = `
        <header class="app-header">
          <button class="icon-btn" onclick="history.back()" aria-label="Назад">${Icons.arrowLeft}</button>
          <h1>Админ-панель</h1>
        </header>
        <div class="admin-login">
          <h3 style="margin-bottom:16px;">${savedHash ? 'Введите пароль' : 'Установите пароль'}</h3>
          <input type="password" id="adminPass" placeholder="Пароль" onkeypress="if(event.key==='Enter')App.adminLogin()">
          ${savedHash ? '' : '<input type="password" id="adminPass2" placeholder="Повторите пароль" style="margin-top:8px;">'}
          <button class="btn-primary" style="width:100%;padding:12px;border-radius:var(--radius-btn);border:none;font-size:15px;cursor:pointer;margin-top:12px;" onclick="App.adminLogin()">Войти</button>
          <p style="font-size:12px;color:var(--hint-color);margin-top:12px;">Пароль по умолчанию: admin</p>
        </div>
      `;
      return;
    }

    app.innerHTML = `
      <header class="app-header">
        <button class="icon-btn" onclick="history.back()" aria-label="Назад">${Icons.arrowLeft}</button>
        <h1>Админ-панель</h1>
        <button class="icon-btn" onclick="App.adminLogout()" aria-label="Выход">${Icons.close}</button>
      </header>
      <div class="admin-tabs">
        <button class="admin-tab ${this.adminTab==='sections'?'active':''}" onclick="App.adminSwitchTab('sections')">Разделы</button>
        <button class="admin-tab ${this.adminTab==='lessons'?'active':''}" onclick="App.adminSwitchTab('lessons')">Уроки</button>
        <button class="admin-tab ${this.adminTab==='books'?'active':''}" onclick="App.adminSwitchTab('books')">Книги</button>
        <button class="admin-tab ${this.adminTab==='export'?'active':''}" onclick="App.adminSwitchTab('export')">Экспорт</button>
      </div>
      <div id="adminContent"></div>
    `;

    this.renderAdminContent();
  },

  adminLogin() {
    const pass = document.getElementById('adminPass').value;
    const pass2El = document.getElementById('adminPass2');
    const savedHash = Storage.get('admin_hash');

    if (!savedHash) {
      // Установка пароля
      const pass2 = pass2El?.value;
      if (pass !== pass2) { alert('Пароли не совпадают'); return; }
      if (pass.length < 3) { alert('Минимум 3 символа'); return; }
      Storage.set('admin_hash', this.simpleHash(pass));
      this.adminAuth = true;
      this.renderAdmin(document.getElementById('app'));
    } else {
      if (this.simpleHash(pass) === savedHash) {
        this.adminAuth = true;
        this.renderAdmin(document.getElementById('app'));
      } else {
        alert('Неверный пароль');
      }
    }
  },

  adminLogout() {
    this.adminAuth = false;
    this.adminEditing = null;
    history.back();
  },

  simpleHash(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      hash = ((hash << 5) - hash) + c;
      hash |= 0;
    }
    return hash.toString(36);
  },

  adminSwitchTab(tab) {
    this.adminTab = tab;
    this.adminEditing = null;
    document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    this.renderAdminContent();
  },

  renderAdminContent() {
    const content = document.getElementById('adminContent');
    if (!content) return;

    switch (this.adminTab) {
      case 'sections': this.renderAdminSections(content); break;
      case 'lessons': this.renderAdminLessons(content); break;
      case 'books': this.renderAdminBooks(content); break;
      case 'export': this.renderAdminExport(content); break;
    }
  },

  renderAdminSections(container) {
    if (this.adminEditing) {
      this.renderSectionForm(container);
      return;
    }

    let html = `
      <div class="admin-actions">
        <button class="btn-primary" onclick="App.adminEditSection(null)">${Icons.plus} Добавить раздел</button>
      </div>
    `;

    const renderTree = (parentId, depth = 0) => {
      const children = Data.getChildren(parentId);
      children.forEach(s => {
        html += `
          <div style="padding:8px 16px 8px ${16 + depth * 20}px;border-bottom:1px solid var(--secondary-bg-color);display:flex;align-items:center;gap:8px;">
            <span style="flex:1;font-size:14px;">${'—'.repeat(depth)} ${s.title}</span>
            <button class="icon-btn" style="width:32px;height:32px;" onclick="App.adminEditSection('${s.id}')">${Icons.settings}</button>
            <button class="icon-btn" style="width:32px;height:32px;color:#e53935;" onclick="App.adminDeleteSection('${s.id}')">${Icons.trash}</button>
          </div>
        `;
        renderTree(s.id, depth + 1);
      });
    };
    renderTree(null);

    if (Data.sections.length === 0) {
      html += `<div class="empty-state"><p>Нет разделов</p></div>`;
    }

    container.innerHTML = html;
  },

  renderSectionForm(container) {
    const section = this.adminEditing ? Data.getSection(this.adminEditing) : null;
    const parents = Data.sections.filter(s => s.id !== this.adminEditing);

    container.innerHTML = `
      <div class="admin-form">
        <h3 style="margin-bottom:16px;">${section ? 'Редактировать' : 'Новый'} раздел</h3>
        <div class="form-group">
          <label>ID (латиница)</label>
          <input type="text" id="f_id" value="${section?.id || ''}" ${section ? 'readonly' : ''} placeholder="например: quran">
        </div>
        <div class="form-group">
          <label>Название</label>
          <input type="text" id="f_title" value="${section?.title || ''}" placeholder="Название раздела">
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="f_description" placeholder="Описание раздела">${section?.description || ''}</textarea>
        </div>
        <div class="form-group">
          <label>Родительский раздел</label>
          <select id="f_parentId">
            <option value="">— Корневой —</option>
            ${parents.map(p => `<option value="${p.id}" ${section?.parentId === p.id ? 'selected' : ''}>${p.title}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Иконка</label>
          <select id="f_icon">
            ${Object.keys(Icons).filter(k => ['book','headphones','folder','heart'].includes(k)).map(k =>
              `<option value="${k}" ${section?.icon === k ? 'selected' : ''}>${k}</option>`
            ).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Порядок</label>
          <input type="number" id="f_order" value="${section?.order || 1}" min="1">
        </div>
        <div class="admin-actions" style="padding:0;">
          <button class="btn-secondary" onclick="App.adminEditing=null;App.renderAdminContent()">Отмена</button>
          <button class="btn-primary" onclick="App.adminSaveSection()">Сохранить</button>
        </div>
      </div>
    `;
  },

  adminEditSection(id) {
    this.adminEditing = id || 'new_' + Date.now();
    if (!id) {
      // Создаём временный объект
    }
    this.renderAdminContent();
  },

  adminSaveSection() {
    const id = document.getElementById('f_id').value.trim();
    const title = document.getElementById('f_title').value.trim();
    if (!id || !title) { alert('ID и название обязательны'); return; }

    const data = {
      id,
      title,
      description: document.getElementById('f_description').value.trim(),
      parentId: document.getElementById('f_parentId').value || null,
      icon: document.getElementById('f_icon').value,
      order: parseInt(document.getElementById('f_order').value) || 1
    };

    const idx = Data.sections.findIndex(s => s.id === id);
    if (idx >= 0) Data.sections[idx] = data;
    else Data.sections.push(data);

    Data.save();
    this.adminEditing = null;
    this.renderAdminContent();
  },

  adminDeleteSection(id) {
    if (!confirm('Удалить раздел и все вложенные?')) return;
    // Рекурсивное удаление
    const toDelete = [id];
    const findChildren = (pid) => {
      Data.sections.filter(s => s.parentId === pid).forEach(s => {
        toDelete.push(s.id);
        findChildren(s.id);
      });
    };
    findChildren(id);
    Data.sections = Data.sections.filter(s => !toDelete.includes(s.id));
    Data.lessons = Data.lessons.filter(l => !toDelete.includes(l.sectionId));
    Data.books = Data.books.filter(b => !toDelete.includes(b.sectionId));
    Data.save();
    this.renderAdminContent();
  },

  renderAdminLessons(container) {
    if (this.adminEditing) {
      this.renderLessonForm(container);
      return;
    }

    let html = `
      <div class="admin-actions">
        <button class="btn-primary" onclick="App.adminEditLesson(null)">${Icons.plus} Добавить урок</button>
      </div>
    `;

    Data.lessons.forEach(l => {
      const section = Data.getSection(l.sectionId);
      html += `
        <div style="padding:12px 16px;border-bottom:1px solid var(--secondary-bg-color);display:flex;align-items:center;gap:8px;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${l.title}</div>
            <div style="font-size:12px;color:var(--hint-color);">${section?.title || 'Без раздела'} · ${AudioPlayer.formatTime(l.duration)}</div>
          </div>
          <button class="icon-btn" style="width:32px;height:32px;" onclick="App.adminEditLesson('${l.id}')">${Icons.settings}</button>
          <button class="icon-btn" style="width:32px;height:32px;color:#e53935;" onclick="App.adminDeleteLesson('${l.id}')">${Icons.trash}</button>
        </div>
      `;
    });

    if (Data.lessons.length === 0) {
      html += `<div class="empty-state"><p>Нет уроков</p></div>`;
    }

    container.innerHTML = html;
  },

  renderLessonForm(container) {
    const lesson = this.adminEditing && !this.adminEditing.startsWith('new_') ? Data.getLesson(this.adminEditing) : null;

    container.innerHTML = `
      <div class="admin-form">
        <h3 style="margin-bottom:16px;">${lesson ? 'Редактировать' : 'Новый'} урок</h3>
        <div class="form-group">
          <label>ID</label>
          <input type="text" id="f_id" value="${lesson?.id || 'lesson_' + Date.now()}" ${lesson ? 'readonly' : ''}>
        </div>
        <div class="form-group">
          <label>Название</label>
          <input type="text" id="f_title" value="${lesson?.title || ''}">
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="f_description">${lesson?.description || ''}</textarea>
        </div>
        <div class="form-group">
          <label>Раздел</label>
          <select id="f_sectionId">
            ${Data.sections.map(s => `<option value="${s.id}" ${lesson?.sectionId === s.id ? 'selected' : ''}>${s.title}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>URL аудио</label>
          <input type="text" id="f_audioUrl" value="${lesson?.audioUrl || ''}" placeholder="/media/audio/lesson.mp3">
        </div>
        <div class="form-group">
          <label>Длительность (сек)</label>
          <input type="number" id="f_duration" value="${lesson?.duration || 0}" min="0">
        </div>
        <div class="admin-actions" style="padding:0;">
          <button class="btn-secondary" onclick="App.adminEditing=null;App.renderAdminContent()">Отмена</button>
          <button class="btn-primary" onclick="App.adminSaveLesson()">Сохранить</button>
        </div>
      </div>
    `;
  },

  adminEditLesson(id) {
    this.adminEditing = id || 'new_' + Date.now();
    this.renderAdminContent();
  },

  adminSaveLesson() {
    const id = document.getElementById('f_id').value.trim();
    const title = document.getElementById('f_title').value.trim();
    if (!id || !title) { alert('ID и название обязательны'); return; }

    const data = {
      id,
      title,
      description: document.getElementById('f_description').value.trim(),
      sectionId: document.getElementById('f_sectionId').value,
      audioUrl: document.getElementById('f_audioUrl').value.trim(),
      duration: parseInt(document.getElementById('f_duration').value) || 0
    };

    const idx = Data.lessons.findIndex(l => l.id === id);
    if (idx >= 0) Data.lessons[idx] = data;
    else Data.lessons.push(data);

    Data.save();
    this.adminEditing = null;
    this.renderAdminContent();
  },

  adminDeleteLesson(id) {
    if (!confirm('Удалить урок?')) return;
    Data.lessons = Data.lessons.filter(l => l.id !== id);
    Data.save();
    this.renderAdminContent();
  },

  renderAdminBooks(container) {
    if (this.adminEditing) {
      this.renderBookForm(container);
      return;
    }

    let html = `
      <div class="admin-actions">
        <button class="btn-primary" onclick="App.adminEditBook(null)">${Icons.plus} Добавить книгу</button>
      </div>
    `;

    Data.books.forEach(b => {
      const section = Data.getSection(b.sectionId);
      html += `
        <div style="padding:12px 16px;border-bottom:1px solid var(--secondary-bg-color);display:flex;align-items:center;gap:8px;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${b.title}</div>
            <div style="font-size:12px;color:var(--hint-color);">${section?.title || 'Без раздела'} · ${b.pages} стр.</div>
          </div>
          <button class="icon-btn" style="width:32px;height:32px;" onclick="App.adminEditBook('${b.id}')">${Icons.settings}</button>
          <button class="icon-btn" style="width:32px;height:32px;color:#e53935;" onclick="App.adminDeleteBook('${b.id}')">${Icons.trash}</button>
        </div>
      `;
    });

    if (Data.books.length === 0) {
      html += `<div class="empty-state"><p>Нет книг</p></div>`;
    }

    container.innerHTML = html;
  },

  renderBookForm(container) {
    const book = this.adminEditing && !this.adminEditing.startsWith('new_') ? Data.getBook(this.adminEditing) : null;

    container.innerHTML = `
      <div class="admin-form">
        <h3 style="margin-bottom:16px;">${book ? 'Редактировать' : 'Новая'} книга</h3>
        <div class="form-group">
          <label>ID</label>
          <input type="text" id="f_id" value="${book?.id || 'book_' + Date.now()}" ${book ? 'readonly' : ''}>
        </div>
        <div class="form-group">
          <label>Название</label>
          <input type="text" id="f_title" value="${book?.title || ''}">
        </div>
        <div class="form-group">
          <label>Автор</label>
          <input type="text" id="f_author" value="${book?.author || ''}">
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="f_description">${book?.description || ''}</textarea>
        </div>
        <div class="form-group">
          <label>Раздел</label>
          <select id="f_sectionId">
            ${Data.sections.map(s => `<option value="${s.id}" ${book?.sectionId === s.id ? 'selected' : ''}>${s.title}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>URL PDF</label>
          <input type="text" id="f_pdfUrl" value="${book?.pdfUrl || ''}" placeholder="/media/books/book.pdf">
        </div>
        <div class="form-group">
          <label>Количество страниц</label>
          <input type="number" id="f_pages" value="${book?.pages || 0}" min="0">
        </div>
        <div class="admin-actions" style="padding:0;">
          <button class="btn-secondary" onclick="App.adminEditing=null;App.renderAdminContent()">Отмена</button>
          <button class="btn-primary" onclick="App.adminSaveBook()">Сохранить</button>
        </div>
      </div>
    `;
  },

  adminEditBook(id) {
    this.adminEditing = id || 'new_' + Date.now();
    this.renderAdminContent();
  },

  adminSaveBook() {
    const id = document.getElementById('f_id').value.trim();
    const title = document.getElementById('f_title').value.trim();
    if (!id || !title) { alert('ID и название обязательны'); return; }

    const data = {
      id,
      title,
      author: document.getElementById('f_author').value.trim(),
      description: document.getElementById('f_description').value.trim(),
      sectionId: document.getElementById('f_sectionId').value,
      pdfUrl: document.getElementById('f_pdfUrl').value.trim(),
      pages: parseInt(document.getElementById('f_pages').value) || 0
    };

    const idx = Data.books.findIndex(b => b.id === id);
    if (idx >= 0) Data.books[idx] = data;
    else Data.books.push(data);

    Data.save();
    this.adminEditing = null;
    this.renderAdminContent();
  },

  adminDeleteBook(id) {
    if (!confirm('Удалить книгу?')) return;
    Data.books = Data.books.filter(b => b.id !== id);
    Data.save();
    this.renderAdminContent();
  },

  renderAdminExport(container) {
    const data = {
      sections: Data.sections,
      lessons: Data.lessons,
      books: Data.books
    };

    container.innerHTML = `
      <div class="admin-form">
        <h3 style="margin-bottom:16px;">Экспорт / Импорт данных</h3>
        <p style="font-size:13px;color:var(--hint-color);margin-bottom:16px;">
          Скопируйте JSON ниже и сохраните в файлы data/sections.json, data/lessons.json, data/books.json. 
          Затем закоммитьте в репозиторий.
        </p>
        <div class="admin-actions" style="padding:0;margin-bottom:12px;">
          <button class="btn-secondary" onclick="App.adminCopyJson()">${Icons.download} Копировать JSON</button>
          <button class="btn-secondary" onclick="App.adminDownloadJson()">${Icons.download} Скачать файл</button>
        </div>
        <div class="form-group">
          <label>Импорт JSON</label>
          <textarea id="importJson" placeholder='Вставьте JSON сюда...' style="min-height:120px;font-family:monospace;font-size:11px;"></textarea>
        </div>
        <button class="btn-primary" style="width:100%;padding:10px;border-radius:var(--radius-btn);border:none;cursor:pointer;" onclick="App.adminImportJson()">Импортировать</button>
        
        <div style="margin-top:24px;">
          <label style="font-size:13px;color:var(--hint-color);display:block;margin-bottom:8px;">Текущие данные (JSON):</label>
          <div class="json-output">${JSON.stringify(data, null, 2)}</div>
        </div>
      </div>
    `;
  },

  adminCopyJson() {
    const data = JSON.stringify({ sections: Data.sections, lessons: Data.lessons, books: Data.books }, null, 2);
    navigator.clipboard.writeText(data).then(() => {
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      alert('JSON скопирован!');
    });
  },

  adminDownloadJson() {
    const data = JSON.stringify({ sections: Data.sections, lessons: Data.lessons, books: Data.books }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'app_data.json';
    a.click();
    URL.revokeObjectURL(url);
  },

  adminImportJson() {
    const text = document.getElementById('importJson').value.trim();
    if (!text) return;
    try {
      const data = JSON.parse(text);
      if (data.sections) Data.sections = data.sections;
      if (data.lessons) Data.lessons = data.lessons;
      if (data.books) Data.books = data.books;
      Data.save();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      alert('Данные импортированы!');
      this.renderAdminContent();
    } catch (e) {
      alert('Ошибка JSON: ' + e.message);
    }
  }
};

/* ═══════════════════════════════════════════════════════════
   ЗАПУСК
═══════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  App.init();
});

// Восстановление размера шрифта
const savedFontSize = Storage.get('fontSize');
if (savedFontSize) document.body.style.fontSize = savedFontSize + 'px';
</script>
</body>
</html>
