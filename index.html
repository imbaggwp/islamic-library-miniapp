<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css">

<style>
  :root {
    --bg: #faf7f2;
    --bg-card: #ffffff;
    --bg-elevated: #f5f0e8;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #0f766e;
    --accent-light: #14b8a6;
    --accent-bg: #f0fdfa;
    --gold: #b08d57;
  }
  [data-theme="dark"] {
    --bg: #111827;
    --bg-card: #1f2937;
    --bg-elevated: #111827;
    --text: #f3f4f6;
    --text-muted: #9ca3af;
    --border: #374151;
    --accent: #14b8a6;
    --accent-light: #5eead4;
    --accent-bg: #042f2e;
    --gold: #d4a574;
  }
  [data-theme="sepia"] {
    --bg: #f5ecd7;
    --bg-card: #fbf5e4;
    --bg-elevated: #ede0c4;
    --text: #44351f;
    --text-muted: #7a6547;
    --border: #d9c9a3;
    --accent: #8b6f3e;
    --accent-light: #b08d57;
    --accent-bg: #f5ecd7;
    --gold: #8b6f3e;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    overscroll-behavior: none;
    transition: background 0.3s, color 0.3s;
  }
  .font-arabic { font-family: 'Amiri', serif; direction: rtl; }
  #app {
    min-height: 100vh;
    padding-bottom: 180px;
    max-width: 640px;
    margin: 0 auto;
    position: relative;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--accent);
    color: white;
    border-radius: 12px;
    padding: 12px 20px;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  .btn-primary:active { opacity: 0.8; }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 4px;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 500;
    transition: color 0.2s;
    background: none;
    border: none;
    cursor: pointer;
  }
  .nav-item.active { color: var(--accent); }
  .nav-item svg { width: 24px; height: 24px; }
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    display: flex;
    max-width: 640px;
    margin: 0 auto;
    z-index: 40;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .mini-player {
    position: fixed;
    bottom: 64px;
    left: 0;
    right: 0;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    display: none;
    align-items: center;
    gap: 12px;
    z-index: 39;
    max-width: 640px;
    margin: 0 auto;
    cursor: pointer;
  }
  .mini-player.active { display: flex; }
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    cursor: pointer;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.1s linear;
  }
  .section-card {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 14px;
    color: white;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .section-card:active { transform: scale(0.97); }
  .section-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.7) 100%);
    z-index: 1;
  }
  .section-card > * { position: relative; z-index: 2; }
  .pattern-bg {
    background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%230f766e' fill-opacity='0.05' fill-rule='evenodd'%3E%3Cpath d='M20 0l20 20-20 20L0 20z'/%3E%3C/g%3E%3C/svg%3E");
  }
  .reader-page {
    background: var(--bg-card);
    padding: 28px 24px;
    min-height: 60vh;
    font-size: 17px;
    line-height: 1.8;
    color: var(--text);
  }
  [data-theme="sepia"] .reader-page { background: #fbf5e4; }
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .slide-up { animation: slideUp 0.3s ease; }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--bg-elevated);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
  }
  .chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  input, textarea, select {
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    width: 100%;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  ::-webkit-scrollbar { width: 0; height: 0; }
  .divider { height: 1px; background: var(--border); margin: 12px 0; }
  .stat-circle {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) var(--pct), var(--border) 0);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .stat-circle::before {
    content: '';
    position: absolute;
    inset: 8px;
    background: var(--bg-card);
    border-radius: 50%;
  }
  .stat-circle > span { position: relative; font-weight: 700; font-size: 18px; }
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .admin-badge {
    background: linear-gradient(135deg, var(--gold), #d4a574);
    color: white;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .skeleton {
    background: linear-gradient(90deg, var(--bg-elevated) 0%, var(--border) 50%, var(--bg-elevated) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 8px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>

// ============ AUDIO PLAYER ============
const audio = new Audio();
audio.preload = 'metadata';

audio.addEventListener('timeupdate', () => {
  if (!state.currentLesson) return;
  const pct = (audio.currentTime / audio.duration) * 100 || 0;
  const mp = document.getElementById('mp-progress');
  if (mp) mp.style.width = pct + '%';
  updatePlayerUI();
});

audio.addEventListener('ended', () => {
  if (state.currentLesson) {
    saveProgress(state.currentLesson.id, 'lesson', state.currentLesson.duration, 100);
    playNextInQueue();
  }
});

audio.addEventListener('loadedmetadata', () => {
  const saved = state.progress[state.currentLesson?.id];
  if (saved && saved.position > 0 && saved.position < audio.duration - 5) {
    audio.currentTime = saved.position;
  }
  updatePlayerUI();
});

function playLesson(lesson) {
  state.currentLesson = lesson;
  localStorage.setItem('currentLesson', JSON.stringify(lesson));
  audio.src = lesson.audioUrl;
  audio.playbackRate = state.playbackSpeed;
  audio.play().catch(e => console.log('Play error:', e));
  document.getElementById('mini-player').classList.add('active');
  updatePlayerUI();
  showToast('▶ Воспроизведение: ' + lesson.title);
  addToHistory({ type: 'lesson', id: lesson.id, title: lesson.title, at: Date.now() });
}

function togglePlay() {
  if (!state.currentLesson) return;
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
  updatePlayerUI();
}

function seek(delta) {
  if (!state.currentLesson) return;
  audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + delta));
}

function setSpeed(speed) {
  state.playbackSpeed = speed;
  audio.playbackRate = speed;
  localStorage.setItem('playbackSpeed', speed);
  updatePlayerUI();
  showToast('Скорость: ' + speed + 'x');
}

function updatePlayerUI() {
  const icon = document.getElementById('mp-play-icon');
  if (icon) {
    if (audio.paused) {
      icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    } else {
      icon.innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
    }
  }
  if (state.currentLesson) {
    const t = document.getElementById('mp-title');
    const s = document.getElementById('mp-speaker');
    if (t) t.textContent = state.currentLesson.title;
    if (s) s.textContent = state.currentLesson.speaker;
  }
  // Update full player if open
  const fp = document.getElementById('full-player');
  if (fp && fp.style.display !== 'none') renderFullPlayer();
}

function playNextInQueue() {
  // Simple: find next lesson in same subsection
  if (!state.currentLesson) return;
  const idx = LESSONS.findIndex(l => l.id === state.currentLesson.id);
  if (idx >= 0 && idx < LESSONS.length - 1) {
    playLesson(LESSONS[idx + 1]);
  }
}

// ============ PROGRESS ============
function saveProgress(id, type, position, progressPct) {
  state.progress[id] = { type, position, progressPct, updatedAt: Date.now() };
  localStorage.setItem('progress', JSON.stringify(state.progress));
}

function addToHistory(item) {
  state.history = [item, ...state.history.filter(h => h.id !== item.id || h.type !== item.type)].slice(0, 50);
  localStorage.setItem('history', JSON.stringify(state.history));
}

function toggleBookmark(bookId, page) {
  const key = bookId + '_' + page;
  if (state.bookmarks[key]) {
    delete state.bookmarks[key];
    showToast('🔖 Закладка удалена');
  } else {
    state.bookmarks[key] = { bookId, page, at: Date.now() };
    showToast('🔖 Закладка добавлена');
  }
  localStorage.setItem('bookmarks', JSON.stringify(state.bookmarks));
}

// ============ ROUTER ============
function navigate(route, params = {}) {
  state.route = route;
  state.params = params;
  render();
  window.scrollTo(0, 0);
  // Update nav
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.route === route || 
      (route === 'section' && n.dataset.route === 'home') ||
      (route === 'lesson' && n.dataset.route === 'home') ||
      (route === 'book' && n.dataset.route === 'home'));
  });
  // Haptic
  if (tg?.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('light'); } catch(e) {}
  }
}

function openFullPlayer() {
  state.route = 'player';
  render();
}

// ============ UTILS ============
function formatTime(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

function getStats() {
  const lessons = Object.values(state.progress).filter(p => p.type === 'lesson');
  const books = Object.values(state.progress).filter(p => p.type === 'book');
  const totalListenSec = lessons.reduce((s, p) => s + (p.position || 0), 0);
  const totalPages = books.reduce((s, p) => s + (p.position || 0), 0);
  const completedLessons = lessons.filter(p => p.progressPct >= 95).length;
  const completedBooks = books.filter(p => p.progressPct >= 95).length;
  return {
    listenHours: Math.round(totalListenSec / 3600 * 10) / 10,
    totalPages,
    completedLessons,
    completedBooks,
    totalLessons: lessons.length,
    totalBooks: books.length
  };
}

// ============ RENDER ============
function render() {
  const app = document.getElementById('app');
  let html = '';
  switch(state.route) {
    case 'home': html = renderHome(); break;
    case 'search': html = renderSearch(); break;
    case 'progress': html = renderProgress(); break;
    case 'settings': html = renderSettings(); break;
    case 'section': html = renderSection(); break;
    case 'lesson-list': html = renderLessonList(); break;
    case 'player': html = renderFullPlayer(); break;
    case 'book': html = renderBook(); break;
    case 'admin': html = renderAdmin(); break;
    default: html = renderHome();
  }
  app.innerHTML = html;
}

function renderBook() {
  const book = BOOKS.find(b => b.id === state.params.id);
  if (!book) return '<div style="padding:40px;text-align:center">Книга не найдена</div>';
  const content = BOOK_CONTENT[book.id] || Array.from({length: 5}, (_, i) => `Страница ${i+1}\n\nСодержимое книги "${book.title}"...`);
  const prog = state.progress[book.id] || { position: 0, progressPct: 0 };
  const currentPage = Math.max(0, Math.min(content.length - 1, prog.position || 0));
  const theme = state.theme;
  const isBookmarked = state.bookmarks[book.id + '_' + currentPage];

  return `
    <div class="fade-in" style="min-height:100vh">
      <div style="position:sticky;top:0;background:var(--bg-card);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:10">
        <button onclick="navigate('home')" style="background:none;border:none;color:var(--accent);padding:8px;cursor:pointer">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${book.title}</div>
          <div style="font-size:11px;color:var(--text-muted)">Стр. ${currentPage + 1} из ${content.length}</div>
        </div>
        <button onclick="toggleBookmark('${book.id}', ${currentPage});render()" style="background:none;border:none;font-size:20px;cursor:pointer;padding:8px">${isBookmarked ? '🔖' : '📑'}</button>
      </div>

      <div class="reader-page" style="margin:16px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.05)">
        <div style="white-space:pre-wrap;font-size:17px;line-height:1.9">${content[currentPage]}</div>
      </div>

      <div style="padding:16px 20px;display:flex;gap:10px;align-items:center">
        <button onclick="changeBookPage(${book.id}, ${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''} style="flex:1;padding:12px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border);color:var(--text);font-weight:600;cursor:pointer;opacity:${currentPage === 0 ? 0.4 : 1}">← Назад</button>
        <div style="font-size:13px;color:var(--text-muted);padding:0 8px">${currentPage + 1}/${content.length}</div>
        <button onclick="changeBookPage(${book.id}, ${currentPage + 1})" ${currentPage >= content.length - 1 ? 'disabled' : ''} style="flex:1;padding:12px;border-radius:12px;background:var(--accent);border:none;color:white;font-weight:600;cursor:pointer;opacity:${currentPage >= content.length - 1 ? 0.4 : 1}">Далее →</button>
      </div>

      <div style="padding:0 20px 20px">
        <div class="progress-bar">
          <div class="progress-fill" style="width:${((currentPage + 1) / content.length) * 100}%"></div>
        </div>
        <div style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:8px">Прогресс: ${Math.round(((currentPage + 1) / content.length) * 100)}%</div>
      </div>
    </div>
  `;
}

function changeBookPage(bookId, page) {
  const book = BOOKS.find(b => b.id === bookId);
  if (!book) return;
  const content = BOOK_CONTENT[bookId] || [];
  if (page < 0 || page >= content.length) return;
  const pct = ((page + 1) / content.length) * 100;
  saveProgress(bookId, 'book', page, pct);
  addToHistory({ type: 'book', id: bookId, title: book.title, at: Date.now() });
  render();
}

          </button>
        ` : ''}
        <button onclick="if(confirm('Сбросить весь прогресс?')){localStorage.clear();location.reload()}" style="width:100%;padding:16px;background:none;border:none;color:#dc2626;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center">
          <span style="font-size:20px">🗑️</span>
          <span style="font-weight:500">Сбросить прогресс</span>
        </button>
      </div>

      <div class="card" style="padding:16px;margin-bottom:16px">
        <div style="font-size:14px;font-weight:600;margin-bottom:8px">О приложении</div>
        <div style="font-size:13px;color:var(--text-muted);line-height:1.6">
          <div>IlmHub · Версия 1.0</div>
          <div style="margin-top:4px">Платформа исламских знаний</div>
          <div style="margin-top:8px;font-size:12px">Telegram Mini App</div>
        </div>
      </div>
    </div>
  `;
}

function renderAdmin() {
  if (!state.user.isAdmin) return '<div style="padding:40px;text-align:center">Доступ запрещён</div>';

  return `
    <div class="fade-in" style="padding:20px">
      <button onclick="navigate('settings')" style="background:none;border:none;color:var(--accent);font-size:14px;font-weight:500;padding:8px 0;display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:12px">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        Назад
      </button>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
        <h1 style="font-size:24px;font-weight:700;margin:0">Админ-панель</h1>
        <span class="admin-badge">ADMIN</span>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px">
        <div class="card" style="padding:16px;text-align:center">
          <div style="font-size:24px;font-weight:700;color:var(--accent)">${LESSONS.length}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px">Уроков</div>
        </div>
        <div class="card" style="padding:16px;text-align:center">
          <div style="font-size:24px;font-weight:700;color:var(--accent)">${BOOKS.length}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px">Книг</div>
        </div>
        <div class="card" style="padding:16px;text-align:center">
          <div style="font-size:24px;font-weight:700;color:var(--accent)">${SECTIONS.length}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px">Разделов</div>
        </div>
        <div class="card" style="padding:16px;text-align:center">
          <div style="font-size:24px;font-weight:700;color:var(--accent)">${Object.keys(state.progress).length}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px">Активных</div>
        </div>
      </div>

      <div class="card" style="padding:20px;margin-bottom:16px">
        <h2 style="font-size:16px;font-weight:600;margin:0 0 14px">➕ Добавить урок</h2>
        <div style="display:flex;flex-direction:column;gap:10px">
          <input type="text" placeholder="Название урока" id="admin-lesson-title">
          <input type="text" placeholder="Спикер" id="admin-lesson-speaker">
          <select id="admin-lesson-section">
            <option value="">Выберите раздел</option>
            ${SECTIONS.map(s => `<option value="${s.id}">${s.title}</option>`).join('')}
          </select>
          <input type="url" placeholder="URL аудиофайла" id="admin-lesson-audio">
          <button class="btn-primary" onclick="adminAddLesson()" style="border:none;cursor:pointer">Добавить урок</button>
        </div>
      </div>

      <div class="card" style="padding:20px;margin-bottom:16px">
        <h2 style="font-size:16px;font-weight:600;margin:0 0 14px">📖 Добавить книгу</h2>
        <div style="display:flex;flex-direction:column;gap:10px">
          <input type="text" placeholder="Название книги" id="admin-book-title">
          <input type="text" placeholder="Автор" id="admin-book-author">
          <select id="admin-book-section">
            <option value="">Выберите раздел</option>
            ${SECTIONS.map(s => `<option value="${s.id}">${s.title}</option>`).join('')}
          </select>
          <input type="number" placeholder="Количество страниц" id="admin-book-pages">
          <button class="btn-primary" onclick="adminAddBook()" style="border:none;cursor:pointer">Добавить книгу</button>
        </div>
      </div>

      <div class="card" style="padding:20px">
        <h2 style="font-size:16px;font-weight:600;margin:0 0 14px">📂 Управление разделами</h2>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${SECTIONS.map(s => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:var(--bg-elevated);border-radius:10px">
              <div style="display:flex;gap:10px;align-items:center">
                <span style="font-size:20px">${s.icon}</span>
                <div>
                  <div style="font-size:14px;font-weight:600">${s.title}</div>
                  <div style="font-size:11px;color:var(--text-muted)">${(SUBSECTIONS[s.id] || []).length} подразделов</div>
                </div>
              </div>
              <button onclick="showToast('Редактирование: ${s.title}')" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;font-weight:500">Изм.</button>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function adminAddLesson() {
  const title = document.getElementById('admin-lesson-title').value;
  const speaker = document.getElementById('admin-lesson-speaker').value;
  const sectionId = document.getElementById('admin-lesson-section').value;
  const audioUrl = document.getElementById('admin-lesson-audio').value;
  if (!title || !speaker || !sectionId) { showToast('Заполните все поля'); return; }
  const newLesson = {
    id: 'l' + (LESSONS.length + 1),
    sectionId,
    subId: (SUBSECTIONS[sectionId] || [])[0]?.id || '',
    title, speaker,
    duration: 1800,
    audioUrl: audioUrl || 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'
  };
  LESSONS.push(newLesson);
  showToast('✓ Урок добавлен');
  render();
}

function adminAddBook() {
  const title = document.getElementById('admin-book-title').value;
  const author = document.getElementById('admin-book-author').value;
  const sectionId = document.getElementById('admin-book-section').value;
  const pages = parseInt(document.getElementById('admin-book-pages').value) || 100;
  if (!title || !author || !sectionId) { showToast('Заполните все поля'); return; }
  const newBook = {
    id: 'b' + (BOOKS.length + 1),
    sectionId,
    subId: (SUBSECTIONS[sectionId] || [])[0]?.id || '',
    title, author, pages,
    cover: 'linear-gradient(135deg, #0f766e, #14b8a6)'
  };
  BOOKS.push(newBook);
  BOOK_CONTENT[newBook.id] = Array.from({length: Math.min(pages, 10)}, (_, i) => `Страница ${i+1}\n\nСодержимое книги "${title}" автора ${author}...`);
  showToast('✓ Книга добавлена');
  render();
}

function setTheme(theme) {
  state.theme = theme;
  document.body.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  if (tg?.setHeaderColor) {
    try {
      const colors = { light: '#faf7f2', dark: '#111827', sepia: '#f5ecd7' };
      tg.setHeaderColor(colors[theme]);
    } catch(e) {}
  }
  render();
}

// ============ INIT ============
document.body.setAttribute('data-theme', state.theme);
if (tg?.setHeaderColor) {
  try {
    const colors = { light: '#faf7f2', dark: '#111827', sepia: '#f5ecd7' };
    tg.setHeaderColor(colors[state.theme]);
  } catch(e) {}
}

// Restore current lesson
if (state.currentLesson) {
  audio.src = state.currentLesson.audioUrl;
  audio.playbackRate = state.playbackSpeed;
  document.getElementById('mini-player').classList.add('active');
  const t = document.getElementById('mp-title');
  const s = document.getElementById('mp-speaker');
  if (t) t.textContent = state.currentLesson.title;
  if (s) s.textContent = state.currentLesson.speaker;
}

// Auto-save progress every 5 seconds
setInterval(() => {
  if (state.currentLesson && !audio.paused) {
    const pct = (audio.currentTime / audio.duration) * 100 || 0;
    saveProgress(state.currentLesson.id, 'lesson', audio.currentTime, pct);
  }
}, 5000);

// Initial render
render();
</script>

</body>
</html>
