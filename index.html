<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Уроки и Книги</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
    --bg-primary: #f3f4f6;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f9fafb;
    --text-primary: #111827;
    --text-secondary: #6b7280;
    --text-tertiary: #9ca3af;
    --border: #e5e7eb;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --purple: #8b5cf6;
    --pink: #ec4899;
    --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    --gradient-4: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    --gradient-5: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
    --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(255, 255, 255, 0.3);
}

[data-theme="dark"] {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-tertiary: #334155;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-tertiary: #64748b;
    --border: #334155;
    --glass-bg: rgba(30, 41, 59, 0.7);
    --glass-border: rgba(71, 85, 105, 0.3);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5);
    --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overscroll-behavior: none;
    transition: background 0.3s ease, color 0.3s ease;
    min-height: 100vh;
}

.app {
    max-width: 500px;
    margin: 0 auto;
    background: var(--bg-primary);
    min-height: 100vh;
    position: relative;
    padding-bottom: 80px;
}

.header {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header-info h1 { font-size: 18px; font-weight: 700; }
.header-info p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--bg-tertiary);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-primary);
    transition: all 0.2s;
}
.icon-btn:hover { background: var(--border); transform: scale(1.05); }
.icon-btn svg { width: 18px; height: 18px; }

.content { padding: 16px; }

.tab { display: none; animation: slideIn 0.3s ease; }
.tab.active { display: block; }

@keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes wave {
    0% { transform: scaleY(0.3); }
    50% { transform: scaleY(1); }
    100% { transform: scaleY(0.3); }
}

.nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    max-width: 500px;
    margin: 0 auto;
    display: flex;
    justify-content: space-around;
    padding: 8px 4px;
    z-index: 10;
}
.nav-btn {
    background: none;
    border: none;
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text-tertiary);
    font-size: 10px;
    font-weight: 500;
    transition: all 0.2s;
    border-radius: 10px;
    min-width: 50px;
}
.nav-btn svg { width: 22px; height: 22px; margin-bottom: 2px; transition: all 0.2s; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active svg { transform: translateY(-2px); }

.card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
    animation: scaleIn 0.3s ease;
    position: relative;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.card-title {
    font-weight: 600;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.card-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; display: flex; align-items: center; gap: 6px; }

.card-menu-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--bg-tertiary);
    border: none;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    transition: all 0.2s;
}
.card-menu-btn:hover { background: var(--border); }
.card-menu-btn svg { width: 16px; height: 16px; }

.editor-mode .card-menu-btn { display: flex; }

.glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    box-shadow: var(--shadow-lg);
}

.gradient-card {
    border-radius: 20px;
    padding: 20px;
    color: white;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
}
.gradient-card::before {
    content: '';
    position: absolute;
    top: -50%; right: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
    pointer-events: none;
}

.btn {
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    width: 100%;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn:active { transform: translateY(0); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--accent); color: white; }
.btn-success { background: var(--success); color: white; }
.btn-purple { background: var(--purple); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); }
.btn-ghost { background: transparent; color: var(--text-primary); border: 1px solid var(--border); }

.btn-sm { padding: 8px 12px; font-size: 12px; width: auto; margin: 0; }

input, textarea, select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 12px;
    background: var(--bg-secondary);
    color: var(--text-primary);
    transition: all 0.2s;
}
input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}
label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--text-secondary);
}

.search-box {
    position: relative;
    margin-bottom: 16px;
}
.search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    color: var(--text-tertiary);
    pointer-events: none;
}
.search-box input {
    padding-left: 42px;
    margin: 0;
}

.progress-bar {
    background: var(--bg-tertiary);
    height: 6px;
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
}
.progress-fill {
    background: var(--gradient-3);
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(59, 130, 246, 0.15);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
}
.badge-success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
.badge-warning { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
.badge-purple { background: rgba(139, 92, 246, 0.15); color: var(--purple); }
.badge svg { width: 12px; height: 12px; }

.modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s;
}
.modal.active { display: flex; }
.modal-content {
    background: var(--bg-secondary);
    border-radius: 24px 24px 0 0;
    padding: 20px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
}
@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}
.modal-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.close-btn {
    background: var(--bg-tertiary);
    border: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-primary);
}
.close-btn svg { width: 16px; height: 16px; }

.context-menu {
    position: fixed;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-xl);
    z-index: 200;
    min-width: 200px;
    animation: scaleIn 0.2s ease;
    overflow: hidden;
}
.context-menu-item {
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    transition: background 0.2s;
    border-bottom: 1px solid var(--border);
}
.context-menu-item:last-child { border-bottom: none; }
.context-menu-item:hover { background: var(--bg-tertiary); }
.context-menu-item svg { width: 18px; height: 18px; color: var(--text-secondary); }
.context-menu-item.danger { color: var(--danger); }
.context-menu-item.danger svg { color: var(--danger); }

.audio-player {
    background: var(--gradient-1);
    border-radius: 20px;
    padding: 24px;
    color: white;
    position: relative;
    overflow: hidden;
}
.audio-player::before {
    content: '';
    position: absolute;
    top: -50%; right: -30%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
}
.audio-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    margin: 20px 0;
    position: relative;
}
.audio-controls button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 48px; height: 48px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
}
.audio-controls button:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }
.audio-controls button svg { width: 22px; height: 22px; }
.play-btn {
    width: 64px !important; height: 64px !important;
    background: white !important;
    color: var(--accent) !important;
}
.play-btn svg { width: 28px !important; height: 28px !important; }

.wave-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 30px;
    margin: 10px 0;
}
.wave-bar {
    width: 3px;
    background: white;
    border-radius: 2px;
    height: 100%;
    transform-origin: center;
}
.wave-bar.playing { animation: wave 1s ease-in-out infinite; }
.wave-bar:nth-child(1) { animation-delay: 0s; }
.wave-bar:nth-child(2) { animation-delay: 0.1s; }
.wave-bar:nth-child(3) { animation-delay: 0.2s; }
.wave-bar:nth-child(4) { animation-delay: 0.3s; }
.wave-bar:nth-child(5) { animation-delay: 0.4s; }
.wave-bar:nth-child(6) { animation-delay: 0.3s; }
.wave-bar:nth-child(7) { animation-delay: 0.2s; }

.speed-selector {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin: 12px 0;
}
.speed-btn {
    padding: 6px 12px;
    background: rgba(255,255,255,0.2);
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
}
.speed-btn.active {
    background: white;
    color: var(--accent);
}

.pdf-viewer {
    background: var(--bg-tertiary);
    min-height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: auto;
}
.pdf-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
}
.pdf-controls button {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    font-size: 13px;
}
.pdf-controls button svg { width: 14px; height: 14px; }

.achievement {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: var(--bg-tertiary);
    border-radius: 12px;
    margin-bottom: 8px;
    transition: all 0.2s;
}
.achievement.earned {
    background: var(--gradient-5);
    color: white;
}
.achievement.earned .ach-desc { color: rgba(255,255,255,0.8); }

.heat-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
}
.heat-cell {
    aspect-ratio: 1;
    border-radius: 3px;
    background: var(--bg-tertiary);
    transition: all 0.2s;
}
.heat-1 { background: #9be9a8; }
.heat-2 { background: #40c463; }
.heat-3 { background: #30a14e; }
.heat-4 { background: #216e39; }

.streak-row {
    display: flex;
    gap: 6px;
    justify-content: space-between;
    margin: 12px 0;
}
.streak-day {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--bg-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
}
.streak-day.active {
    background: var(--gradient-5);
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
}
.streak-day.today {
    border: 2px solid var(--warning);
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    text-align: center;
}
.stat-value { font-size: 24px; font-weight: 700; }
.stat-label { font-size: 11px; opacity: 0.8; margin-top: 2px; }

.ring-container { display: flex; justify-content: center; margin: 10px 0; }

.week-chart {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: 120px;
    gap: 8px;
    padding: 10px 0;
}
.week-bar {
    flex: 1;
    background: var(--bg-tertiary);
    border-radius: 8px 8px 0 0;
    position: relative;
    min-height: 4px;
    transition: all 0.3s;
    overflow: hidden;
}
.week-bar-fill {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--gradient-3);
    border-radius: 8px 8px 0 0;
    transition: height 0.5s ease;
}
.week-label {
    text-align: center;
    font-size: 10px;
    color: var(--text-tertiary);
    margin-top: 6px;
}

.empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-tertiary);
}
.empty-icon {
    width: 64px; height: 64px;
    margin: 0 auto 12px;
    color: var(--text-tertiary);
    opacity: 0.5;
}

.bookmark-item {
    background: var(--bg-tertiary);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}
.bookmark-item:hover { background: var(--border); }

.section {
    margin-bottom: 20px;
}
.section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.section-title svg { width: 14px; height: 14px; }

.quick-action {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 8px;
}
.quick-action:hover { transform: translateX(4px); box-shadow: var(--shadow-md); }
.quick-action-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: white;
    flex-shrink: 0;
}
.quick-action-icon svg { width: 22px; height: 22px; }
.quick-action-content { flex: 1; min-width: 0; }
.quick-action-title { font-weight: 600; font-size: 14px; }
.quick-action-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.subtabs {
    display: flex;
    gap: 4px;
    background: var(--bg-tertiary);
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 16px;
}
.subtab {
    flex: 1;
    padding: 8px;
    background: none;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
}
.subtab svg { width: 14px; height: 14px; }
.subtab.active {
    background: var(--bg-secondary);
    color: var(--text-primary);
    box-shadow: var(--shadow-sm);
}

.toggle {
    position: relative;
    width: 44px;
    height: 24px;
    background: var(--bg-tertiary);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid var(--border);
}
.toggle.active { background: var(--accent); border-color: var(--accent); }
.toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: white;
    border-radius: 50%;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
}
.toggle.active::after { left: 22px; }

.setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: none; }
.setting-label { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.setting-label svg { width: 18px; height: 18px; color: var(--text-secondary); }

.add-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
}
.add-buttons .btn { margin: 0; font-size: 12px; padding: 10px; }

.confirm-modal {
    background: var(--bg-secondary);
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    max-width: 320px;
}
.confirm-icon {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    background: rgba(239, 68, 68, 0.1);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--danger);
}
.confirm-icon svg { width: 32px; height: 32px; }
.confirm-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.confirm-text { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }

// ============ LOCALSTORAGE ============
const DB = {
    get(key, def = []) {
        try { return JSON.parse(localStorage.getItem('la_' + key)) || def; }
        catch { return def; }
    },
    set(key, val) { localStorage.setItem('la_' + key, JSON.stringify(val)); },
    nextId(key) {
        const items = this.get(key);
        return items.length ? Math.max(...items.map(i => i.id)) + 1 : 1;
    }
};

// ============ STATE ============

    booksSubTab: 'all',

// ============ INIT ============
function init() {
    applyTheme();
    checkAdminAccess();
    
    let user = DB.get('user', null);
    if (!user) {
        const name = prompt('Как тебя зовут?') || 'Пользователь';
        user = { id: 1, name, created: new Date().toISOString() };
        DB.set('user', user);
    }
    state.user = user;
    document.getElementById('header-sub').textContent = `Привет, ${user.name}!`;
    
    renderNav();
    renderTab();
}

function checkAdminAccess() {
    const tg = window.Telegram?.WebApp;
    if (tg) {
        const tgUser = tg.initDataUnsafe?.user;
        if (tgUser && ADMIN_TELEGRAM_IDS.includes(tgUser.id)) {
            state.editorMode = true;
        }
    } else {
        state.editorMode = DB.get('editorMode', false);
    }
    updateEditorMode();
}

function updateEditorMode() {
    const app = document.getElementById('app');
    if (state.editorMode) {
        app.classList.add('editor-mode');
    } else {
        app.classList.remove('editor-mode');
    }
}

// ============ THEME ============
function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.theme);
    const btn = document.getElementById('theme-btn');
    btn.innerHTML = state.theme === 'dark' ? icon('sun', 18) : icon('moon', 18);
}

function toggleTheme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('la_theme', state.theme);
    applyTheme();
}

// ============ NAV ============
function renderNav() {
    const tabs = [
        { id: 'home', label: 'Главная', icon: 'home' },
        { id: 'lessons', label: 'Уроки', icon: 'headphones' },
        { id: 'books', label: 'Книги', icon: 'book' },
        { id: 'progress', label: 'Прогресс', icon: 'chart' },
        { id: 'profile', label: 'Профиль', icon: 'user' }
    ];
    document.getElementById('main-nav').innerHTML = tabs.map(t => `
        <button class="nav-btn ${state.currentTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')">
            ${icon(t.icon, 22)}
            <span>${t.label}</span>
        </button>
    `).join('');
}

function switchTab(tab) {
    state.currentTab = tab;
    state.currentCategory = null;
    state.searchQuery = '';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    renderNav();
    renderTab();
}

function renderTab() {
    const map = {
        home: renderHome,
        lessons: renderLessons,
        books: renderBooks,
        progress: renderProgress,
        profile: renderProfile
    };
    (map[state.currentTab] || renderHome)();
}

// ============ UTILS ============
function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatDuration(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
}

function getProgress(type, id) {
    return DB.get('progress').find(p => p.type === type && p.contentId === id);
}

function saveProgress(type, id, percent, position, completed) {
    const all = DB.get('progress');
    const idx = all.findIndex(p => p.type === type && p.contentId === id);
    const data = {
        type, contentId: id, percent, position,
        completed: completed || false,
        lastAccess: new Date().toISOString(),
        date: new Date().toISOString().split('T')[0]
    };
    if (idx >= 0) all[idx] = { ...all[idx], ...data };
    else all.push(data);
    DB.set('progress', all);
    checkAchievements();
}

function isFavorite(type, id) {
    return DB.get('favorites').some(f => f.type === type && f.contentId === id);
}

function toggleFavorite(type, id) {
    let favs = DB.get('favorites');
    const idx = favs.findIndex(f => f.type === type && f.contentId === id);
    if (idx >= 0) favs.splice(idx, 1);
    else favs.push({ type, contentId: id, added: new Date().toISOString() });
    DB.set('favorites', favs);
}

function getCategories() { return DB.get('categories'); }
function getLessons() { return DB.get('lessons'); }
function getBooks() { return DB.get('books'); }

function buildTree(parentId = null) {
    const cats = getCategories();
    return cats
        .filter(c => (c.parentId || null) === parentId)
        .sort((a, b) => (a.order || 0) - (b.order || 0))
        .map(c => ({
            ...c,
            children: buildTree(c.id),
            lessons: getLessons().filter(l => l.categoryId === c.id),
            books: getBooks().filter(b => b.categoryId === c.id)
        }));
}

function findCategory(id) { return getCategories().find(c => c.id === id); }

function getAllDescendantIds(catId) {
    const cats = getCategories();
    const result = [catId];
    cats.filter(c => c.parentId === catId).forEach(ch => result.push(...getAllDescendantIds(ch.id)));
    return result;
}

function getCategoryPath(catId) {
    const path = [];
    let cur = findCategory(catId);
    while (cur) { path.unshift(cur); cur = cur.parentId ? findCategory(cur.parentId) : null; }
    return path;
}

function countItemsInTree(cat, type) {
    let count = (type === 'lesson' ? cat.lessons : cat.books).length;
    cat.children.forEach(ch => count += countItemsInTree(ch, type));
    return count;
}

function getAllLessons() {
    const tree = buildTree(null);
    const flat = [];
    const walk = (nodes) => nodes.forEach(n => {
        n.lessons.forEach(l => flat.push({ ...l, categoryName: n.title, categoryEmoji: n.emoji }));
        walk(n.children);
    });
    walk(tree);
    return flat;
}

function getAllBooks() {
    const tree = buildTree(null);
    const flat = [];
    const walk = (nodes) => nodes.forEach(n => {
        n.books.forEach(b => flat.push({ ...b, categoryName: n.title, categoryEmoji: n.emoji }));
        walk(n.children);
    });
    walk(tree);
    return flat;
}

// ============ CONTEXT MENU ============
function showContextMenu(event, items) {
    event.stopPropagation();
    const menu = document.getElementById('context-menu');
    menu.innerHTML = items.map(item => `
        <div class="context-menu-item ${item.danger ? 'danger' : ''}" onclick="${item.action}">
            ${icon(item.icon, 18)}
            <span>${item.label}</span>
        </div>
    `).join('');
    
    const rect = event.target.getBoundingClientRect();
    menu.style.display = 'block';
    menu.style.left = Math.min(rect.left, window.innerWidth - 220) + 'px';
    menu.style.top = (rect.bottom + 4) + 'px';
    
    setTimeout(() => {
        document.addEventListener('click', hideContextMenu, { once: true });
    }, 0);
}

function hideContextMenu() {
    document.getElementById('context-menu').style.display = 'none';
}

function showConfirm(title, text, onConfirm) {
    const modal = document.getElementById('modal');
    const body = document.getElementById('modal-body');
    
    body.innerHTML = `
        <div class="confirm-modal">
            <div class="confirm-icon">${icon('trash', 32)}</div>
            <div class="confirm-title">${title}</div>
            <div class="confirm-text">${text}</div>
            <div class="confirm-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn btn-danger" id="confirm-btn">Удалить</button>
            </div>
        </div>
    `;
    
    modal.classList.add('active');
    document.getElementById('confirm-btn').onclick = () => {
        closeModal();
        onConfirm();
    };
}

function renderStreakDays(streak) {
    const days = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    const today = new Date();
    const todayIdx = (today.getDay() + 6) % 7;
    
    return days.map((d, i) => {
        const isActive = i <= todayIdx && i >= todayIdx - streak.count + 1;
        const isToday = i === todayIdx;
        return `
            <div class="streak-day ${isActive ? 'active' : ''} ${isToday ? 'today' : ''}" title="${d}">
                ${isActive ? '🔥' : ''}
            </div>
        `;
    }).join('');
}

function calculateStreak() {
    const progress = DB.get('progress');
    const dates = [...new Set(progress.map(p => p.date))].sort().reverse();
    if (dates.length === 0) return { count: 0 };
    
    let count = 0;
    const today = new Date();
    today.setHours(0,0,0,0);
    
    for (let i = 0; i < 365; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const key = d.toISOString().split('T')[0];
        if (dates.includes(key)) count++;
        else if (i === 0) continue;
        else break;
    }
    return { count };
}

function openRandomLesson() {
    const lessons = getAllLessons();
    if (lessons.length === 0) return;
    const l = lessons[Math.floor(Math.random() * lessons.length)];
    state.currentCategory = l.categoryId;
    openLesson(l.id);
}

function openRandomBook() {
    const books = getAllBooks();
    if (books.length === 0) return;
    const b = books[Math.floor(Math.random() * books.length)];
    state.currentCategory = b.categoryId;
    openBook(b.id);
}
